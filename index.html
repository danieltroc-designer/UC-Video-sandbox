<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uploadcare Title Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link id="fontCss" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=block" />
  <link rel="stylesheet" href="src/styles.css" />
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 93 94" aria-hidden="true">
          <path fill="#FFCF3E" d="M23.5 1h10v10h-10zM35.3 1h10v10h-10zM47 1h10v10H47zM58.8 1h10v10h-10zM0 24.5h10v10H0zM0 36.2h10v10H0zM0 48h10v10H0zM0 59.8h10v10H0zM11.8 12.7h10v10h-10zM11.8 24.5h10v10h-10zM11.8 36.2h10v10h-10zM11.8 48h10v10h-10zM11.8 59.8h10v10h-10zM11.8 71.5h10v10h-10zM23.5 12.7h10v10h-10zM23.5 24.5h10v10h-10zM23.5 36.2h10v10h-10zM23.5 48h10v10h-10zM23.5 59.8h10v10h-10zM23.5 71.5h10v10h-10zM23.5 83.3h10v10h-10zM35.3 12.7h10v10h-10zM35.3 24.5h10v10h-10zM35.3 59.8h10v10h-10zM35.3 71.5h10v10h-10zM35.3 83.3h10v10h-10zM47 12.7h10v10H47zM47 24.5h10v10H47zM47 59.8h10v10H47zM47 71.5h10v10H47zM47 83.3h10v10H47zM58.8 12.7h10v10h-10zM58.8 24.5h10v10h-10zM58.8 36.2h10v10h-10zM58.8 48h10v10h-10zM58.8 59.8h10v10h-10zM58.8 71.5h10v10h-10zM58.8 83.3h10v10h-10zM70.6 12.7h10v10h-10zM70.6 24.5h10v10h-10zM70.6 36.2h10v10h-10zM70.6 48h10v10h-10zM70.6 59.8h10v10h-10zM70.6 71.5h10v10h-10zM82.3 24.5h10v10h-10zM82.3 36.2h10v10h-10zM82.3 48h10v10h-10zM82.3 59.8h10v10h-10z"/>
        </svg>
        <span class="brand-name">Title Studio</span>
      </div>
      <div class="top-actions">
        <div class="select"><select id="format" aria-label="Format"></select></div>
        <div class="select"><select id="fps" aria-label="Frame rate"></select></div>
        <button id="snapshot" class="btn icon ghost" type="button" title="Save current frame as PNG" aria-label="Save current frame as PNG">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h1.6l1-1.5h4.8l1 1.5H15a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 15 16H5a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10.3" r="2.9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button id="export" class="btn primary" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M10 3.5v9m0 0l-3.5-3.5M10 12.5l3.5-3.5M4 15.5h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Export MP4
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="viewer">
        <div class="stage-wrap" id="stageWrap">
          <canvas id="stage" width="1920" height="1080"></canvas>
          <p class="boot-error" id="bootError" hidden></p>
        </div>

        <div class="transport">
          <div class="transport-buttons">
            <button id="restart" class="btn icon ghost" type="button" title="Restart (Home)" aria-label="Restart">
              <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 4.5v11M15.5 4.8v10.4a.6.6 0 0 1-.92.5L7.6 10.5a.6.6 0 0 1 0-1l6.98-5.2a.6.6 0 0 1 .92.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="play" class="btn icon play" type="button" title="Play / pause (Space)" aria-label="Pause">
              <svg class="i-play" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M6.5 4.6v10.8a.7.7 0 0 0 1.07.6l8.5-5.4a.7.7 0 0 0 0-1.2l-8.5-5.4a.7.7 0 0 0-1.07.6z" fill="currentColor"/></svg>
              <svg class="i-pause" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="5.5" y="4.5" width="3" height="11" rx="1" fill="currentColor"/><rect x="11.5" y="4.5" width="3" height="11" rx="1" fill="currentColor"/></svg>
            </button>
          </div>
          <div class="time"><span id="cur">0:00.00</span><span class="time-sep">/</span><span id="dur">0:00.00</span></div>
          <div class="timeline" id="timeline">
            <div class="timeline-track"></div>
            <div class="segments" id="segments"></div>
            <div class="playhead" id="playhead"></div>
          </div>
          <button id="loop" class="btn icon ghost is-active" type="button" title="Loop" aria-label="Loop" aria-pressed="true">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M14.5 4.5l2 2-2 2M16.5 6.5H7a3.5 3.5 0 0 0-3.5 3.5M5.5 15.5l-2-2 2-2M3.5 13.5H13a3.5 3.5 0 0 0 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-scroll" id="controls"></div>
        <footer class="sidebar-foot">
          <span class="shortcuts"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> frame</span>
          <button id="reset" class="btn small ghost" type="button">Reset all</button>
        </footer>
      </aside>
    </main>
  </div>

  <div class="modal" id="exportModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
      <div class="modal-head">
        <h2 id="exportTitle">Exporting video</h2>
        <span class="modal-pct" id="exportPct">0%</span>
      </div>
      <div class="progress"><div class="progress-bar" id="exportBar"></div></div>
      <p class="modal-status" id="exportStatus"></p>
      <div class="modal-actions">
        <button id="exportCancel" class="btn small ghost" type="button">Cancel</button>
      </div>
    </div>
  </div>
</body>
</html>
