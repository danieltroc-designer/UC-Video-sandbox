  /* =======================================================================
     Simplified booth loop — card-specific styles (dropin/features/quote2/
     logos/scale/cta). The install card reuses the existing .in-* styles.
     ======================================================================= */

  /* ---- shared primitives (the reference's quality bar) ---- */
  .panel{background:var(--panel-fg);border-radius:var(--panel-radius);box-shadow:var(--shadow-floating)}
  .tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-weight:500;
    font-size:14px;letter-spacing:.02em;color:#8b8b93;background:#1f1f22;border:1px solid var(--line);
    border-radius:8px;padding:5px 11px;white-space:nowrap}
  .tag.brand{color:var(--brand)}
  .tag.ok{color:var(--ok)}

  /* =======================================================================
     Pipeline card — the website's three-panel demo (upload | analyse | deliver),
     ported for the booth loop: it plays once when the card is entered and has
     no replay control.

     Geometry is the site's, scaled ~1.35x for the 1920x1080 stage and for
     viewing across a stand: the site's 13px mono would be unreadable at that
     distance, so the type is set at 20px and the boxes grew to match.
     Choreographed by setupPipeline(); colours mirror the site's tokens.
     ======================================================================= */
  .pd-wrap{position:absolute;inset:0}

  .pd-shell{
    position:absolute;left:334px;top:384px;width:1252px;height:554px;
    border-radius:39px;background:#0c0c0c;border:1px solid rgba(255,255,255,.05);
    padding:11px;overflow:hidden;
  }
  /* the uploaded photo, blurred right down — a wash of the file's own colour
     that wipes upward in lockstep with the progress bar */
  .pd-bgwrap{position:absolute;left:50%;top:50%;width:340px;height:440px;
    transform:translate(-50%,-50%);filter:blur(15px);opacity:.1;pointer-events:none;z-index:0}
  .pd-bg{width:100%;height:100%;border-radius:32px;overflow:hidden;clip-path:inset(0 0 100% 0)}
  .pd-bg img{width:100%;height:100%;object-fit:cover}

  .pd-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr .8fr 1fr;gap:24px;height:100%}
  .pd-cell{position:relative;border-radius:27px;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.05);
    padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  .pd-cell.mid{background:transparent;box-shadow:none;padding:0;overflow:visible;gap:20px}
  .pd-inner{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative}

  /* ---- left: the drop ---- */
  .pd-cursor{position:absolute;left:50%;top:50%;width:76.5px;height:99.5px;z-index:2;pointer-events:none;opacity:0}
  .pd-cursor-thumb{width:100%;height:100%;border-radius:8px;overflow:hidden;
    box-shadow:0 25px 50px -12px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.13);background:#181818}
  .pd-cursor-thumb img{width:100%;height:100%;object-fit:cover}
  .pd-cursor-ic{position:absolute;bottom:-8.9px;right:-6.4px;width:12.9px;height:17.9px;
    filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
  .pd-cursor-ic svg{width:100%;height:100%;display:block}

  .pd-zone{position:relative;width:258px;height:333px;border-radius:27px;
    border:1px dashed rgba(255,255,255,.13);overflow:hidden;transition:border-color .3s ease}
  .pd-zone[data-state="active"]{border-color:rgba(255,255,255,.25)}
  .pd-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:15px;text-transform:uppercase;letter-spacing:.05em;
    color:rgba(255,255,255,.25);transition:color .3s ease}
  .pd-zone[data-state="active"] .pd-ph{color:rgba(255,255,255,.5)}
  .pd-shot{width:100%;height:100%;object-fit:cover;border-radius:26px;padding:5px 8px;opacity:0}
  .pd-track{position:absolute;bottom:21px;left:21px;right:21px;height:6px;padding:2px;
    border-radius:999px;background:rgba(0,0,0,.2);backdrop-filter:blur(5px);overflow:hidden;opacity:0}
  .pd-fill{height:100%;background:rgba(255,255,255,.9);border-radius:999px;
    transform-origin:left center;transform:scaleX(0)}
  .pd-ctl{position:absolute;top:20px;right:21px;display:flex;gap:2px;opacity:0}
  .pd-btn{width:32px;height:32px;background:rgba(9,9,9,.8);border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:#fff}
  .pd-btn svg{width:14px;height:14px;display:block}
  .pd-status{display:flex;align-items:center;gap:12px;margin-top:16px;font-family:var(--mono);opacity:0}
  .pd-status i{width:8px;height:8px;background:#4ade80}
  .pd-status span{font-size:14px;color:#a7a7a7;text-transform:uppercase;letter-spacing:.05em}

  /* ---- middle: the analysis ---- */
  .pd-pixel{width:100px;height:130px;opacity:0}
  .pd-pixel canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  .pd-prog{display:flex;align-items:center;justify-content:center;width:100%;margin:20px 0}
  .pd-prog-side{flex:1;display:flex;justify-content:center}
  .pd-dots{display:inline-flex;align-items:center;gap:4px}
  .pd-dots i{width:3px;height:3px;background:rgba(255,255,255,.13)}
  .pd-dots[data-state="working"] i{background:rgba(255,255,255,.25);
    animation:pdDot 1s ease-in-out infinite backwards}
  @keyframes pdDot{0%,85%,100%{opacity:.1}30%{opacity:1}}
  .pd-donut{flex-shrink:0;width:30px;height:30px}
  .pd-donut .c{fill:rgba(255,255,255,.13)}
  .pd-donut .c.lit{fill:#ffcf3e}
  .pd-analysis{text-align:center;font-family:var(--mono);font-size:15px;color:#a7a7a7;
    text-transform:uppercase;line-height:20px;padding-bottom:30px}
  .pd-analysis p{opacity:0}
  .pd-analysis b{font-weight:inherit;color:#fff}

  /* ---- right: the delivery ---- */
  /* 15px is the ceiling here, not a preference: the UUID row is 37 monospace
     characters and at anything larger it runs past the 358px the column has to
     give. The storyboard sets it at 13px. */
  /* flex:none matters — the URL block grows a row per transform, and without it
     the picture is what gives way */
  .pd-stage{position:relative;flex:none;width:230px;height:297px;margin-top:16px;opacity:0}
  .pd-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
  /* Two pages, not one block. The whole tag — bracket, host, UUID, three
     transforms, closing bracket — is seven rows, and after the picture and its
     margins the column only has room for about six; the tail was being cut off
     by .pd-cell's overflow. Paging it fixes the clipping and is the better read
     anyway: you see the plain file's URL, it clears, and the transforms build in
     its place, so the ops aren't competing with the address for attention.

     The opening `<img src="` sits outside both pages and never leaves. It is
     what stops page two reading as three orphaned lines of text: with the
     address gone, `-/crop/face/...` on its own is not obviously part of a URL,
     and the closing bracket that would say so does not arrive until the last op
     is in. Keeping the tag open also gives the swap an anchor — the bracket
     holds while the body changes underneath it, rather than the whole block
     turning over at once.

     Both pages are absolutely positioned inside a fixed four-row body (four is
     the taller page: three ops plus the closing bracket), so the swap costs no
     reflow and the picture above never shifts. The explicit width is needed
     because .pd-cell centres its children — a box with only absolute content
     collapses to nothing.

     The 12.5px top margin is the 32px the frame asks for, less the 19.5px row
     the persistent bracket adds. The cell centres its column, so a taller URL
     block would otherwise lift the picture ~10px off the y the storyboard puts
     it at (check_pipeline.py catches exactly this). Trading the margin keeps the
     column's total height, and hence the picture, where it was; the visible gap
     barely changes because the photo is `contain`-fitted and already sits well
     inside the bottom of its 297px box. */
  .pd-url{position:relative;width:100%;height:97.5px;margin-top:12.5px;
    font-family:var(--mono);font-size:15px;line-height:19.5px}
  .pd-body{position:relative;height:78px}
  .pd-u1,.pd-u2{position:absolute;left:0;right:0;top:0}
  .pd-url .row{margin:0;display:flex;flex-wrap:nowrap;white-space:nowrap}
  .pd-url .bracket{color:rgba(255,255,255,.25)}
  .pd-url .indent{padding-left:20px}
  .pd-url .host{color:#a7a7a7}
  .pd-url .dim{color:#a7a7a7}
  .pd-url .id{color:#fff}
  .pd-url .op{color:#ffd864}
  .pd-url .arg{color:#a7a7a7}
  /* each op holds its line from the start and is clipped, not grown: the rows
     below never move, and nothing here animates layout */
  .pd-url .tf{opacity:0;clip-path:inset(0 0 100% 0)}
  .pd-url .st{opacity:0}
  .pd-url .cl{opacity:0}

  /* ---- the compliance marks along the bottom ---- */
  /* pinned at the storyboard's own x/y rather than laid out as a row: the three
     marks have very different bounding boxes and it centres them optically */
  .pd-badge{position:absolute;opacity:0;transform:translateY(10px);
    transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out);
    transition-delay:calc(.62s + var(--i,0)*.09s)}
  .pd-badge svg{width:100%;height:100%;display:block}
  .slide.active .pd-badge{opacity:.5;transform:none}

  /* =======================================================================
     The storyboard headline block.

     Figma trims both texts to their cap box, which is why the title measures
     64px tall at 88px type. text-box-trim reproduces that exactly, so the
     title's cap-top lands on y=168 and the 32px gap is a real 32px between
     cap-bottom and cap-top — not a line-height fudge that drifts when the
     font size changes. Cards adopt this as they get rebuilt.
     ======================================================================= */
  /* --shd-y is the cap-top of the title. Cards set their own: the storyboard
     moves it down as the headline gains lines, so the whole block stays
     balanced rather than the anchor staying put and the text growing off it. */
  .shd{position:absolute;top:var(--shd-y,168px);left:80px;width:1760px;
    text-align:center;font-weight:580}
  .shd-t{font-size:88px;letter-spacing:-1.32px;line-height:normal;color:#fff;
    text-box-trim:trim-both;text-box-edge:cap alphabetic}
  .shd-s{margin-top:32px;font-size:32px;letter-spacing:-.48px;line-height:1.065;color:#bcbdc0;
    text-box-trim:trim-both;text-box-edge:cap alphabetic}

  /* card 1 — uploads that just work.
     The real Uploadcare uploader widget, rebuilt 1:1 from the storyboard: the
     stage is native 1920x1080, so every number here is the Figma number. Files
     are dragged in as a stack, dropped, and then the widget hands over to the
     compact uploading panel. Choreographed by setupDropin(). */
  .di-wrap{position:absolute;inset:0}

  .di-widget{position:absolute;left:760px;top:414px;width:400px;display:flex;flex-direction:column;gap:20px;
    background:#181818;border-radius:18px;padding:20px;
    filter:drop-shadow(0 12px 16px rgba(0,0,0,.25));
    opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .6s var(--ease-out)}
  .slide.active .di-widget{opacity:1;transform:none}
  /* Figma's 49/25 padding sits inside a stroke that costs no layout, so the
     padding here is 1px short on each side to pay for the CSS border and land
     on the same 360x196 box. */
  .di-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    border:1px dashed rgba(255,255,255,.13);border-radius:7px;padding:48px 24px;
    transition:border-color .2s ease,background .2s ease}
  /* while the pointer is over it the zone fills solid and the dashed edge
     drops out — transparent rather than removed, so the border-box keeps the
     same 196px height and nothing below it shifts.

     No transition on the way in. A real drag-over highlight is a state change,
     not an animation: the browser paints it on the frame the pointer crosses
     the boundary, and any ramp here reads as lag rather than as softness. The
     base rule's transition still runs on the way out, where a hard cut would
     pop under the panel swap that follows it. */
  .di-drop.hot{border-color:transparent;background:#242424;transition:none}
  .di-dropic{width:64px;height:64px;border-radius:9999px;background:rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center;flex:none}
  .di-dropic svg{width:16px;height:16px;display:block}
  .di-droptxt{font-size:15px;color:#fff;line-height:18px}
  .di-src{display:flex;flex-direction:column}
  .di-row{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:8px;
    opacity:0;transform:translateY(6px);transition:opacity .34s ease,transform .4s var(--ease-out);
    transition-delay:calc(.34s + var(--i)*.07s)}
  .slide.active .di-row{opacity:1;transform:none}
  .di-rowic{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center}
  .di-rowic svg{width:16px;height:16px;display:block}
  .di-rowtxt{font-size:14px;color:#fff;line-height:normal}
  .di-cancel{background:rgba(255,255,255,.05);border-radius:8px;padding:5.5px 0;
    text-align:center;font-size:14px;color:#fff;line-height:normal}

  /* The dragged files travel as one stack under a single cursor, so the group
     carries the motion and the cards only hold their offsets. The stack rests
     far enough left that the pointer — pinned to the front card's lower-right
     corner — sits inside the dropzone rather than beside the widget, which is
     what makes the zone's hover state read as caused by the pointer. */
  .di-group{position:absolute;left:1008px;top:398px;width:120px;height:150px;opacity:0}
  .di-card{position:absolute;inset:0}
  .di-card.a{transform:translate(24px,-26px)}
  .di-card img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
  .di-tag{position:absolute;top:6px;background:#161616;border-radius:6px;padding:4px 8px;
    font-family:var(--mono);font-weight:400;font-size:12px;line-height:normal;color:#fff}
  .di-tag.k{left:6px}
  .di-tag.s{right:6px}
  .di-cur{position:absolute;left:95px;top:141px;width:18px;height:25px;
    filter:drop-shadow(1px 0 1px rgba(0,0,0,.3))}
  .di-cur svg{width:100%;height:100%;display:block}

  /* the compact uploading panel that takes over once the files land */
  .di-panel{position:absolute;left:759px;top:484px;width:400px;
    background:#1a1a1a;border-radius:12px;overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0}
  .di-phead{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 20px}
  .di-ptitle{font-size:14px;font-weight:510;line-height:20px;color:#e1e1e1}
  .di-pclose{padding:8px;display:flex}
  .di-pclose svg{width:16px;height:16px;display:block}
  .di-plist{display:flex;flex-direction:column;gap:4px;padding:0 10px 10px}
  .di-file{display:flex;align-items:center;justify-content:space-between;
    background:#242424;border-radius:8px;padding:10px}
  .di-fleft{display:flex;align-items:center;gap:12px}
  .di-thumb{position:relative;width:32px;height:32px;flex:none}
  .di-thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
  .di-check{position:absolute;left:16px;top:16px;width:14px;height:14px;
    opacity:0;transform:scale(.55);
    transition:opacity .18s ease,transform var(--dur-2) var(--ease-pop)}
  .di-check svg{width:100%;height:100%;display:block}
  .di-fname{font-size:13px;line-height:20px;color:#989898}
  .di-act{position:relative;width:21px;height:21px;flex:none;
    display:flex;align-items:center;justify-content:center}
  /* the ring and the bin occupy the same slot and swap on completion */
  .di-ring{position:absolute;width:20px;height:20px;transition:opacity .18s ease}
  .di-ring .trk{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1}
  .di-ring .arc{fill:none;stroke:#5199FF;stroke-width:1;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:50% 50%;
    stroke-dasharray:57.6;stroke-dashoffset:57.6}
  .di-ring .x{stroke:#989898;stroke-width:1}
  /* the ring is centred in the slot but the bin is flush right, as in the
     storyboard — they're different widths and both align to the row's edge */
  .di-bin{position:absolute;right:0;width:16px;height:16px;opacity:0;transition:opacity .18s ease}
  .di-bin svg{width:100%;height:100%;display:block}
  .di-file[data-state="done"] .di-check{opacity:1;transform:none}
  .di-file[data-state="done"] .di-ring{opacity:0}
  .di-file[data-state="done"] .di-bin{opacity:1}

  /* card 2 — five capabilities, as the storyboard's panel row */
  .ft-wrap{position:absolute;inset:0}
  .ft-row{position:absolute;left:266px;top:382px;width:1389px;height:316px;
    display:flex;gap:16px}
  .ft-card{position:relative;width:265px;background:#0c0c0c;border:1px solid #181818;
    border-radius:24px;
    padding:40px;display:flex;flex-direction:column;justify-content:space-between;
    opacity:0;transform:translateY(20px);
    transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out);
    transition-delay:calc(.12s + var(--i)*.06s)}
  .slide.active .ft-card{opacity:1;transform:none}

  /* Once the icons land the row just sits there, which is the one place in the
     deck that read as a static slide rather than a paused one. A single pulse
     now travels left to right: each panel washes to 10% of its own icon's
     accent and back, once. The colour is the card's, not a house colour, so the
     sweep reads as five distinct capabilities lighting up in turn instead of
     one effect painted across the row.

     It rides an overlay's opacity rather than the card's own background-color.
     Opacity composites; background-color repaints. The overlay carries a
     full-strength inset ring
     over a 40%-alpha fill, so at the peak the edge sits at 25% of the accent
     while the fill stays at the 10% wash — the border is what actually carries
     the pulse across a room, the fill alone is too quiet at this distance.

     Delayed past the entrance (the last icon lands ~1.7s) and scoped to
     .slide.active, so the pulse starts once the row is built rather than
     underneath it, and starts from the top on every visit. */
  .ft-card::before{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:color-mix(in srgb, var(--ac) 40%, transparent);
    box-shadow:inset 0 0 0 1px var(--ac);
    opacity:0;
  }
  /* 300ms between panels, not 180. The faster hand-off read as one wash sliding
     across the row; at this spacing each panel gets its own moment and the
     sweep is legible as five events. Each pulse also runs longer than the gap
     (1.5s against 300ms), so neighbours still overlap and the row never breaks
     into five separate blinks.

     It runs once, not on a loop. The wave exists to group the five panels and
     say the row is one thing; having made that point it is over, and a card
     that keeps washing under copy someone is reading has stopped explaining
     and started decorating. The row is settled and quiet for the rest of the
     slide — a paused card, which is what it should be. */
  .slide.active .ft-card::before{
    animation:ftPulse 3.8s ease-in-out calc(1.9s + var(--i)*.30s) 1;
  }
  /* the card's own content has to outrank the wash, or the tint lands on top of
     the label and the icon instead of behind them */
  .ft-label,.ft-tile{position:relative;z-index:1}
  @keyframes ftPulse{
    0%,100%{opacity:0}
    12%    {opacity:.25}
    40%    {opacity:0}
  }
  .ft-label{font-size:28px;font-weight:580;letter-spacing:-.42px;line-height:1.065;
    color:#bcbdc0;text-box-trim:trim-both;text-box-edge:cap alphabetic}
  /* The wells arrive empty with the row; the icons then land in them left to
     right. The gap between them is wide on purpose — across a booth a 70ms
     stagger reads as all five at once, and that is what left the card looking
     like it needed a spinner to prove something was happening. Each pop lasts
     longer than the gap, so the row fills as one travelling wave rather than
     five separate ticks. */
  .ft-tile{width:96px;height:96px;flex:none;background:#181818;border-radius:9.433px;
    display:flex;align-items:center;justify-content:center}
  .ft-tile svg{width:48px;height:48px;display:block;
    opacity:0;transform:scale(.62);
    transition:opacity var(--dur-1) ease,transform var(--dur-2) var(--ease-pop);
    transition-delay:calc(.62s + var(--i)*.19s)}
  .slide.active .ft-tile svg{opacity:1;transform:none}

  /* =======================================================================
     card 3 — the customer quote, as the storyboard's two-panel spread.

     Geometry is Figma's and absolute: the lime pull-quote at 229,307
     (938x465) and the customer panel at 1183,307 (507x465), 16px apart on
     the same 24px radius. Both are `justify-between`, which is what puts the
     attribution and the blurb on a shared bottom edge across the spread —
     the alignment reads even though the two columns hold different content.
     ======================================================================= */
  .qt-wrap{position:absolute;inset:0}
  /* Fade fast, move slow. The panels sit inside the slide's own 520ms
     crossfade, so a long fade here would compound into a second one — and on
     the lime block that is visible as a colour, not just a dimming: part-opaque
     #d8ff6e over near-black is olive, which is nowhere in the palette. A short
     ramp gets the fill to its true colour early and leaves the longer rise to
     carry the motion. */
  .qt-panel{position:absolute;top:307px;height:465px;padding:64px;border-radius:24px;
    display:flex;flex-direction:column;justify-content:space-between;
    opacity:0;transform:translateY(24px);
    transition:opacity var(--dur-1) ease,transform var(--dur-3) var(--ease-out)}
  .slide.active .qt-panel{opacity:1;transform:none}
  /* the quote leads and the customer panel follows ~220ms later, so the pair
     reads as a claim and then its source rather than one wide banner */
  .qt-say{left:229px;width:938px;background:#d8ff6e;color:#000;transition-delay:.08s}
  .qt-who{left:1183px;width:507px;background:#0c0c0c;border:1px solid #181818;
    transition-delay:.30s}

  /* Contents ride on top of their own panel's move, so the two transforms
     compound: the spread arrives with some depth rather than as two flat
     rectangles sliding up together. Each child sets its own delay below. */
  .qt-in{opacity:0;transform:translateY(12px);
    transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out)}
  .slide.active .qt-in{opacity:1;transform:none}
  /* The margin is tracking compensation, not a nudge. CSS adds letter-spacing
     after the last glyph on a line; Figma only puts it between glyphs. At this
     tracking that makes every candidate line 0.96px narrower here than in the
     design, which is enough to pull one more word up onto line 2 and change the
     rag. Giving the measuring box back that 0.96px makes lines break where the
     design breaks them. Glyphs don't move — the text is left-aligned. */
  .qt-quote{font-size:64px;font-weight:600;line-height:1.065;letter-spacing:-.96px;
    margin-right:.96px;
    text-box-trim:trim-both;text-box-edge:cap alphabetic;transition-delay:.26s}
  .em-wrap .qt-quote{display:flex;flex-direction:column;gap:40px}
  .em-wrap .qt-quote p{margin:0}
  .qt-by{font-size:24px;font-weight:400;line-height:1.4;transition-delay:.42s}
  .qt-head{display:flex;flex-direction:column;align-items:flex-start;gap:24px}
  .qt-logo{width:183px;transition-delay:.50s}
  .qt-logo svg{width:100%;height:auto;display:block}
  .qt-tag{background:#181818;border-radius:20px;padding:4px 12px;
    font-family:var(--cmono);font-size:13px;line-height:1.2;letter-spacing:.13px;
    text-transform:uppercase;color:#a7a7a7;transition-delay:.58s}
  .qt-desc{font-size:20px;font-weight:400;line-height:1.4;color:#fff;
    transition-delay:.66s}

  /* =======================================================================
     card 4 — the trusted-by wall.

     The marks are not on a grid. The storyboard places all eight optically —
     column centres drift by up to 13px between the two rows and the vertical
     centres by up to 16px — because these logos have wildly different visual
     weight at a common width. So each one is centred on its own slot from the
     design (LW_SLOTS) at its own exported size (LOGO_BOX); a `repeat(4,1fr)`
     grid gets close but is visibly wrong at booth scale.

     Every mark is placed with left/top rather than a centring translate,
     because the entrance animates `transform` and the two would fight.
     ======================================================================= */
  .lw-wrap{position:absolute;inset:0}
  .lw-title{position:absolute;top:175px;left:302px;width:1316px;text-align:center;
    font-size:32px;font-weight:580;line-height:1.065;letter-spacing:-.48px;
    color:#bcbdc0;text-box-trim:trim-both;text-box-edge:cap alphabetic;
    opacity:0;transform:translateY(12px);
    transition:opacity var(--dur-1) ease,transform var(--dur-3) var(--ease-out)}
  .slide.active .lw-title{opacity:1;transform:none}
  /* Reading order, 75ms apart. The old wall brought all eight up on one 1.1s
     fade, which at this size reads as the slide itself getting brighter rather
     than as logos arriving. A stagger gives the wall a direction to assemble
     in, and the rise is what makes each mark read as landing. */
  .lw-logo{position:absolute;color:#fff;
    opacity:0;transform:translateY(16px);
    transition:opacity var(--dur-1) ease,transform var(--dur-3) var(--ease-out);
    transition-delay:calc(.30s + var(--i)*.075s)}
  .slide.active .lw-logo{opacity:1;transform:none}
  .lw-logo svg{width:100%;height:100%;display:block}
  /* fallback when a name has no mark in assets/logos — set it in type instead */
  .lw-word{position:absolute;font-size:34px;font-weight:600;letter-spacing:-0.01em;
    color:#EDEDED;white-space:nowrap;line-height:1;
    opacity:0;transform:translateY(16px);
    transition:opacity var(--dur-1) ease,transform var(--dur-3) var(--ease-out);
    transition-delay:calc(.30s + var(--i)*.075s)}
  .slide.active .lw-word{opacity:1;transform:none}

  /* =======================================================================
     card 5 — the Webflow marketplace listing, and a cursor installing it.

     The listing is the storyboard's, rebuilt rather than dropped in as the
     exported bitmap, because the button has to change state. Geometry is
     Figma's: a 508x244 panel at 706,591 holding an 89px app tile beside a
     313px column, and every text block is trimmed to its cap box so the 11 /
     13 / 32px gaps in the design are real gaps between glyphs.
     ======================================================================= */
  .wf-wrap{position:absolute;inset:0}
  .wf-panel{position:absolute;left:706px;top:591px;width:508px;height:244px;
    display:flex;gap:24px;align-items:flex-start;padding:40px;
    background:#0c0c0c;border:1px solid #181818;border-radius:24px;
    opacity:0;transform:translateY(24px);
    transition:opacity var(--dur-1) ease,transform var(--dur-3) var(--ease-out);
    transition-delay:.36s}
  .slide.active .wf-panel{opacity:1;transform:none}

  /* the panel's contents land 60ms apart behind it — the tile first, so the
     eye has something to fix on while the text arrives */
  .wf-in{opacity:0;transform:translateY(10px);
    transition:opacity var(--dur-1) ease,transform var(--dur-2) var(--ease-out);
    transition-delay:calc(.50s + var(--i,0)*.06s)}
  .slide.active .wf-in{opacity:1;transform:none}

  .wf-tile{width:89px;height:89px;flex:none;border-radius:8px;
    background:#181818;border:1px solid #181818;
    display:flex;align-items:center;justify-content:center}
  .wf-tile svg{width:51px;height:51px;display:block}
  /* the storyboard's app icon is the deck's own glyph in brand yellow */
  .wf-tile svg path{fill:var(--brand)}

  .wf-col{width:313px;display:flex;flex-direction:column;gap:32px}
  .wf-name{font-size:16px;font-weight:500;line-height:1.065;letter-spacing:-.24px;
    color:#fff;text-box-trim:trim-both;text-box-edge:cap alphabetic}
  .wf-meta{display:flex;align-items:center;gap:4px;width:max-content;margin-top:11px}
  .wf-meta svg{width:16px;height:16px;display:block}
  .wf-dl{font-size:14px;font-weight:500;line-height:1.065;letter-spacing:-.21px;
    color:#888;text-box-trim:trim-both;text-box-edge:cap alphabetic}
  .wf-desc{margin-top:13px;font-size:14px;font-weight:500;line-height:1.5;
    letter-spacing:-.21px;color:#888;
    text-box-trim:trim-both;text-box-edge:cap alphabetic}

  /* Entrance and press live on different elements on purpose: the wrapper owns
     the translate that brings the button in, the button owns the scale it
     takes on press. One element can't do both without the two fighting over
     `transform`. */
  .wf-btnwrap{position:relative;width:111px;height:47px}
  .wf-btn{position:absolute;inset:0;border-radius:4px;overflow:hidden;
    background:#336DED;
    transition:transform 140ms var(--ease-out),background-color 260ms ease}
  .wf-btn.press{transform:scale(.97)}
  .wf-btn.pop{transform:scale(1.03)}
  .wf-btn[data-state="2"]{background:var(--ok)}
  /* the install progress: a lighter wash sweeping the fill left to right.
     linear, because it stands for elapsed work rather than a UI gesture */
  .wf-sweep{position:absolute;inset:0;background:rgba(255,255,255,.22);
    clip-path:inset(0 100% 0 0)}
  .wf-btn[data-state="1"] .wf-sweep{clip-path:inset(0 0 0 0);
    transition:clip-path 1.15s linear}

  /* Three labels stacked in one box. Only the active one is up; the others sit
     8px away in the direction they came from or are headed.

     The two halves of the swap are deliberately not symmetric. The old label
     leaves in 130ms and the new one doesn't start until 120ms in, so the two
     words are never both legible — crossfade them evenly and you read
     "Installing" printed over "Install App". The blur covers what overlap is
     left, bridging them into one change of state rather than two objects. */
  .wf-lbl{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;gap:5px;
    /* 15px/600 is what the exported button measures out to — Webflow's own UI
       font isn't Inter, so this is matched on the label's width, not its name */
    font-size:15px;font-weight:600;color:#fff;white-space:nowrap;
    opacity:0;transform:translateY(8px);filter:blur(4px);
    transition:opacity 130ms ease,transform 130ms var(--ease-out),filter 130ms ease}
  .wf-btn[data-state="0"] .wf-lbl[data-s="0"],
  .wf-btn[data-state="1"] .wf-lbl[data-s="1"],
  .wf-btn[data-state="2"] .wf-lbl[data-s="2"]{
    opacity:1;transform:none;filter:none;
    transition:opacity 200ms ease 120ms,transform 240ms var(--ease-out) 120ms,
               filter 200ms ease 120ms}
  /* an outgoing label leaves upward, the way the incoming one arrived */
  .wf-btn[data-state="1"] .wf-lbl[data-s="0"],
  .wf-btn[data-state="2"] .wf-lbl[data-s="0"],
  .wf-btn[data-state="2"] .wf-lbl[data-s="1"]{transform:translateY(-8px)}
  .wf-btn[data-state="2"] .wf-lbl{color:#08210f}
  .wf-check{width:14px;height:14px;display:block;flex:none}
  .wf-check path{fill:none;stroke:currentColor;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:22;stroke-dashoffset:22}
  /* the tick draws itself once the fill has turned and the word has landed —
     a mark being made, not a glyph that was always there */
  .wf-btn[data-state="2"] .wf-check path{stroke-dashoffset:0;
    transition:stroke-dashoffset 300ms var(--ease-out) 230ms}

  /* the pointer goes in as a data URI rather than inline SVG: card 1 already
     inlines this mark, and two copies in one document collide on the ids its
     mask references — the second one then renders as nothing */
  .wf-cursor{position:absolute;left:0;top:0;width:18px;height:25px;z-index:4;
    display:block;opacity:0;filter:drop-shadow(1px 0 1px rgba(0,0,0,.35));
    will-change:transform}

  /* card 6 — the bigger picture: one headline over the full pipeline as a
     chip row (storyboard frame 14). Its own background so it reads as a
     step up from the product cards. */
  /* the outer stop is transparent, not solid, so the ambient substrate reads
     through the card's "bigger picture" tint instead of being masked by it */
  .sc-wrap{position:absolute;inset:0;
    background:radial-gradient(130% 100% at 50% 8%,rgba(20,23,38,.92) 0%,rgba(11,11,15,0) 62%)}
  /* .reveal animates transform, so anything wearing it is centred with explicit
     offsets rather than translateX(-50%) — otherwise the two fight and the
     element slides sideways as it enters. Offsets are the storyboard's x. */
  .sc-title{position:absolute;top:var(--head-y);left:246px;width:1428px;text-align:center;
    font-size:var(--h-size);font-weight:var(--h-weight);letter-spacing:var(--h-ls);line-height:var(--h-lh);color:var(--ink)}
  .sc-panel{position:absolute;left:523px;top:579px;
    width:874px;height:125px;border-radius:20px;background:#141416;
    box-shadow:inset 0 0 0 1px rgba(212,226,255,.05),0 24px 60px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center}
  .sc-cell{opacity:0;transform:translateY(8px);transition:opacity .34s ease,transform .44s var(--ease-out);
    transition-delay:calc(.45s + var(--i)*.09s)}
  .slide.active .sc-cell{opacity:1;transform:none}
  .sc-chip{height:45px;padding:0 32px;display:flex;align-items:center;border-radius:10px;
    font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-dim);border:1px solid rgba(255,255,255,.10);background:#101012}
  /* the lit pulse travels chip to chip; the entrance lives on .sc-cell so the
     two never fight over the same properties */
  .slide.active .sc-chip{animation:scLit 4.4s var(--ease-in-out) infinite;animation-delay:calc(1.1s + var(--i)*.3s)}
  @keyframes scLit{
    0%,100%{color:var(--ink-dim);border-color:rgba(255,255,255,.10);background:#101012}
    6%,14%{color:var(--ink);border-color:rgba(255,255,255,.30);background:#17171a}
  }
  .sc-conn{width:57px;height:9px;display:flex;align-items:center;justify-content:space-between}
  .sc-conn i{width:8px;height:8px;flex:none;border:1px solid rgba(255,255,255,.22);border-radius:2px}
  .sc-conn s{flex:1;height:1px;background:rgba(255,255,255,.18);text-decoration:none}

  /* card 7 — the booth QR, at frame 184:5666's geometry. Pinned rather than
     stacked so it can never push the headline off the centre line.

     White modules straight onto the frame, no white plate behind them: that is
     the design, and the plate it replaces was a bright 196px rectangle sitting
     under a deliberately dim backdrop, which fought the headline for the eye.
     It does make this a reverse-polarity code — scanners expect dark on light.
     Current phone cameras read inverted codes without complaint, so this is
     safe for a booth, but it is the reason the code is drawn oversized: the
     modules are ~8px, well past what a camera needs, which buys back the
     margin that the inversion spends. */
  .hb-outro-qr{position:absolute;left:857px;top:711px;
    width:204px;height:204px;z-index:2}
  .hb-outro-qr svg{width:100%;height:100%;display:block}
  .hb-sign{position:absolute;left:867px;top:186px;width:185px;height:33px;z-index:2}
  .hb-sign svg{height:100%;width:auto;display:block}

  /* The corner files are backdrop, not content: the storyboard runs their
     telemetry at 9px, well under anything readable across a stand, and that is
     the point — they are texture that says "files moving" and the centre line
     is what gets read. */
  .hb-outro-mode .hb-meta{font-size:9px;line-height:1.51;letter-spacing:.45px;
    text-transform:uppercase;color:#595959}
  .hb-outro-mode .hb-meta .b{color:#8e8e8e;font-weight:400}
  .hb-outro-mode .hb-meta .g{color:#52e866;font-weight:400}
  .hb-outro-mode .hb-meta .t{color:#008b4b;font-weight:400}
  .hb-outro-mode .hb-line{min-height:1.51em}
  .hb-outro-mode .hb-card{border-radius:22px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .hb-outro-mode .hb-card.framed{border:1.336px dashed rgba(255,255,255,.12);
    background:#000;padding:6px;border-radius:22.71px;box-shadow:none}
  .hb-outro-mode .hb-card.framed img{border-radius:14px}
  .hb-outro-mode .hb-cursor{width:5px;height:10px;vertical-align:-1px}
  .hb-outro-mode .hb-led{width:6.72px;height:6.72px;background:#3eff51;border-radius:0}
  .hb-outro-mode .hb-dot{border-radius:0}

  /* =======================================================================
     Ecommerce Expo — seven-card cut.

     These cards reuse the booth deck's stage, typography, substrate, logo
     assets and timing model, but carry their own layouts so the inherited
     Webflow story can remain intact while the Expo cut evolves.
     ======================================================================= */
  .ec-head{position:absolute;left:130px;right:130px;top:126px;text-align:center;
    font-size:72px;font-weight:600;letter-spacing:-1.08px;line-height:1.04;color:#fff;
    text-box-trim:trim-both;text-box-edge:cap alphabetic}
  .ec-sub{position:absolute;left:260px;right:260px;top:258px;text-align:center;
    font-size:28px;font-weight:430;letter-spacing:-.42px;line-height:1.25;color:#a8a9ad}
  .ec-kicker{font-family:var(--cmono);font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;color:#84858a}

  /* Card 1 — storyboard 234:979. The first phase is one process component:
     the full Uploadcare uploader runs in the left cell and hands the same file
     to the reduced optimization readout on the right. `.ef-process` owns the
     whole phase so the storefront can replace it as one transition unit. */
  .ef-wrap{position:absolute;inset:0;background:#181818}
  .ef-wrap>.shd{z-index:3}
  .ef-process{position:absolute;left:334px;top:354px;width:1252px;height:554px;
    border-radius:39px;background:#0c0c0c;border:1px solid rgba(255,255,255,.05);
    padding:11px;overflow:hidden}
  .ef-grid{position:relative;z-index:1;height:100%;display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:24px}
  .ef-cell{position:relative;height:532px;border-radius:27px;overflow:hidden}
  .ef-left{background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center}

  /* Full uploader from the first Webflow card, reduced to the one Figma file. */
  .ef-widget{position:relative;width:400px;padding:20px;display:flex;flex-direction:column;gap:20px;
    background:#181818;border-radius:18px;filter:drop-shadow(0 12px 16px rgba(0,0,0,.25))}
  .ef-drop{height:196px;padding:48px 24px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;border:1px dashed rgba(255,255,255,.13);
    border-radius:7px;transition:border-color .2s ease,background .2s ease}
  .ef-drop.hot{border-color:transparent;background:#242424;transition:none}
  .ef-dropic{width:64px;height:64px;border-radius:9999px;background:rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center}
  .ef-dropic svg{width:16px;height:16px;display:block}
  .ef-droptxt{font-size:15px;line-height:18px;color:#fff}
  .ef-sources{display:flex;flex-direction:column}
  .ef-source{height:36px;padding:6px 10px;display:flex;align-items:center;gap:12px;border-radius:8px}
  .ef-source i{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
  .ef-source svg{width:16px;height:16px;display:block}
  .ef-source span{font-size:14px;line-height:normal;color:#fff}
  .ef-cancel{height:30px;padding:5.5px 0;border-radius:8px;background:rgba(255,255,255,.05);
    text-align:center;font-size:14px;line-height:normal;color:#fff}

  .ef-drag{position:absolute;left:40px;top:-5px;width:120px;height:150px;z-index:3;opacity:0}
  .ef-drag-card{position:absolute;inset:0;border-radius:12px;overflow:hidden;
    filter:drop-shadow(0 12px 16px rgba(0,0,0,.25))}
  .ef-drag-card img{width:100%;height:100%;object-fit:cover;display:block}
  .ef-tag{position:absolute;top:6px;padding:4px 8px;border-radius:6px;background:#161616;
    font-family:var(--cmono);font-size:12px;line-height:normal;color:#fff}
  .ef-kind{left:6px}
  .ef-size{right:6px}
  .ef-cursor{position:absolute;right:7px;bottom:-16px;width:18px;height:25px;
    filter:drop-shadow(1px 0 1px rgba(0,0,0,.3))}
  .ef-cursor svg{width:100%;height:100%;display:block}

  /* The compact completion panel replaces the large widget after the drop. */
  .ef-panel-slot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none}
  .ef-panel{width:400px;background:#1a1a1a;border-radius:12px;overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:scale(.97)}
  .ef-uhead{height:52px;padding:10px 10px 10px 20px;
    display:flex;align-items:center;justify-content:space-between}
  .ef-utitle{font-size:14px;font-weight:510;line-height:20px;color:#e1e1e1}
  .ef-uclose{padding:8px;display:flex}
  .ef-uclose svg{width:16px;height:16px;display:block}
  .ef-ulist{padding:0 10px 10px}
  .ef-ufile{height:52px;padding:10px;background:#242424;border-radius:8px;
    display:flex;align-items:center;justify-content:space-between}
  .ef-ufleft{display:flex;align-items:center;gap:12px}
  .ef-uthumb{position:relative;width:32px;height:32px;flex:none}
  .ef-uthumb>img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
  .ef-ucheck{position:absolute;left:16px;top:16px;width:14px;height:14px;
    opacity:0;transform:scale(.55);
    transition:opacity .18s ease,transform var(--dur-2) var(--ease-pop)}
  .ef-ucheck svg{width:100%;height:100%;display:block}
  .ef-uname{font-size:13px;line-height:20px;color:#989898}
  .ef-uaction{position:relative;width:21px;height:21px;display:flex;align-items:center;justify-content:center}
  .ef-uaction .di-ring{position:absolute}
  .ef-ubin{position:absolute;right:0;width:16px;height:16px;opacity:0;transition:opacity .18s ease}
  .ef-ubin svg{width:100%;height:100%;display:block}
  .ef-ufile[data-state="done"] .ef-ucheck{opacity:1;transform:none}
  .ef-ufile[data-state="done"] .di-ring{opacity:0}
  .ef-ufile[data-state="done"] .ef-ubin{opacity:1}

  /* Simplified analysis from the first two columns of the website demo. */
  .ef-right{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;overflow:visible}
  .ef-wash{position:absolute;left:50%;top:50%;width:340px;height:440px;
    transform:translate(-50%,-50%);filter:blur(15px);opacity:.1;pointer-events:none}
  .ef-wash-in{width:100%;height:100%;border-radius:32px;overflow:hidden;
    clip-path:inset(0 0 100% 0)}
  .ef-wash img{width:100%;height:100%;object-fit:cover;display:block}
  .ef-analyse-photo{position:relative;width:258px;height:333px;border-radius:27px;
    border:1px dashed rgba(255,255,255,.13);overflow:hidden}
  .ef-analyse-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--cmono);font-size:13px;letter-spacing:.65px;text-transform:uppercase;
    color:rgba(255,255,255,.25)}
  .ef-analyse-img{position:absolute;left:8px;top:8px;width:240px;height:315px;
    border-radius:19px;overflow:hidden;opacity:0}
  .ef-analyse-img img{position:absolute;left:0;top:-10.1%;width:100%;height:113.55%;
    object-fit:cover;display:block}
  .ef-delete{position:absolute;right:20px;top:19px;width:32px;height:32px;border-radius:8px;
    background:rgba(9,9,9,.8);display:flex;align-items:center;justify-content:center;
    opacity:0}
  .ef-delete svg{width:14px;height:14px;display:block}
  .ef-prog{position:relative;width:100%;height:70px;display:flex;align-items:center;justify-content:center}
  .ef-prog-side{flex:1;display:flex;justify-content:center}
  .ef-dots{display:flex;align-items:center;gap:4px}
  .ef-dots i{width:3px;height:3px;background:rgba(255,255,255,.13)}
  .slide.active .ef-dots[data-state="working"] i{background:rgba(255,255,255,.25);
    animation:pdDot 1s ease-in-out infinite backwards}
  .ef-dots[data-state="working"] i:nth-child(2){animation-delay:.12s}
  .ef-dots[data-state="working"] i:nth-child(3){animation-delay:.24s}
  .ef-analysis{height:70px;padding-bottom:30px;text-align:center;font-family:var(--cmono);
    font-size:13px;line-height:20px;text-transform:uppercase;color:#a7a7a7}
  .ef-analysis p{opacity:0}
  .ef-analysis b{font-weight:inherit;color:#fff}
  /* Storefront payoff — frame 234:1415. It deliberately keeps the process
     shell's 1252px width, so Card 1 can hand from system work to visible result
     without the composition changing scale. The 814px browser extends below
     the stage exactly as it does in the frame and is clipped by the TV. */
  .ef-site{position:absolute;left:334px;top:386px;width:1252px;height:814px;
    border-radius:16px;background:#fff;overflow:hidden;opacity:0;pointer-events:none;
    box-shadow:0 100px 40px rgba(0,0,0,.07),0 41.778px 16.711px rgba(0,0,0,.05),
      0 22.336px 8.935px rgba(0,0,0,.04),0 12.522px 5.009px rgba(0,0,0,.04),
      0 6.65px 2.66px rgba(0,0,0,.03),0 2.767px 1.107px rgba(0,0,0,.02)}
  .ef-sitebar{height:56px;padding:4px 24px;background:#353535;display:flex;
    align-items:center;gap:72px}
  .ef-sitecontrols{display:flex;align-items:center;gap:24px}
  .ef-siteos{width:52px;height:12px}
  .ef-siteos svg{display:block;width:52px;height:12px}
  .ef-sitenav{display:flex;align-items:flex-start;gap:12px}
  .ef-sitenav i{width:20px;height:20px;display:block}
  .ef-sitenav svg{display:block;width:20px;height:20px}
  .ef-site-rule{height:1px;background:#4d4d4d}
  .ef-sitebody{position:relative;height:757px;background:#fff;color:#000}

    overflow:hidden}
  .ef-site-photo img{position:absolute;left:0;top:-27.02%;width:100%;height:142.61%;
    max-width:none;object-fit:cover;display:block}
  .ef-site-info{position:absolute;left:647px;top:0;width:519px}
  .ef-site-title{position:absolute;left:0;top:93px;width:519px;font-size:48px;
    font-weight:580;line-height:1;letter-spacing:-.72px;color:#000;
    text-box-trim:trim-both;text-box-edge:cap alphabetic}
  .ef-site-tags{position:absolute;left:0;top:194px;display:flex;align-items:center;gap:3px}
  .ef-site-tags span{padding:2px 6px;border-radius:2px;background:#dacfcb;color:#5d453c;
    font-size:14px;font-weight:500;line-height:1.2;letter-spacing:-.21px;white-space:nowrap}
  .ef-site-copy{position:absolute;left:0;top:249px;width:465px;color:#5d453c;
    font-size:14px;font-weight:500;line-height:1.4;letter-spacing:-.21px}

  .ef-site-cta{position:absolute;left:0;top:487px;padding:16px 48px;border-radius:4px;
    background:#000;color:#fff;font-size:16px;font-weight:580;line-height:1;
    letter-spacing:-.24px;text-box-trim:trim-both;text-box-edge:cap alphabetic}

  /* Card 2 — storyboard frame 212:1213. Five fixed 265x361 panels sit in a
     1389px row: the 16px gutters are part of the composition, not a responsive
     grid. Copy comes first and the icon well is pinned to the lower-left by
     justify-between. The icon art is the frame's own 48px SVG export, inlined
     through ECOMMERCE so it keeps its baked accent colour. */
  .eb-wrap{position:absolute;inset:0}
  .eb-row{position:absolute;left:266px;top:359.5px;width:1389px;height:361px;
    display:flex;gap:16px;align-items:stretch}
  .eb-card{position:relative;width:265px;height:361px;padding:40px;border-radius:24px;
    background:#0c0c0c;border:1px solid #181818;display:flex;flex-direction:column;
    align-items:flex-start;justify-content:space-between;
    opacity:0;transform:translateY(18px);
    transition:opacity .22s ease,transform .46s var(--ease-out);
    transition-delay:calc(.08s + var(--i)*.08s)}
  .slide.active .eb-card{opacity:1;transform:none}
  .eb-copy{width:183px;display:flex;flex-direction:column;gap:16px;font-weight:580;
    line-height:1.065}
  .eb-benefit{font-size:28px;letter-spacing:-.42px;color:#bcbdc0;
    text-box-trim:trim-both;text-box-edge:cap alphabetic}
  .eb-feature{font-size:16px;letter-spacing:-.24px;color:#85868b;
    text-box-trim:trim-both;text-box-edge:cap alphabetic}
  .eb-icon{width:96px;height:96px;border-radius:9.433px;background:#181818;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .eb-icon svg{width:48px;height:48px;display:block}

  /* The benefit row is the Expo cut's equivalent of the Webflow capability
     row, and it sat completely still once built — the one card that read as a
     static slide rather than a paused one. It now runs the same travelling
     wash, reusing ftPulse so both rows stay retuned from one place. Each panel
     washes to 10% of *its own* icon's accent, which is what makes it read as
     five benefits lighting up in turn rather than one effect painted over the
     row; `ECOM_BENEFITS[].ac` duplicates the colour baked into each SVG
     because CSS cannot read one out of inlined markup, so the two have to be
     kept in step. The wash rides a ::before overlay's opacity rather than the
     card's background-color — opacity composites where colour repaints. */
  .eb-card::before{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:color-mix(in srgb, var(--ac) 40%, transparent);
    box-shadow:inset 0 0 0 1px var(--ac);
    opacity:0;
  }
  /* Card 2 is the exception to the Webflow row's overlapping wave. Each panel
     owns a full one-second highlight slot, in reading order, and the five-card
     pass repeats once. A five-second animation with a one-second event at its
     head gives every card the same slot; the per-card one-second delay places
     those events back-to-back, while two iterations put the second turn five
     seconds later. Starting at .9s lets the row finish entering first. */
  .slide.active .eb-card::before{
    animation:ebFlash 5s linear calc(.9s + var(--i)*1s) 2;
  }
  @keyframes ebFlash{
    0%,20%,100%{opacity:0}
    2%,18%{opacity:.25}
  }
  /* the panel's own content has to outrank the wash, or the tint lands on top
     of the copy and the icon instead of behind them */
  .eb-copy,.eb-icon{position:relative;z-index:1}
  /* The trust marks support the benefit claim, rather than the mechanics of
     Card 1's uploader. They use Card 2's open bottom band beneath the row. */
  .eb-badge{position:absolute;opacity:0;transform:translateY(10px);
    transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out);
    transition-delay:calc(.62s + var(--i,0)*.09s)}
  .eb-badge svg{width:100%;height:100%;display:block}
  .slide.active .eb-badge{opacity:.5;transform:none}

  /* Card 3 — Zephyr testimonial, frame 234:1237. It intentionally reuses the
     Webflow quote card's geometry and choreography above: the lime claim leads,
     the source panel follows 220ms later, and its contents ride on that move. */
  .em-wrap{position:absolute;inset:0}
  .em-wrap .qt-logo{width:114px;height:93px}
  .em-wrap .qt-logo svg{display:block;width:114px;height:93px}
  .em-copy{transition-delay:.66s}
  .em-quote{margin:0 0 19px;font-size:20px;font-weight:400;line-height:1.4;color:#fff}
  .em-attribution{margin:0;font-size:14px;font-weight:400;line-height:1.4;color:#bcbdc0}
  .em-logo-fallback{font-family:var(--cmono);font-size:14px;letter-spacing:.18em;
    text-transform:uppercase;color:#fff}

  /* Card 4 — the real AI catalog-admin flow. The product backend opens, the
     pointer crosses its catalogue image, "Edit with AI" surfaces under the
     pointer, and the editor modal takes over. The source and result UUIDs are
     recorded in EVENT.md; CSS never manufactures output.

     The backend is live DOM, not the captures in assets/ecommerce/. Those are
     the reference and stay in the repo, but a 1024px screenshot on a 1252px
     stage is resampled twice — once into the stage, again by the TV — and this
     UI's smallest type is 13px, where that softness stops reading as a photo
     of an interface and starts reading as a broken render. Rebuilt, every
     glyph and border is resolution-independent, and the Media card can hold a
     real hover state instead of cutting to a second screenshot of one.

     Geometry is the capture's at 1.22x (1024 -> 1252). The page is taller than
     it is in the browser too: the stage is a window onto it, so Product
     details and Organisation run off the bottom edge exactly as they do in the
     demo rather than being squeezed to fit. */
  .ce-wrap{position:absolute;inset:0}
  .ce-stage{position:absolute;left:334px;top:360px;width:1252px;height:640px}

  .ce-backend{position:absolute;inset:0;border-radius:16px;overflow:hidden;
    background:#f5f5f5;box-shadow:0 18px 50px rgba(0,0,0,.28);
    font-family:var(--sans);color:#141414;text-align:left}
  .ce-bar{position:absolute;left:0;right:0;top:0;height:64px;padding:0 26px;
    display:flex;align-items:center;gap:9px;
    background:#fff;border-bottom:1px solid #ebebeb}
  .ce-crumb{font-size:15px;color:#8c8c8c}
  .ce-crumb-sep{color:#c8c8c8}
  .ce-crumb-now{font-size:16px;font-weight:600;letter-spacing:-.1px}
  .ce-live{margin-left:5px;padding:5px 10px;border-radius:9px;background:#e4f3e9;
    color:#1a7a4c;font-size:13px;font-weight:600;line-height:1}
  .ce-page{position:absolute;left:26px;right:26px;top:84px;bottom:0;
    display:grid;grid-template-columns:1fr 315px;gap:21px;align-content:start}
  .ce-col{display:flex;flex-direction:column;gap:22px;min-width:0}
  .ce-card{background:#fff;border:1px solid #ececec;border-radius:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .ce-card-h{display:flex;align-items:baseline;justify-content:space-between;
    padding:18px 20px 0}
  .ce-card-t{font-size:17px;font-weight:600;letter-spacing:-.1px;white-space:nowrap}
  .ce-card-n{font-size:14px;color:#8c8c8c}

  .ce-slots{display:flex;gap:15px;padding:14px 20px 0}
  .ce-slot{box-sizing:border-box;width:243px;height:242px;border-radius:8px}
  .ce-shot{position:relative;overflow:hidden;background:#fff;border:1.5px solid #1b1b1b;
    transition:box-shadow .22s ease}
  .ce-shot img{width:100%;height:100%;object-fit:contain;display:block}
  .ce-tag{position:absolute;left:8px;top:9px;padding:4px 9px;border-radius:7px;
    background:#101010;color:#fff;font-size:12px;font-weight:500;line-height:1}
  .ce-new{display:flex;align-items:center;justify-content:center;
    border:1.5px dashed #d6d6d6}
  .ce-addvar{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:9px;
    background:#f5c451;color:#171717;font-size:15px;font-weight:600;line-height:1}
  .ce-spark{width:16px;height:16px;flex:none;display:block}
  .ce-cap{padding:13px 20px 16px}
  .ce-cap-t{font-size:16px;line-height:1;color:#1b1b1b}
  .ce-cap-s{margin-top:8px;font-size:13px;line-height:1;color:#9a9a9a}

  /* The action the card is about. It belongs to the hover state, so it arrives
     with the pointer rather than sitting on the page waiting to be pressed. */
  .ce-edit{position:absolute;left:8px;bottom:10px;display:flex;align-items:center;gap:8px;
    padding:9px 13px;border-radius:9px;background:#e9e0fd;color:#6a3fd6;
    font-size:15px;font-weight:600;line-height:1;white-space:nowrap;
    opacity:0;transform:translateY(6px);
    transition:opacity .18s ease,transform .22s var(--ease-out)}
  .ce-shot.hot{box-shadow:0 10px 24px rgba(0,0,0,.14)}
  .ce-shot.hot .ce-edit{opacity:1;transform:none}

  .ce-field{padding:0 20px 14px}
  .ce-label{margin-bottom:8px;font-size:13px;color:#8c8c8c;line-height:1}
  .ce-input{box-sizing:border-box;height:38px;padding:0 12px;display:flex;align-items:center;
    border:1px solid #e6e6e6;border-radius:8px;font-size:15px;color:#1c1c1c}
  .ce-area{box-sizing:border-box;height:92px;padding:10px 12px;
    border:1px solid #e6e6e6;border-radius:8px;font-size:14px;line-height:1.5;color:#1c1c1c}
  .ce-row3{display:flex;gap:15px;padding:0 20px 18px}
  .ce-row3 .ce-field{flex:none;width:243px;padding:0}

  /* header and control share 279px of the right column, so the title holds the
     card's 17px and the control gives up the difference rather than wrapping */
  .ce-preview-card .ce-card-t{font-size:16px}
  .ce-seg{flex:none;display:flex;gap:3px;padding:3px;border-radius:9px;background:#f0f0f0}
  .ce-seg span{padding:5px 8px;border-radius:6px;font-size:12px;font-weight:500;
    line-height:1;color:#6e6e6e;white-space:nowrap}
  .ce-seg .on{background:#171717;color:#fff}
  .ce-preview{height:244px;padding:12px 18px 0;display:flex;align-items:center;
    justify-content:center}
  .ce-preview img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .ce-pv-name{padding:12px 18px 0;text-align:center;font-size:15px;line-height:1}
  .ce-pv-price{padding:8px 18px 0;text-align:center;font-size:14px;line-height:1;color:#8c8c8c}
  .ce-pv-note{padding:14px 18px 18px;font-size:13px;line-height:1.45;color:#a3a3a3}
  .ce-pv-note b{color:#4a4a4a;font-weight:600}
  .ce-org{display:flex;padding:0 18px 12px;font-size:14px;line-height:1.5}
  .ce-org .k{flex:none;width:104px;color:#8e8e8e}
  .ce-org .v{color:#242424}
  .ce-chips{display:flex;flex-wrap:wrap;gap:6px}
  .ce-chips span{padding:5px 9px;border-radius:999px;background:#f0f0f0;color:#3a3a3a;
    font-size:13px;line-height:1}

  /* One pointer runs the whole card, so it is a child of .ce-stage rather than
     of .ce-backend: the backend fades out under it at the handover, and a
     pointer that fades with its phase and fades back in for the next one reads
     as two different pointers rather than one hand still working.

     It is card 1's 18x25, not the 44x61 it started at. At 44px the arrow is
     bigger than the 15px buttons it presses, which makes the UI look like a
     toy; at card 1's size the two cards' pointers are also the same object.

     left/top is where it first comes to rest and the score translates it back
     to its entry point; the tip sits at the element's top-left, so every
     coordinate in the score is a tip coordinate. */
  .ce-admin-cursor{position:absolute;left:165px;top:352px;width:18px;height:25px;
    z-index:8;opacity:0;will-change:transform;
    filter:drop-shadow(1px 0 1px rgba(0,0,0,.3))}
  .ce-admin-cursor img{width:100%;height:100%;display:block}
  /* Centred on the tip. It opens near its full size and clears in 220ms: a
     ripple that starts at a tenth of its size and keeps growing after the
     press has ended reads as an effect rather than as feedback. 36px is the
     pill's own height — scaled to the button being pressed rather than to the
     pointer, which at 18px would make any ripple read as three times its size. */
  .ce-click-ring{position:absolute;left:147px;top:334px;width:36px;height:36px;
    border:1.5px solid rgba(128,100,216,.85);border-radius:50%;opacity:0;
    transform:scale(.9);z-index:4;pointer-events:none}

  /* Editor phase, rebuilt from the supplied screenshot and the live production
     tool. The white shell is deliberately one layer: it arrives as a complete
     workspace rather than its controls assembling like a dashboard. */
  .ce-editor{position:absolute;inset:0;border-radius:16px;overflow:hidden;
    background:#fff;color:#151515;box-shadow:0 18px 50px rgba(0,0,0,.28);
    opacity:0;transform:translateY(16px) scale(.985)}
  .ce-canvas{position:absolute;left:130px;top:18px;width:992px;height:456px;
    border-radius:10px;overflow:hidden;
    background-color:#fff;
    background-image:radial-gradient(circle,#d2d3d5 1.15px,transparent 1.25px);
    background-size:6px 6px}
  .ce-photo{position:absolute;left:327px;top:3px;width:338px;height:450px;
    overflow:hidden;background:#ececeb}
  .ce-photo img{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:block}
  .ce-after{opacity:0}

  /* The production tool covers the image with a dense dot field while work is
     pending. The veil hides the unavoidable generative micro-differences in
     the bottle while the new frame arrives; the brighter moving band makes the
     dots read as computation rather than as a texture crossfade. */
  .ce-veil{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;
    background-color:rgba(245,245,243,.72);
    background-image:radial-gradient(circle,rgba(49,49,47,.72) 1.15px,transparent 1.3px);
    background-size:5px 5px}
  .ce-shimmer{position:absolute;top:0;bottom:0;left:-180px;width:180px;z-index:3;
    opacity:0;pointer-events:none;mix-blend-mode:screen;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35) 28%,
      rgba(255,255,255,.94) 58%,rgba(216,255,110,.48) 72%,transparent)}

  .ce-composer{position:absolute;left:246px;top:466px;width:760px;height:128px;
    padding:18px 16px 14px;border-radius:18px;background:#fff;
    box-shadow:0 12px 30px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.07);
    z-index:4}
  .ce-prompt{height:52px;font-size:16px;font-weight:450;line-height:20px;
    color:#555;white-space:normal;overflow:hidden}
  .ce-prompt-cursor{display:inline-block;width:1px;height:16px;margin-left:2px;
    vertical-align:-3px;background:#777;opacity:0}
  .ce-prompt-cursor.on{opacity:1;animation:hbBlink .8s steps(1) infinite}
  .ce-presets{position:absolute;left:16px;bottom:13px;display:flex;gap:7px}
  .ce-chip{padding:7px 10px;border-radius:8px;background:#f1f1f2;color:#3e3e40;
    font-size:12px;font-weight:520;line-height:1}
  .ce-ratio{position:absolute;right:55px;bottom:14px;padding:6px 9px;border-radius:8px;
    background:#f1f1f2;color:#3e3e40;font-size:12px;font-weight:520;line-height:1}
  .ce-ratio::before{content:'';display:inline-block;width:12px;height:7px;
    margin-right:6px;border:1px solid #666;border-radius:2px;vertical-align:-1px}
  .ce-generate{position:absolute;right:14px;bottom:13px;width:30px;height:30px;
    border-radius:9px;background:#171717;color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:18px;font-weight:600;line-height:1;opacity:.35}
  .ce-action{position:absolute;bottom:10px;padding:8px 13px;border-radius:8px;
    background:#f1f1f2;color:#343436;font-size:13px;font-weight:600;line-height:1}
  .ce-cancel{left:12px}
  .ce-done{right:12px;background:#8f8f8f;color:#fff}
  /* The press feedback for Add to media, centred on the pointer's seat in it. */
  .ce-done-ring{position:absolute;left:1156px;top:594px;width:36px;height:36px;
    border:1.5px solid rgba(255,207,62,.88);border-radius:50%;opacity:0;
    transform:scale(.9);z-index:6;pointer-events:none}

  /* The payoff: the variant that was just generated, live on the storefront.
     This is card 1's browser reused outright — every .ef-site* rule, including
     the frame's shadow stack and 56px chrome — because the two cards make the
     same promise and a second copy of it would drift. Only three things differ:
     it opens at this card's own y, the product slot takes a centred cover crop
     (card 1's -27.02%/142.61% is tuned to its tube shot, and applying that to a
     3:4 bottle cuts the pump off), and the CTA carries the backend's price. */
  .ce-wrap>.shd{z-index:3}
  .ce-site{top:360px}
  /* The product slot takes the result's own 3:4 ratio (470/624 = .7532 against
     the asset's .7534), so the generated frame is shown whole rather than
     cropped. Card 1's 561x590 slot is tuned to its landscape tube shot: at that
     width the bottle needs 618px of height and there are ~615px between "Back
     to list" and the fold, so a full-width crop cannot contain it — the pump
     goes at the top and the base at the bottom, which is what it was doing.
     Narrower and taller is the only fit that shows all of it above the fold;
     below the bottle there is only backdrop, and that is what the stage clips. */
  .ce-site .ef-site-photo{top:50px;width:470px;height:624px}
  .ce-site .ef-site-photo img{top:0;height:100%}
  .ce-site .ef-site-cta{display:flex;align-items:baseline;gap:14px}
  .ce-site-price{font-weight:500;opacity:.72}

  /* Card 5 — the booth wall, laid out to storyboard frame 207:1131.
     Two rows of three, and the marks are *not* on a grid: the frame places
     each optically, so row 2's vertical centres alone differ by 15px. Six
     wordmarks of very different weight at a common size would otherwise read
     as a ragged line, so each mark is pinned to its own slot at its own
     exported size (ECOM_WALL, reading order). A three-column grid gets close
     and is visibly wrong at booth scale — the same reason the inherited
     Webflow wall carries LW_SLOTS. Sizes are the asset viewBoxes: re-export
     from this frame or the boxes stop matching. */
  .el-wrap{position:absolute;inset:0}
  .el-title{position:absolute;left:302px;top:175px;width:1316px;text-align:center;
    font-size:32px;font-weight:580;letter-spacing:-.48px;line-height:1.065;color:#bcbdc0;
    text-box-trim:trim-both;text-box-edge:cap alphabetic}
  .el-logo{position:absolute;color:#fff;
    opacity:0;transform:translateY(12px);
    transition:opacity .28s ease,transform .44s var(--ease-out);
    transition-delay:calc(.12s + var(--i)*.075s)}
  .slide.active .el-logo{opacity:1;transform:none}
  .el-logo svg{width:100%;height:100%;display:block}
  /* a name with no vector yet: centre a word in the slot the mark would fill */
  .el-word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:27px;font-weight:620;letter-spacing:-.35px;color:#d9d9dc;white-space:nowrap}

  /* Card 6 — frame 218:1470. The rail is the frame's 989px flex row, including
     its actual 8.14062px nodes and 308.719px line exports. The file travels on
     a separate layer so translating it never disturbs that geometry. */
  .ei-wrap{position:absolute;inset:0;background:#090909}
  .ei-wrap .shd{--shd-y:180px}
  .ei-wrap .shd-s{margin-top:52px}
  .ei-rail{position:absolute;left:466px;top:701px;width:989px;height:49px;
    display:flex;align-items:center}
  /* above the connectors: the expanded node/line/node still spans the original
     gap while it fades, and the step sliding inward over it has to cover it
     rather than have a stroke drawn across its face */
  .ei-step{position:relative;z-index:1;
    flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    padding:16px 32px;border:1px solid rgba(255,255,255,.09);border-radius:12px;
    background:#090909;color:#9a9a9a;font-family:var(--cmono);font-size:11.502px;
    line-height:normal;font-weight:400;text-transform:uppercase;white-space:nowrap;
    transition:border-color .24s ease,background .24s ease,color .24s ease}
  .ei-step[data-state="active"]{border-color:#414141;background:#111;color:#fff}
  .ei-step[data-state="done"]{border-color:#2c2c2c;color:#c7c7c7}
  .ei-connector{position:relative;min-width:0;flex:1;height:8.141px}
  .ei-expanded{position:absolute;inset:0;display:flex;align-items:center}
  .ei-collapsed{position:absolute;left:50%;top:50%;width:66.281px;height:8.141px;
    transform:translate(-50%,-50%);opacity:0}
  .ei-collapsed svg{display:block;width:66.281px;height:8.141px}
  .ei-path-node{width:8.141px;height:8.141px;flex:none}
  .ei-path-node svg{display:block;width:8.141px;height:8.141px}
  .ei-path-line{height:1px;min-width:0;flex:1}
  .ei-path-line svg{display:block;width:100%;height:1px}
  .ei-expanded path{transition:fill .75s var(--ease-in-out)}
