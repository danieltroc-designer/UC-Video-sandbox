<script>
/* =========================================================
   Uploadcare TV show — auto-playing 16:9 deck
   Types: statement | number | chart | stats | logo
========================================================= */
const LOGO = document.getElementById('logo-src').textContent;
const GLYPH = document.getElementById('glyph-src').textContent;
const ASSETS = JSON.parse(document.getElementById('assets-src').textContent);
const GLOBE = document.getElementById('globe-src').textContent;
const UPLOADER = JSON.parse(document.getElementById('uploader-src').textContent);
const QR = (document.getElementById('qr-src')||{}).textContent || '';
const LOGOS = JSON.parse(document.getElementById('logos-src').textContent);
const UI = JSON.parse(document.getElementById('uploaderui-src').textContent);
const DEMO = JSON.parse(document.getElementById('demo-src').textContent);
const CAPS = JSON.parse(document.getElementById('caps-src').textContent);
const MARKET = JSON.parse(document.getElementById('market-src').textContent);
const COMPLIANCE = JSON.parse(document.getElementById('compliance-src').textContent);
const ECOMMERCE = JSON.parse(document.getElementById('ecommerce-src').textContent);
const PIXEL = JSON.parse(document.getElementById('pixel-src').textContent);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- motion system ----------------
   JS twin of the CSS motion tokens, so the cursor demos speak the same
   language. springKeyframes() numerically integrates a damped spring and
   returns sampled positions; response = time-to-target feel (seconds),
   bounce = overshoot (0 = critically damped, Apple's default; ~0.15 = a
   momentum landing). This is what makes the fake pointer settle like a real
   physical object instead of sliding a fixed distance in a fixed time. */
const EASE = { out:'cubic-bezier(.16,1,.3,1)', inOut:'cubic-bezier(.4,0,.2,1)', pop:'cubic-bezier(.34,1.45,.64,1)' };
function springKeyframes(from, to, {response=0.4, bounce=0, velocity={}}={}){
  const mass = 1;
  const stiffness = Math.pow((2*Math.PI)/response, 2) * mass;
  const zeta = bounce>=0 ? 1-bounce : 1/(1+bounce);      // damping ratio
  const damping = zeta * 2 * Math.sqrt(stiffness*mass);
  const dt = 1/120, maxT = Math.max(response*4, 1.5);
  const props = Object.keys(to);
  const st = props.map(p=>({x:(from[p]||0), v:(velocity[p]||0), t:to[p]}));
  const frames = [];
  for (let t=0; t<=maxT; t+=dt){
    let settled = true;
    for (const s of st){
      const f = stiffness*(s.t - s.x) - damping*s.v;      // Hooke + viscous damping
      s.v += f*dt; s.x += s.v*dt;
      if (Math.abs(s.t-s.x) > 0.35 || Math.abs(s.v) > 0.35) settled = false;
    }
    frames.push(st.map(s=>s.x));
    if (t > response*0.5 && settled) break;
  }
  frames.push(st.map(s=>s.t));                             // snap exactly home
  return { frames, props, duration: frames.length*dt*1000 };
}
/* When does a spring first put the thing somewhere? Returns seconds from the
   spring's own start, or null if it never satisfies `hits`.

   Needed because a scripted pointer has no dragenter to fire: to light a drop
   zone on the frame the cursor crosses into it, you have to ask the trajectory
   where it is rather than guess an offset from the settle time. Re-integrating
   the spring is free next to hand-tuning a constant that silently goes wrong
   the moment anyone changes `response` or the travel. */
function springCrossing(from, to, opts, hits){
  const { frames, props } = springKeyframes(from, to, opts);
  for (let i = 0; i < frames.length; i++){
    const o = {};
    props.forEach((p,j)=>o[p] = frames[i][j]);
    if (hits(o)) return i/120;                            // springKeyframes steps at 1/120
  }
  return null;
}

/* The same question for an authored path: when does a pointer following
   `points` (each {at,x,y}, `at` a fraction of `dur` seconds) first satisfy
   `hits`? Only valid for effects running easing:'linear', which is why the
   card that uses this puts its velocity profile in the waypoints instead of a
   timing function — an eased effect would make `at` a fraction of progress
   rather than of time, and the answer here would be wrong by the easing.
   Walking it at 4ms is exact enough for a cue that has to land on a frame. */
function pathCrossing(points, dur, hits){
  for (let t = 0; t <= dur*1000; t += 4){
    const f = t/(dur*1000);
    let i = 1;
    while (i < points.length-1 && points[i].at < f) i++;
    const a = points[i-1], b = points[i];
    const k = (f - a.at)/((b.at - a.at) || 1);
    if (hits(a.x + (b.x-a.x)*k, a.y + (b.y-a.y)*k)) return t/1000;
  }
  return dur;
}

/* An element's box in some positioned ancestor's coordinates, as a hit test.
   offsetLeft/offsetTop, never a rect: #stage is CSS-scaled, so rects are in
   screen px and would put the box somewhere else on a laptop. */
function inside(el, root){
  let x = 0, y = 0, n = el;
  while (n && n !== root){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  const w = el.offsetWidth, h = el.offsetHeight;
  return (px,py)=> px >= x && px <= x+w && py >= y && py <= y+h;
}

/* spring a translated element from {x,y} to {x,y} via WAAPI (easing:'linear',
   the spring is baked into the sampled frames). Extra WAAPI options (delay,
   fill) pass through. */
function springTo(el, from, to, opts={}){
  const { frames, props, duration } = springKeyframes(from, to, opts);
  const kf = frames.map(vals=>{
    const o = {}; props.forEach((p,i)=>o[p]=vals[i]);
    return { transform:`translate(${o.x||0}px,${o.y||0}px)` };
  });
  return el.animate(kf, { duration, delay:opts.delay||0, easing:'linear', fill:opts.fill||'both' });
}

/* ---------------- Timeline ----------------
   One score per slide, written in absolute seconds instead of nested
   setTimeouts. A card's choreography reads top to bottom as "what happens
   when", and retiming a beat means changing one number rather than
   re-deriving a chain of offsets.

   Everything a card schedules is owned by its timeline, so leaving the slide
   is a single kill() — no per-card timer arrays to keep in sync.

     const tl = new Timeline({reduced:REDUCED});
     tl.cls(zone, 'hot', 1.95);            // class on at t
     tl.cls(zone, 'hot', 3.45, false);     // ...and off again
     tl.to(card, [{opacity:0},{opacity:1}], {dur:.4, at:2.45});
     tl.at(2.95, ()=>txt.textContent='2 files added');
     tl.play();

   Under reduced motion the score collapses to its end state: tweens jump to
   their last keyframe and cues fire in time order at play(), so the slide
   shows the settled frame with no movement. Cards whose settled frame is
   deliberately *not* the end of the animation still branch on REDUCED
   themselves before building a score. */
function Timeline({reduced=false}={}){
  const timers=[], anims=[], cues=[], teardown=[];
  let killed=false, played=false;

  // a keyframe minus the WAAPI-only keys, so it can be written straight to .style
  const styleOf = kf => {
    const o = {...kf}; delete o.easing; delete o.offset; delete o.composite; return o;
  };
  const apply = (el, styles) => { if (el) Object.assign(el.style, styles); };

  const api = {
    reduced,

    /* run fn at t seconds */
    at(t, fn){ cues.push([Math.max(0,t)*1000, fn]); return api; },

    /* raw relative timer owned by this timeline — for recursive work like the
       typewriters, which aren't expressible as a fixed score */
    timeout(ms, fn){
      if (killed) return api;
      timers.push(setTimeout(()=>{ if(!killed) fn(); }, ms));
      return api;
    },

    /* toggle a class at t */
    cls(el, name, t, on=true){
      if (!el) return api;
      return api.at(t, ()=>el.classList.toggle(name, on));
    },

    /* write styles at t (t=0 applies at play) */
    set(el, styles, t=0){
      if (!el) return api;
      return api.at(t, ()=>apply(el, styles));
    },

    /* WAAPI tween. {dur, at, ease, fill} in seconds; ease takes an EASE value */
    to(el, kf, {dur=.4, at=0, ease=EASE.out, fill='both'}={}){
      if (!el) return api;
      const frames = Array.isArray(kf) ? kf : [kf];
      if (reduced){ api.at(at, ()=>apply(el, styleOf(frames[frames.length-1]))); return api; }
      api.at(0, ()=>{
        anims.push(el.animate(frames, {duration:dur*1000, delay:at*1000, easing:ease, fill}));
      });
      return api;
    },

    /* spring a translated element between two {x,y} points; returns the
       timeline so calls chain, and reports arrival via onArrive(t) */
    spring(el, from, to, {at=0, response=.6, bounce=.1, onArrive}={}){
      if (!el) return api;
      if (reduced){
        api.at(at, ()=>apply(el, {transform:`translate(${to.x}px,${to.y}px)`}));
        onArrive && onArrive(at);
        return api;
      }
      const {duration} = springKeyframes(from, to, {response, bounce});
      api.at(0, ()=>anims.push(springTo(el, from, to, {response, bounce, delay:at*1000})));
      onArrive && onArrive(at + duration/1000);
      return api;
    },

    /* adopt an animation the card started itself — usually because a keyframe
       value can only be measured at the moment it runs (height:auto and
       friends). Adopting it means kill() still reaches it. */
    anim(a){ if (a) anims.push(a); return api; },

    /* run fn when the score is retired, for anything with a lifetime of its
       own: rAF loops, observers, canvases */
    onKill(fn){ if (fn) teardown.push(fn); return api; },

    play(){
      if (killed || played) return api;
      played = true;
      const ordered = cues.slice().sort((a,b)=>a[0]-b[0]);
      if (reduced){ ordered.forEach(([,fn])=>fn()); return api; }
      ordered.forEach(([ms,fn])=>{
        if (ms<=0) fn();
        else timers.push(setTimeout(()=>{ if(!killed) fn(); }, ms));
      });
      return api;
    },

    kill(){
      killed = true;
      timers.forEach(clearTimeout); timers.length=0;
      anims.forEach(a=>{ try{ a.cancel(); }catch(e){} }); anims.length=0;
      teardown.forEach(fn=>{ try{ fn(); }catch(e){} }); teardown.length=0;
      cues.length=0;
      return api;
    },
  };
  return api;
}

/* ---------------- default deck ---------------- */
/* ---- Ecommerce Expo — 63-second, seven-card booth loop ----------------
   Product image in, storefront out; benefits and proof; one focused AI Editor
   demonstration; customer trust; then the system view and booth CTA.
   Durations are 10/11/6/13/5/8/10 seconds. Cards 1 and 4 carry longer slots
   because they demonstrate processes rather than stating a fact, and every
   beat has to be legible from across a stand. Card 2 gives each of five
   benefits two full one-second highlights; Card 6 holds its final Uploadcare
   lockup for two extra seconds. */
const DEFAULT_DECK = {
  settings: { duration: 6, fade: 480, watermark: true },
  slides: [
    { type:'commerceFlow', duration:10,
      heading:'Every product image, optimized and fast. Automatically.' },

    { type:'commerceBenefits', duration:11 },

    { type:'commerceMetric', duration:6,
      value:'2x faster page loads.',
      line:'Faster pages, more sales.',
      quote:'This way, we get the absolute most speed we can when loading our web pages across mobile devices.',
      attribution:'Sam McKinney, Director of Agency Services at Zephyr',
      by:'Zephyr' },

    { type:'commerceEditor', duration:13,
      heading:'Turn any photo\ninto a catalog-ready product shot.' },

    { type:'commerceLogos', duration:5,
      title:'Trusted by',
      logos:'L\u2019Or\u00e9al, Crayola, Samsonite, GemPages, Shogun, Marko' },

    { type:'commerceInfrastructure', duration:8,
      heading:'The infrastructure\nbehind every product image.',
      sub:'One integration. Upload, optimize, and deliver every image, and every other file.',
      steps:'Upload, Optimize, Deliver' },

    { type:'commerceOutro', duration:10, layout:'outro',
      title:'Load faster,\nsell more.',
      sub:'Come say hi \ud83d\udc4b\nand enter to win LEGO Polaroid Camera Building Set',
      qr:true, qrConfirmed:false, qrLabel:'QR URL to confirm', booth:'' }
  ]
};

let deck = JSON.parse(JSON.stringify(DEFAULT_DECK));

/* ---------------- stage scaling ---------------- */
const stage = document.getElementById('stage');
/* UC Video sandbox embeds one card at a time. ?card=N plays card N on its own
   (no auto-advance, no kiosk chrome); &format=landscape|portrait|square sets
   the stage shape; &hold waits for window.__deckStart() so the renderer can
   start the clock itself once fonts and images are in. */
const EMBED = (()=>{
  const q = new URLSearchParams(location.search);
  if (!q.has('card')) return null;
  const format = ['landscape','portrait','square'].includes(q.get('format')) ? q.get('format') : 'landscape';
  return { card: Math.max(0, parseInt(q.get('card'), 10) || 0), format, hold: q.has('hold') };
})();
if (EMBED){ document.body.classList.add('embed'); stage.dataset.format = EMBED.format; }
/* Shapes each card type has been recomposed for, beyond its original 16:9. */
const CARD_FORMATS = {
  commerceFlow: ['portrait','square'],
  commerceMetric: ['portrait','square'],
  commerceBenefits: ['portrait','square'],
  commerceEditor: ['portrait','square'],
  commerceLogos: ['portrait','square'],
  commerceInfrastructure: ['portrait','square'],
  commerceOutro: ['portrait','square'],
};
function fit(){
  const s = Math.min(innerWidth/stage.offsetWidth, innerHeight/stage.offsetHeight);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ---------------- renderers ---------------- */
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function multiline(s){ return esc(s).replace(/\n/g,'<br>'); }
/* Split each emoji out of a line so it can be animated on its own. The
   sign-off's hand is a gesture, not decoration on the type: it needs its own
   transform origin, and rotating the whole text run would swing the words.
   Emoji are matched anywhere, not just at the end — the sign-off grew a second
   line under the wave, which left the hand mid-string. Anything wrapped here
   shares one animation, so several emoji in a line would gesture in unison. */
const EMOJI_RUN = /\p{Extended_Pictographic}[\p{Extended_Pictographic}\uFE0F\u200D]*/gu;
function emojiHTML(text, cls){
  const s = String(text ?? '');
  let out = '', last = 0;
  for (const m of s.matchAll(EMOJI_RUN)){
    out += multiline(s.slice(last, m.index)) + `<span class="${cls}"><i>${esc(m[0])}</i></span>`;
    last = m.index + m[0].length;
  }
  return out + multiline(s.slice(last));
}
/* single-field headline, with a fallback that merges the old dimmed line1 +
   bright line2 into one flowing string so existing decks keep working. */
function headText(s){ return s.heading!=null ? s.heading : [s.line1,s.line2].filter(v=>v).join(' '); }
function headText2(s){ return s.heading2!=null ? s.heading2 : [s.line1b,s.line2b].filter(v=>v).join(' '); }

/* ---------------- shared "text animation" system ----------------
   One control (see fieldsFor) drives how every .reveal element on a slide
   enters: rise (default, already the base .reveal look) | blur (soft-focus
   settle) | weight (Inter Variable weight-morph — needs the embedded
   variable font) | stagger (word-by-word cascade). Runs once per slide at
   render time so it composes for free with the existing .reveal/d1-d4
   delay system. ------------------------------------------------------- */
function wrapWords(el){
  let wi = 0;
  el.innerHTML = el.innerHTML.split('<br>').map(line=>
    line.split(/(\s+)/).map(tok=>{
      if (!tok.trim()) return tok;
      const span = `<span class="w" style="--wi:${wi}">${tok}</span>`;
      wi++;
      return span;
    }).join('')
  ).join('<br>');
}
function wrapInner(el){ el.innerHTML = `<span class="cl">${el.innerHTML}</span>`; }
function applyTextFx(slideEl, fx){
  slideEl.querySelectorAll('.reveal').forEach(el=>{
    el.classList.remove('fx-blur','fx-weight','fx-stagger','fx-clip');
    el.style.removeProperty('--fw-target');
    if (!fx || fx==='rise') return;
    const textOnly = [...el.childNodes].every(n=>n.nodeType===3 || (n.nodeType===1 && n.tagName==='BR'));
    if (fx==='stagger'){
      if (textOnly && el.textContent.trim()){ wrapWords(el); el.classList.add('fx-stagger'); }
      return;
    }
    if (fx==='clip'){
      if (textOnly && el.textContent.trim()){ wrapInner(el); el.classList.add('fx-clip'); }
      return;
    }
    if (fx==='weight') el.style.setProperty('--fw-target', getComputedStyle(el).fontWeight);
    el.classList.add('fx-'+fx);
  });
}

/* Upload -> Store -> Transform -> Deliver chip row, reused by any statement
   slide that wants to show the pipeline (see s.pipeline). */
function pipelineHTML(shine){
  const steps = ['Upload','Store','Transform','Deliver'];
  const parts = [];
  let n = 0;
  steps.forEach((label,i)=>{
    if (i>0){ parts.push(`<div class="pl-line" style="--pi:${n}"><i></i><span></span><i></i></div>`); n++; }
    parts.push(`<div class="pl-pill" style="--pi:${n}">${label}</div>`); n++;
  });
  return `<div class="pl-row reveal d3 pl-anim${shine?' pl-shine':''}">${parts.join('')}</div>`;
}

/* mono subtitle for the platform slide — text after a "|" glows brand-yellow
   (e.g. "Upload. Store. Transform. Deliver. |One integration"). */
function subtitleHTML(s){
  const raw = String(s||'');
  const i = raw.indexOf('|');
  const head = esc(i<0 ? raw : raw.slice(0,i));
  const hi = i<0 ? '' : `<span class="st-sub-hi">${esc(raw.slice(i+1))}</span>`;
  return `<div class="st-sub reveal d2">${head}${hi}</div>`;
}

/* faint procedural "growing complexity" overlay for the mockup slide's
   complexity kind — a static, deterministic web of lines and nodes */
function mockupOverlaySVG(){

/* Portrait stacks the six marks in one column; square hangs them on two

   from the frame (how far its centre sits off its own row's), both scaled
   with it — only the grid they hang on changes. cols are column centres, rows are row centres, in px. */
const ecomWallRestack = (scale, cols, rows)=>ECOM_WALL.map(([x,y,w,h],i)=>{
  const row = i<3 ? ECOM_WALL.slice(0,3) : ECOM_WALL.slice(3,6);
  const mean = row.reduce((a,r)=>a + r[1] + r[3]/2, 0) / row.length;
  const W = w*scale, H = h*scale;
  const cx = cols[i % cols.length], cy = rows[Math.floor(i / cols.length)] + (y + h/2 - mean)*scale;

});

/* ---------------- ambient substrate ----------------
   Trickles signal blips through the margins for as long as the deck runs. This
   lives outside the per-slide Timeline on purpose: it has to survive slide
   changes, and killing it between cards is exactly the flicker it exists to
   avoid.

   Zones are percentages of the stage and stay clear of the middle, where the
   headlines and product art sit. */
const SB_ZONES = [
  [ 3, 13, 15, 85],   // left column
  [87, 97, 15, 85],   // right column
  [15, 85,  4, 11],   // top strip
  [15, 85, 89, 96],   // bottom strip
];
const SB_MAX = 7;     // concurrent blips — enough to feel alive, not busy
const SB_MIN_DX = 6, SB_MIN_DY = 9;   // % apart, or they read as a dotted line
/* The storyboard draws these particles into its frames, and this is the palette
   it uses: white, periwinkle, and the same lime as the quote panel. */
const SB_COLORS = ['#ffffff', '#b6b7ff', '#d8ff6e'];

function startSubstrate(){
  const field = document.getElementById('sbField');
  if (!field || REDUCED) return;      // reduced motion runs no ambient layer
  const rnd = (a,b)=>a+Math.random()*(b-a);
  const live = new Set();

  // a zone is a narrow strip, so uniform placement inside one tends to stack
  // blips into a column; reject anything landing too near a live neighbour
  const place = ()=>{
    for (let i=0;i<8;i++){
      const [x0,x1,y0,y1] = SB_ZONES[(Math.random()*SB_ZONES.length)|0];
      const x = rnd(x0,x1), y = rnd(y0,y1);
      let clear = true;
      for (const p of live){
        if (Math.abs(x-p.x) < SB_MIN_DX && Math.abs(y-p.y) < SB_MIN_DY){ clear=false; break; }
      }
      if (clear) return {x,y};
    }
    return null;
  };

  (function spawn(){
    if (live.size < SB_MAX){
      const p = place();
      if (p){
        const blip = document.createElement('i');
        blip.className = 'sb-blip';
        blip.style.cssText = `left:${p.x.toFixed(2)}%;top:${p.y.toFixed(2)}%;`
                           + `--life:${rnd(2200,3400)|0}ms;`
                           + `--c:${SB_COLORS[Math.random()*SB_COLORS.length|0]}`;
        live.add(p);
        blip.addEventListener('animationend', ()=>{ live.delete(p); blip.remove(); });
        field.appendChild(blip);
      }
    }
    setTimeout(spawn, rnd(700,1600));
  })();
}

/* ---------------- auto-fit oversized headlines ---------------- */
function fitText(slideEl){
  const MAXW = 1740; // usable width inside the 1920 stage
  slideEl.querySelectorAll('.num-big,.st-line1,.st-line2,.ch-big').forEach(el=>{
    el.style.fontSize=''; // reset to stylesheet value
    let size = parseFloat(getComputedStyle(el).fontSize), guard = 0;
    while (el.scrollWidth > MAXW && size > 40 && guard < 40){
      size *= Math.max(.7, MAXW/el.scrollWidth * .98);
      el.style.fontSize = size+'px';
      guard++;
    }
  });
}

/* ---------------- per-slide animations ---------------- */
function animateCount(el){
  const target = +el.dataset.value, dec = +el.dataset.decimals;
  if (REDUCED){ el.textContent = target.toFixed(dec); return; }
  const dur = 1300, t0 = performance.now();
  function tick(t){
    const p = Math.min(1,(t-t0)/dur);
    const e = 1 - Math.pow(1-p, 4); // expo-out: fast start, smooth settle
    el.textContent = (target*e).toFixed(dec);
    if (p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function buildChart(svg){
  const pts = svg.dataset.points.split(',').map(v=>parseFloat(v)).filter(v=>!isNaN(v));
  if (pts.length<2) return;
  const x0=340, x1=1780, yTop=330, yBot=880;
  const min=Math.min(...pts), max=Math.max(...pts);
  const X=i=>x0+(x1-x0)*i/(pts.length-1);
  const Y=v=>yBot-(yBot-yTop)*((v-min)/((max-min)||1));
  const d = pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const sx=X(0), sy=Y(pts[0]), ex=X(pts.length-1), ey=Y(pts[pts.length-1]);
  svg.innerHTML = `
    <path class="ch-line" d="${d}"/>
    <rect class="ch-dot dot-s" x="${sx-9}" y="${sy-9}" width="18" height="18"/>
    <rect class="ch-dot dot-e" x="${ex-9}" y="${ey-9}" width="18" height="18"/>
    <text class="ch-val val-s" x="${sx-8}" y="${sy-42}">${svg.dataset.start}</text>
    <text class="ch-val val-e" x="${ex-120}" y="${ey-52}" text-anchor="start">${svg.dataset.end}</text>`;
  const path = svg.querySelector('.ch-line');
  const len = path.getTotalLength();
  const dotS=svg.querySelector('.dot-s'), dotE=svg.querySelector('.dot-e');
  const valS=svg.querySelector('.val-s'), valE=svg.querySelector('.val-e');
  if (REDUCED){
    [dotS,dotE,valS,valE].forEach(n=>n.style.opacity=1);
    return;
  }
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  // start marker + label appear first
  setTimeout(()=>{ dotS.style.transition=valS.style.transition='opacity .4s'; dotS.style.opacity=valS.style.opacity=1; }, 200);
  // draw the line
  setTimeout(()=>{
    path.style.transition = `stroke-dashoffset 1900ms cubic-bezier(.16,1,.3,1)`;
    path.style.strokeDashoffset = 0;
  }, 450);
  // end marker + label
  setTimeout(()=>{ dotE.style.transition=valE.style.transition='opacity .4s'; dotE.style.opacity=valE.style.opacity=1; }, 2350);
}

/* ---------------- logo animation engine ----------------
   Whole lockup:  assemble | rise | sweep
   Mark only:     mark-ring | mark-scatter | mark-breathe
--------------------------------------------------------- */
function animateLogo(container){
  const box = container.querySelector('.la-logo');
  if (!box) return;
  const svg = box.querySelector('svg');
  const variant = box.dataset.variant || 'assemble';
  const isMark = variant.startsWith('mark');

  // reset any running animations from a previous pass
  svg.getAnimations({subtree:true}).forEach(a=>a.cancel());
  svg.getAnimations().forEach(a=>a.cancel());

  const pixels  = [...svg.querySelectorAll('path[fill="#FFCF3E"]')];
  const letters = [...svg.querySelectorAll('path[fill="white"]')];
  letters.forEach(l=>l.style.display = isMark ? 'none' : '');
  svg.setAttribute('viewBox', isMark ? '0 0 147 147' : '0 0 803 147');
  svg.style.filter=''; svg.style.opacity='';
  pixels.concat(letters).forEach(n=>{ n.style.opacity=''; n.style.transform=''; });

  const tag = container.querySelector('.la-tag');
  if (tag) tag.getAnimations().forEach(a=>a.cancel());

  const bb = el=>{ try{ return el.getBBox(); }catch(e){ return {x:0,y:0,width:0,height:0}; } };
  const C = {x:73.5, y:73.5};
  const px = pixels.map(p=>{
    const b=bb(p), cx=b.x+b.width/2, cy=b.y+b.height/2;
    return {p, cx, cy,
      dist: Math.hypot(cx-C.x, cy-C.y),
      ang: (Math.atan2(cy-C.y, cx-C.x) + Math.PI*2.5) % (Math.PI*2)}; // 0 = top, clockwise
  });
  const maxDist = Math.max(...px.map(o=>o.dist), 1);
  const lx = letters.map(l=>({l, x: bb(l).x}));

  const showTag = (delay)=>{
    if (!tag) return;
    if (REDUCED){ tag.style.opacity=1; return; }
    tag.animate([{opacity:0, transform:'translateY(12px)'},{opacity:1, transform:'none'}],
      {duration:560, delay, easing:'cubic-bezier(.16,1,.3,1)', fill:'both'});
  };

  if (REDUCED){
    pixels.concat(letters).forEach(n=>n.style.opacity=1);
    if (tag) tag.style.opacity=1;
    return;
  }

  const EASE_OUT = 'cubic-bezier(.22,.61,.36,1)';
  const EASE_POP = 'cubic-bezier(.34,1.45,.64,1)';

  switch(variant){

    /* 1 — pixels of the ring assemble outward from the center,
           then the wordmark letters cascade in */
    case 'assemble': {
      px.sort((a,b)=>a.dist-b.dist).forEach((o,i)=>{
        o.p.animate(
          [{opacity:0, transform:'scale(.2)'},{opacity:1, transform:'scale(1)'}],
          {duration:520, delay:120+i*16, easing:EASE_POP, fill:'both'});
      });
      lx.sort((a,b)=>a.x-b.x).forEach((o,i)=>{
        o.l.animate(
          [{opacity:0, transform:'translateY(12px)'},{opacity:1, transform:'none'}],
          {duration:600, delay:820+i*26, easing:EASE_OUT, fill:'both'});
      });
      showTag(1500);
      break;
    }

    /* 2 — cinematic rise: the whole lockup surfaces out of soft focus */
    case 'rise': {
      svg.animate(
        [{opacity:0, filter:'blur(16px)', transform:'translateY(46px) scale(.985)'},
         {opacity:1, filter:'blur(0px)',  transform:'none'}],
        {duration:1600, delay:150, easing:EASE_OUT, fill:'both'});
      // gentle secondary settle on the mark
      pixels.forEach(p=>p.animate(
        [{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],
        {duration:1200, delay:1750, easing:'ease-in-out'}));
      showTag(1400);
      break;
    }

    /* 3 — light sweep: everything reveals left→right, then a soft
           highlight travels across once */
    case 'sweep': {
      const all = px.map(o=>({el:o.p, x:o.cx})).concat(lx.map(o=>({el:o.l, x:o.x})));
      all.forEach(o=>{
        const d = 150 + (o.x/803)*900;
        o.el.animate(
          [{opacity:0, transform:'translateX(-8px)'},{opacity:1, transform:'none'}],
          {duration:450, delay:d, easing:EASE_OUT, fill:'both'});
        o.el.animate(
          [{filter:'brightness(1)'},{filter:'brightness(1.9)'},{filter:'brightness(1)'}],
          {duration:520, delay:1650 + (o.x/803)*700, easing:'ease-in-out'});
      });
      showTag(1500);
      break;
    }

    /* 4 — mark only: the ring builds clockwise from 12 o'clock,
           then a soft glow keeps orbiting */
    case 'mark-ring': {
      const ordered = px.slice().sort((a,b)=>a.ang-b.ang);
      ordered.forEach((o,i)=>{
        o.p.animate(
          [{opacity:0, transform:'scale(.35)'},{opacity:1, transform:'scale(1)'}],
          {duration:420, delay:200+i*26, easing:EASE_POP, fill:'both'});
        // perpetual orbiting glow, phase-shifted by angle
        o.p.animate(
          [{opacity:1},{opacity:.45},{opacity:1}],
          {duration:3200, delay:200+ordered.length*26+500 + (o.ang/(Math.PI*2))*3200,
           iterations:Infinity, easing:'ease-in-out'});
      });
      showTag(1700);
      break;
    }

    /* 5 — mark only: pixels drift in from scattered positions and settle */
    case 'mark-scatter': {
      px.forEach(o=>{
        const dx=(Math.random()-.5)*220, dy=(Math.random()-.5)*220, r=(Math.random()-.5)*140;
        o.p.animate(
          [{opacity:0, transform:`translate(${dx}px,${dy}px) rotate(${r}deg) scale(.5)`},
           {opacity:1, transform:'none'}],
          {duration:1100, delay:100+Math.random()*450, easing:EASE_OUT, fill:'both'});
        // occasional twinkle after settling
        o.p.animate(
          [{opacity:1},{opacity:.6},{opacity:1}],
          {duration:2200+Math.random()*2600, delay:2200+Math.random()*2000,
           iterations:Infinity, easing:'ease-in-out'});
      });
      showTag(1500);
      break;
    }

    /* 6 — mark only: a calm breathing wave radiates from the center, forever */
    case 'mark-breathe': {
      px.forEach(o=>{
        o.p.animate([{opacity:0},{opacity:1}],
          {duration:700, delay:100+(o.dist/maxDist)*400, easing:EASE_OUT, fill:'both'});
        o.p.animate(
          [{transform:'scale(1)', opacity:.82},
           {transform:'scale(1.14)', opacity:1},
           {transform:'scale(1)', opacity:.82}],
          {duration:2800, delay:900+(o.dist/maxDist)*1100,
           iterations:Infinity, easing:'ease-in-out'});
      });
      showTag(1100);
      break;
    }
  }
}

    [['JPEG · 1 MB','']],
    [['','']],
    [['SCANNING... ',''],['DONE.','g']],

function fillMetaInstant(metaEl, spec){
  metaEl.innerHTML='';
  spec.lines.forEach(line=>{
    const div=document.createElement('div'); div.className='hb-line';
    line.forEach(([txt,cls])=>{
      const sp=document.createElement('span'); if(cls) sp.className=cls; sp.textContent=txt; div.appendChild(sp);
    });
    if(!line.length || (line.length===1 && line[0][0]==='')) div.innerHTML='&nbsp;';
    metaEl.appendChild(div);
  });
  if (spec.keepCursor){
    const c=document.createElement('span'); c.className='hb-cursor';
    metaEl.lastChild.appendChild(c);
  }
}

function typeMeta(metaEl, spec, speed, tl){
  metaEl.innerHTML='';
  const cursor=document.createElement('span'); cursor.className='hb-cursor';
  let li=0;
  function typeLine(){
    if(li>=spec.lines.length){
      if(!spec.keepCursor) cursor.remove();
      return;
    }
    const line=spec.lines[li];
    const div=document.createElement('div'); div.className='hb-line';
    metaEl.appendChild(div);
    // spacer line
    if(!line.length || (line.length===1 && line[0][0]==='')){
      div.innerHTML='&nbsp;'; li++;
      tl.timeout(speed*2, typeLine);
      return;
    }
    // flatten this line's characters with their class
    const chars=[];
    line.forEach(([txt,cls])=>{ for(const ch of txt) chars.push([ch,cls]); });
    let ci=0, span=null, curCls=null;
    div.appendChild(cursor);
    function typeChar(){
      if(ci>=chars.length){ li++; tl.timeout(speed*3, typeLine); return; }
      const [ch,cls]=chars[ci++];
      if(span===null || cls!==curCls){
        span=document.createElement('span'); if(cls) span.className=cls; curCls=cls;
        div.insertBefore(span, cursor);
      }
      span.textContent+=ch;
      tl.timeout(speed, typeChar);
    }
    typeChar();
  }
  typeLine();
}

function setupBoard(slideEl, sd, tl){
  const globe = slideEl.querySelector('.hb-globe');
  const mark = slideEl.querySelector('.hb-mark');
  const dots = [...slideEl.querySelectorAll('.hb-dot')];
  const nodes = [...slideEl.querySelectorAll('.hb-node')];

  // CSS loops need teardown just as much as Timeline timers do. The board was
  // previously absent from the default Expo deck, so its unscoped classes
  // could remain harmlessly dormant; using it as card 7 exposed that all 48
  // sparkle animations stayed alive after exit and accumulated each loop.
  const stopMotion = ()=>{
    globe && globe.classList.remove('spin');
    mark && mark.classList.remove('twinkle');
    dots.forEach(d=>d.classList.remove('pulse'));
    nodes.forEach(n=>n.classList.remove('float'));
  };
  stopMotion();                    // reset a prior visit before rebuilding it
  tl.onKill(stopMotion);

  if (globe && sd.globe!==false && !REDUCED) globe.classList.add('spin');

  /* Sparkle the centre glyph: every pixel gets its own slow cycle, its own
     phase, yellow and floor/ceiling, so the mark shimmers in brand yellows
     without any of it reading as one pulse. Negative delays start each square
     mid-cycle, which stops all 47 lifting together on the first beat. */
  if (mark && !REDUCED){
    const rnd = (a,b)=>a + Math.random()*(b-a);
    /* All five are #FFCF3E with a little more or less light in them. An
       earlier set ran from #f5bd22 to #fff0b0, which is a two-stop range: at
       booth distance the pale end reads as cream and the dark end as amber,
       so the mark looked like several colours rather than one brand yellow
       catching the light. The opacity floor is up as well — yellow this dark
       over #090909 goes brown before it goes dim. */
    const yellows = ['#ffcf3e','#ffd54e','#f9c733','#ffd247','#fdcb3a'];
    mark.querySelectorAll('path').forEach(px=>{
      px.style.setProperty('--d',  rnd(4.5, 9.5).toFixed(2)+'s');
      px.style.setProperty('--t',  (-rnd(0, 9.5)).toFixed(2)+'s');
      px.style.setProperty('--o1', rnd(.3, .52).toFixed(2));
      px.style.setProperty('--o2', rnd(.82, 1).toFixed(2));
      px.style.setProperty('--yc', yellows[Math.floor(rnd(0,yellows.length))]);
    });
    mark.classList.add('twinkle');
  }

  const floatOn = sd.float!==false && !REDUCED;
  if (floatOn) dots.forEach(d=>d.classList.add('pulse'));

  const fdur = {n1:9.5, n2:8, n3:11, n4:8.8};
  nodes.forEach(node=>{
    const key = node.dataset.meta;
    const spec = BOARD_META[key];
    const metaEl = node.querySelector('.hb-meta');

    if (floatOn){
      node.classList.add('float');
      const cls = [...node.classList].find(c=>/^n\d$/.test(c));
      node.style.setProperty('--fdur', (fdur[cls]||9)+'s');
      node.style.setProperty('--fdelay', (-Math.random()*6).toFixed(2)+'s');
    }

    if (!spec) return;
    if (sd.typing===false || REDUCED){
      fillMetaInstant(metaEl, spec);
    } else {
      // clear now, not when typing starts — the deck loops, and the node would
      // otherwise show the previous visit's finished text until startAt
      metaEl.innerHTML = '';
      const speed = Math.max(4, sd.typeSpeed||16);
      tl.at(spec.startAt/1000, ()=>typeMeta(metaEl, spec, speed, tl));
    }
  });
}

/* ---------------- code slide: generic terminal typewriter ----------------
   Simpler than the board's typeMeta (plain lines, no inline colour spans) —
   kept separate so the working board typewriter is never touched. --------- */
function fillLinesInstant(el, lines){
  el.innerHTML = lines.map(t=>t
    ? `<div class="hb-line">${esc(t)}</div>`
    : `<div class="hb-line">&nbsp;</div>`).join('');
}

function typeLines(el, lines, speed, tl){
  el.innerHTML='';
  const cursor=document.createElement('span'); cursor.className='hb-cursor';
  let li=0;
  function typeLine(){
    if (li>=lines.length){ cursor.remove(); return; }
    const div=document.createElement('div'); div.className='hb-line'; el.appendChild(div);
    const text=lines[li];
    if (!text){
      div.innerHTML='&nbsp;'; li++;
      tl.timeout(speed*2, typeLine);
      return;
    }
    const span=document.createElement('span');
    div.appendChild(span); div.appendChild(cursor);
    let ci=0;
    function typeChar(){
      if (ci>=text.length){ li++; tl.timeout(speed*3, typeLine); return; }
      span.textContent += text[ci++];
      tl.timeout(speed, typeChar);
    }
    typeChar();
  }
  typeLine();
}

/* code slide: the cursor glides onto RUN, taps it, and the command's output
   streams into the terminal. Cursor = WAAPI (self-cancels); output = timers. */
function setupCode(slideEl, sd, tl){
  const win = slideEl.querySelector('.cd-window');
  const out = slideEl.querySelector('.cd-out');
  const run = slideEl.querySelector('.cd-run');
  const cursor = slideEl.querySelector('.cd-cursor');
  if (!out || !run) return;
  const lines = (sd.lines || '').split('\n');

  out.innerHTML = ''; run.classList.remove('press');
  win && win.querySelectorAll('*').forEach(el=>el.getAnimations&&el.getAnimations().forEach(a=>a.cancel()));

  const paint = ()=>{ out.innerHTML = lines.map(t=>`<div>${t?esc(t):'&nbsp;'}</div>`).join('')
      .replace('\u2713','<span class="g">\u2713</span>'); };

  if (REDUCED){ if(cursor) cursor.style.opacity=0; paint(); return; }
  if (!cursor){ paint(); return; }

  // RUN button sits ~ lower-left of the window; cursor starts mid-window.
  // The travel is a spring so the pointer decelerates onto the button.
  const START={x:430,y:150}, OVER={x:70,y:392};
  cursor.style.opacity=0; cursor.style.transform=`translate(${START.x}px,${START.y}px)`;
  tl.to(cursor, [{opacity:0},{opacity:1}], {dur:.3, at:.7});
  let arrive = .8;
  tl.spring(cursor, START, OVER, {at:.8, onArrive:t=>arrive=t});
  // tap dip, anchored at the button (composes over the spring's settled value)
  tl.to(cursor, [
    {transform:`translate(${OVER.x}px,${OVER.y}px)`},
    {transform:`translate(${OVER.x}px,${OVER.y+5}px)`},
    {transform:`translate(${OVER.x}px,${OVER.y}px)`}],
    {dur:.24, at:arrive, ease:EASE.inOut});
  const clickAt = arrive + .09;
  tl.cls(run, 'press', clickAt);
  tl.cls(run, 'press', clickAt+.22, false);
  // after the tap, stream the output
  tl.at(clickAt+.32, ()=>typeLines(out, lines, Math.max(4, sd.typeSpeed||18), tl));
}

/* ---------------- card 5: install it from the marketplace ----------------
   The cursor crosses to the button, presses it, and the button works through
   Install -> Installing -> Installed.

   Every beat here is sized the way a real button would be, not the way a
   marketing loop usually is: the press is 140ms and the release snappier still,
   because that is the moment the interface is proving it heard the click. Only
   the install itself is slow, because that is the part that actually takes
   time. The travel is a spring so the pointer decelerates onto its target
   instead of stopping dead on a schedule. */
const WF_INSTALL_MS = 1150;   // must match .wf-btn[data-state="1"] .wf-sweep

function setupInstall(slideEl, sd, tl){
  const btn    = slideEl.querySelector('.wf-btn');
  const cursor = slideEl.querySelector('.wf-cursor');
  if (!btn) return;
  btn.dataset.state = '0';
  btn.classList.remove('press','pop');

  if (REDUCED){
    if (cursor) cursor.style.opacity = 0;
    btn.dataset.state = '2';                 // land on the outcome, no journey
    return;
  }
  if (!cursor) return;
  cursor.getAnimations().forEach(a=>a.cancel());

  // The pointer lands in the button's lower-right rather than dead centre: the
  // arrow's body then hangs off the corner instead of sitting on the label,
  // which is the one thing on this card that has to stay readable while it
  // changes. START is well clear of the panel, down and to the right, so the
  // trip is long enough to read as a trip.
  const TARGET = {x:946, y:776}, START = {x:1428, y:1006};
  cursor.style.opacity = 0;
  cursor.style.transform = `translate(${START.x}px,${START.y}px)`;

  // The pointer arrives before it moves, and only starts once it is fully up.
  // A spring is heavily front-loaded — at the deck's usual response it is half
  // way across inside 120ms — so fading in over the top of the travel means it
  // is already on the button by the time you can see it. It has to be a thing
  // sitting there, and then a thing that moves.
  tl.to(cursor, [{opacity:0},{opacity:1}], {at:1.0, dur:.25});
  const GO = 1.42;
  let arrive = GO;
  tl.spring(cursor, START, TARGET, {at:GO, response:.8, onArrive:t=>arrive=t});

  // Press: the pointer sinks with the button rather than hovering above it.
  // fill:'forwards' is not optional — the default 'both' would hold this
  // tween's first keyframe from t=0, parking the pointer on the button before
  // the spring ever gets to move it.
  const CLICK = arrive + .12;
  tl.to(cursor, [
    {transform:`translate(${TARGET.x}px,${TARGET.y}px)`},
    {transform:`translate(${TARGET.x}px,${TARGET.y + 3}px)`},
    {transform:`translate(${TARGET.x}px,${TARGET.y}px)`}],
    {at:CLICK, dur:.28, ease:EASE.inOut, fill:'forwards'});
  tl.cls(btn, 'press', CLICK);
  tl.cls(btn, 'press', CLICK + .14, false);

  // the click registers on release, which is where the state turns over
  const WORK = CLICK + .16;
  tl.at(WORK, ()=>{ btn.dataset.state = '1'; });
  // the pointer's work is done; it leaves rather than sitting on the result
  tl.to(cursor, [{opacity:1},{opacity:0}], {at:WORK + .30, dur:.28, fill:'forwards'});

  const DONE = WORK + WF_INSTALL_MS/1000;
  tl.at(DONE, ()=>{ btn.dataset.state = '2'; });
  tl.cls(btn, 'pop', DONE + .04);
  tl.cls(btn, 'pop', DONE + .20, false);
}

/* ---------------- card 1: drag, drop, upload ----------------
   The storyboard's three frames as one run: a stack of two files is dragged
   under a single cursor and dropped, the widget hands over to the compact
   uploading panel, and each file fills its ring and settles into a checkmark
   plus a bin. The storyboard dismisses the window at that point; this holds it
   instead, because that frame is the payoff.

   The travel is a spring rather than a tween — a dragged object carries
   momentum, and the pointer should decelerate onto the target instead of
   arriving on a fixed schedule. Everything else is transform and opacity, bar
   the ring, where stroke-dashoffset is the only way to draw a partial arc. */
const DI_RING_LEN = 57.6;                       // 2πr at r=9.167, the arc's dasharray

/* ------------- Expo card 1: upload -> optimization -> storefront -------------
   Frame 234:979 combines the Webflow uploader's complete interaction with the
   first two cells of the website pipeline. One 120x150 file moves into the
   real uploader, hands over to its compact progress row, then resolves in the
   right-hand analysis cell. The completed shell then recedes as frame 234:1415
   opens in the same 1252px footprint: browser chrome first, then its product
   photo and copy. The overlap explains that the processed file is already live
   without making the image itself teleport across the composition. */
function setupCommerceFlow(slideEl, sd, tl){
  const q = slideEl.querySelector.bind(slideEl);
  const qa = sel => [...slideEl.querySelectorAll(sel)];
  const process = q('.ef-process');
  const site = q('.ef-site');
  const sitePhoto = q('.ef-site-photo');
  const siteInfo = q('.ef-site-info');
  const left = q('.ef-left');
  const widget = q('.ef-widget');
  const drop = q('.ef-drop');
  const dropText = q('.ef-droptxt');
  const drag = q('.ef-drag');
  const dragCard = q('.ef-drag-card');
  const cursor = q('.ef-cursor');
  const panel = q('.ef-panel');
  const file = q('.ef-ufile');
  const arc = q('.ef-uaction .di-ring .arc');
  const wash = q('.ef-wash-in');
  const placeholder = q('.ef-analyse-ph');
  const image = q('.ef-analyse-img');
  const deleteButton = q('.ef-delete');
  const dots = qa('.ef-dots');
  const donut = qa('.ef-right .pd-donut .c');
  const lines = qa('.ef-analysis p');
  if (!process || !site || !sitePhoto || !siteInfo || !left || !widget || !drop || !drag || !panel || !file || !arc) return;

  const reset = ()=>{
    process.style.opacity = '1';
    process.style.transform = 'none';
    delete process.dataset.state;
    Object.assign(site.style,{
      opacity:'0',
      transform:'translateY(24px) scale(.985)',
      clipPath:'inset(0 0 93% 0 round 16px)'
    });
    Object.assign(sitePhoto.style,{opacity:'0',transform:'translateY(12px)'});
    Object.assign(siteInfo.style,{opacity:'0',transform:'translateY(12px)'});
    drop.classList.remove('hot');
    dropText.textContent = 'Drop files here';
    Object.assign(drag.style, {opacity:'0',transform:'none'});
    Object.assign(dragCard.style, {opacity:'1',transform:'scale(1)'});
    cursor.style.opacity = '1';
    Object.assign(widget.style, {opacity:'1',transform:'none',filter:'none'});
    Object.assign(panel.style, {opacity:'0',transform:'scale(.96)'});
    file.dataset.state = 'uploading';
    arc.style.strokeDashoffset = DI_RING_LEN;
    wash.style.clipPath = 'inset(0 0 100% 0)';
    placeholder.style.opacity = '1';
    image.style.opacity = '0';
    deleteButton.style.opacity = '0';
    dots.forEach(d=>d.dataset.state = 'standby');
    donut.forEach(c=>c.classList.remove('lit'));
    lines.forEach(p=>p.style.opacity = '0');
  };
  reset();

  const settle = ()=>{
    Object.assign(drag.style,{opacity:'0'});
    Object.assign(widget.style,{opacity:'0',transform:'scale(.94)',filter:'blur(2px)'});
    Object.assign(panel.style,{opacity:'1',transform:'none'});
    arc.style.strokeDashoffset = 0;
    file.dataset.state = 'done';
    wash.style.clipPath = 'inset(0 0 0% 0)';
    placeholder.style.opacity = '0';
    image.style.opacity = '1';
    deleteButton.style.opacity = '1';
    dots.forEach(d=>d.dataset.state = 'standby');
    donut.forEach(c=>c.classList.add('lit'));
    lines.forEach(p=>p.style.opacity = '1');
    process.dataset.state = 'ready-for-site';
  };

  const settleSite = ()=>{
    Object.assign(process.style,{opacity:'0',transform:'translateY(-18px) scale(.985)'});
    Object.assign(site.style,{
      opacity:'1',
      transform:'none',
      clipPath:'inset(0 0 0 0 round 16px)'
    });
    Object.assign(sitePhoto.style,{opacity:'1',transform:'none'});
    Object.assign(siteInfo.style,{opacity:'1',transform:'none'});
    process.dataset.state = 'site-live';
  };

  if (REDUCED){ settle(); settleSite(); return; }

  // The file is a drag, so it keeps the Webflow card's spring. The parent owns
  // travel; its child owns the drop scale, preventing transform contention.
  // Portrait and square restack the cells, so the landing is measured: the
  // card comes to rest centred over the drop zone, 33px below its top edge,
  // which is where the landscape constants put it.
  const shaped = stage.dataset.format==='portrait' || stage.dataset.format==='square';
  const FROM = {x:0,y:0}, OVER = shaped ? {
    x:Math.round(widget.offsetLeft + drop.offsetLeft + (drop.offsetWidth - drag.offsetWidth)/2 - drag.offsetLeft),
    y:Math.round(widget.offsetTop + drop.offsetTop + 33 - drag.offsetTop)
  } : {x:235,y:81};
  const FLY = {at:.50,response:.86,bounce:.12};
  tl.to(drag,[{opacity:0},{opacity:1}],{at:.30,dur:.26});
  let landed = 1.55;
  tl.spring(drag,FROM,OVER,{...FLY,onArrive:t=>landed=t});

  // Light the drop zone on the exact spring frame where the pointer enters.
  const tip = {x:drag.offsetLeft+cursor.offsetLeft,y:drag.offsetTop+cursor.offsetTop};
  const zx = widget.offsetLeft+drop.offsetLeft, zy = widget.offsetTop+drop.offsetTop;
  const cross = springCrossing(FROM,OVER,FLY,o=>{
    const x=tip.x+(o.x||0), y=tip.y+(o.y||0);
    return x>=zx && x<=zx+drop.offsetWidth && y>=zy && y<=zy+drop.offsetHeight;
  });
  tl.cls(drop,'hot',cross!=null ? FLY.at+cross : Math.max(0,landed-.25));

  const DROP = landed + .16;
  tl.to(dragCard,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.28)'}],
        {at:DROP,dur:.52,ease:EASE.inOut,fill:'forwards'});
  tl.to(cursor,[{opacity:1},{opacity:0}],{at:DROP+.06,dur:.24,fill:'forwards'});
  tl.at(DROP+.24,()=>{ dropText.textContent='1 file added'; });
  tl.cls(drop,'hot',DROP+.40,false);

  /* The full widget hands over to the exact compact upload panel from the
     Webflow card; the one ring is the complete upload process.

     The swap is asymmetric and blur-masked, following the install card's label
     morph rather than a straight crossfade. These two elements are wildly
     different sizes in the same place, so fading them through each other shows
     a legible 400px uploader sitting on top of a 52px row — you read both at
     once and neither becomes the other. The widget now leaves first and
     collapses slightly as it goes (scale .94, not the old .97, so it reads as
     receding rather than dimming), the row arrives 160ms later, and 2px of
     blur covers what overlap is left. "1 file added" also holds for ~.6s
     before any of this starts, because that confirmation is a beat.

     The 120ms offset is measured, not chosen: the widget's opacity is under
     .05 by then, so the row rises into a space that still has the widget in
     it rather than into an empty cell. Pushing it later reads as the uploader
     blinking out before its replacement arrives — the same failure the
     inherited dropin card documents, just 80ms of it. */
  const SWAP = DROP + .85;
  tl.to(widget,[{opacity:1,transform:'scale(1)',filter:'blur(0)'},
                {opacity:0,transform:'scale(.94)',filter:'blur(2px)'}],
        {at:SWAP,dur:.22,fill:'forwards'});
  tl.to(panel,[{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'scale(1)'}],
        {at:SWAP+.12,dur:.30,ease:EASE.out});

  /* The upload is the one beat that has to read as work rather than as a state
     change, so the ring fills over 1.45s. At the old .55s it was over before a
     passer-by had found it, which made the card look like it skipped the
     upload entirely. Linear, because it is constant-rate progress. */
  const UPLOAD = SWAP + .46;
  tl.to(arc,[{strokeDashoffset:DI_RING_LEN},{strokeDashoffset:0}],
        {at:UPLOAD,dur:1.45,ease:'linear'});
  const ANALYSE = UPLOAD + 1.85;
  tl.at(ANALYSE,()=>{ file.dataset.state='done'; dots[0].dataset.state='working'; });

  /* The right cell receives the same photo, then resolves only the two lines
     present in frame 234:979. No extra safety or delivery claims are added.

     The placeholder leaves before the photo arrives rather than with it: run
     together, "Upload image" stays legible over the incoming product shot for
     ~160ms and the cell reads as two things at once. */
  tl.to(placeholder,[{opacity:1},{opacity:0}],{at:ANALYSE,dur:.18,fill:'forwards'});
  tl.to(image,[{opacity:0},{opacity:1}],{at:ANALYSE+.14,dur:.40});
  tl.to(wash,[{clipPath:'inset(0 0 100% 0)'},{clipPath:'inset(0 0 0% 0)'}],
        {at:ANALYSE+.14,dur:.85,ease:EASE.out});
  tl.to(lines[0],[{opacity:0},{opacity:1}],{at:ANALYSE+.45,dur:.26});
  donut.forEach((c,i)=>tl.cls(c,'lit',ANALYSE+.20+i*.014));
  // the optimized size is the card's whole claim, so it lands on its own beat
  // well after the file's own telemetry rather than 350ms behind it
  tl.to(deleteButton,[{opacity:0},{opacity:.92}],{at:ANALYSE+1.00,dur:.24});
  tl.to(lines[1],[{opacity:0},{opacity:1}],{at:ANALYSE+1.15,dur:.26});
  tl.at(ANALYSE+1.55,()=>{ dots[0].dataset.state='standby'; });

  // Pin the completed frame inline so killing the score for the outgoing slide
  // crossfade cannot restore any of the hidden opening styles.
  tl.at(ANALYSE+1.62,settle);

  /* The processing shell and browser overlap briefly: the former recedes while
     the latter opens down from its chrome. Photo and details arrive only once
     the page has enough height to hold them, so nothing flashes through the
     clip. All motion is transform/opacity apart from the sanctioned clip-path.

     The hold before this is deliberate: the optimized readout stays finished
     and still for ~1.3s, so the claim can actually be read before the payoff
     replaces it. */
  const SITE = ANALYSE + 2.45;
  tl.to(process,
    [{opacity:1,transform:'translateY(0) scale(1)'},{opacity:0,transform:'translateY(-18px) scale(.985)'}],
    {at:SITE,dur:.38,ease:EASE.out,fill:'forwards'});
  tl.to(site,[
    {opacity:0,transform:'translateY(24px) scale(.985)',clipPath:'inset(0 0 93% 0 round 16px)'},
    {opacity:1,transform:'translateY(0) scale(1)',clipPath:'inset(0 0 0 0 round 16px)'}
  ],{at:SITE+.10,dur:.58,ease:EASE.out});
  tl.to(sitePhoto,
    [{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],
    {at:SITE+.31,dur:.36,ease:EASE.out});
  tl.to(siteInfo,
    [{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],
    {at:SITE+.38,dur:.40,ease:EASE.out});
  tl.at(SITE+.80,settleSite);
}

/* ------------ Expo card 4: catalog backend -> Edit with AI -> result ----------
   This is a recording of the real ai-catalog-admin flow, rebuilt offline as
   live DOM. The source, preset prompt and generated result are the production
   demo's own; the dot-grid veil reproduces its pending state and masks small
   generative differences while the result arrives. */
function setupCommerceEditor(slideEl, sd, tl){
  const q = slideEl.querySelector.bind(slideEl);
  const backend = q('.ce-backend');
  const shot = q('.ce-shot');
  const pill = q('.ce-edit');
  const cursor = q('.ce-admin-cursor');
  const clickRing = q('.ce-click-ring');
  const editor = q('.ce-editor');
  const prompt = q('.ce-prompt span');
  const promptCursor = q('.ce-prompt-cursor');
  const generate = q('.ce-generate');
  const done = q('.ce-done');
  const doneRing = q('.ce-done-ring');
  const after = q('.ce-after');
  const veil = q('.ce-veil');
  const shimmer = q('.ce-shimmer');
  const site = q('.ce-site');
  const sitePhoto = q('.ce-site .ef-site-photo');
  const siteInfo = q('.ce-site .ef-site-info');
  if (!backend || !shot || !pill || !cursor || !clickRing || !editor ||
      !prompt || !done || !doneRing || !after || !veil ||
      !shimmer || !site) return;

  const SITE_SHUT = 'inset(0 0 93% 0 round 16px)';
  const SITE_OPEN = 'inset(0 0 0 0 round 16px)';

  /* The pointer path, in tip coordinates inside the backend. One move, from
     the empty page margin to Edit with AI: the pointer is going somewhere and
     it goes there, rather than stopping on the image and setting off again.

     A hand does not travel in a straight line to get there. It throws the
     pointer out on a shallow arc, peaks early and decelerates for most of the
     trip, lands a few pixels past the target and pulls back. The arc is bowed
     so the tip enters the image slot with ~30% of the trip left: that crossing
     is what surfaces the button, so the pill appears under a pointer already
     travelling towards it. The waypoints carry the shape, so the effect runs
     `linear` and every offset below is a real fraction of elapsed time. */
  const REST = {x:165, y:352};                  // the pointer's seat on the pill
  const tr = p=>`translate(${(p.x-REST.x).toFixed(1)}px,${(p.y-REST.y).toFixed(1)}px)`;
  const APPROACH = [
    {at:0,   x:1010, y:520},
    {at:.09, x:925,  y:504},
    {at:.19, x:800,  y:478},
    {at:.30, x:660,  y:443},
    {at:.42, x:530,  y:405},
    {at:.54, x:415,  y:371},
    {at:.66, x:320,  y:346},                    // just outside the slot's edge
    {at:.77, x:250,  y:340},                    // inside it; the pill is cued
    {at:.87, x:196,  y:344},
    {at:.95, x:160,  y:350},                    // overshoot, 5px past
    {at:1,   x:165,  y:352}                     // and the correction back
  ];

  /* Where the one pointer works, in the same tip coordinates. The editor's
     seats are measured from the rebuilt UI: FIELD is inside the prompt box on
     the short second line's empty right side, so the pointer is parked in the
     field it is typing into without covering a single character of it. */
  const FIELD = {x:860, y:515};                 // parked in the prompt box
  const GEN   = {x:970, y:560};                 // on the composer's send button
  const DONE  = {x:1174, y:612};                // on Add to media

  /* Portrait and square relay the backend and the editor (see their CSS), so
     the editor seats are measured off the rebuilt UI, at the same fractions of
     each control the numbers above sit at; the done ring follows its seat. The
     throw keeps its shape, compressed by half towards the pill so it starts
     over the page instead of past the edge of a 595px window. The pill seat
     (REST) and its ring stay put: the Media card is laid out identically. */
  if (stage.dataset.format==='portrait' || stage.dataset.format==='square'){
    const root = backend.parentElement;
    const seat = (el, fx, fy)=>{
      let x = 0, y = 0, n = el;
      while (n && n !== root){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
      return {x:Math.round(x + el.offsetWidth*fx), y:Math.round(y + el.offsetHeight*fy)};
    };
    APPROACH.forEach(p=>{ p.x = Math.round(REST.x + (p.x-REST.x)*.5); });
    const box = seat(q('.ce-composer'), 1, 0);
    Object.assign(FIELD, {x:box.x - 140, y:box.y + 49});
    Object.assign(GEN, seat(generate, .27, .3));
    Object.assign(DONE, seat(done, .4, .38));
    doneRing.style.left = `${DONE.x-18}px`;
    doneRing.style.top = `${DONE.y-18}px`;
  }

  /* A short reach between two seats. Same contract as the long throw: the
     shape is in the waypoints so the effect runs `linear`, the velocity peaks
     at ~20% and decays, and it carries 3% past the mark before correcting —
     a hand's ballistic move and its own correction, at whatever length the
     two seats happen to be apart. `bow` offsets the midpoint perpendicular to
     the travel, which is what keeps it from reading as a ruler line. */
  const reach = (from, to, bow=0)=>{
    const dx = to.x-from.x, dy = to.y-from.y;
    const len = Math.hypot(dx,dy) || 1;
    const nx = -dy/len, ny = dx/len;
    const at = [0,.10,.26,.46,.68,.87,1];
    const f  = [0,.16,.44,.72,.92,1.03,1];
    const b  = [0,.50,.95,.90,.50,.12,0];
    return at.map((t,i)=>({
      offset:t, opacity:1,
      transform:tr({x:from.x+dx*f[i]+nx*bow*b[i], y:from.y+dy*f[i]+ny*bow*b[i]})
    }));
  };

  const reset = ()=>{
    Object.assign(backend.style,{opacity:'1',transform:'none'});
    shot.classList.remove('hot');
    Object.assign(cursor.style,{opacity:'0',transform:tr(APPROACH[0])});
    Object.assign(clickRing.style,{opacity:'0',transform:'scale(.9)'});
    pill.style.transform = '';
    Object.assign(editor.style,{opacity:'0',transform:'translateY(16px) scale(.985)'});
    prompt.textContent = '';
    promptCursor.classList.remove('on');
    Object.assign(generate.style,{opacity:'.35',transform:'none'});
    Object.assign(done.style,{background:'#8f8f8f',transform:'none'});
    Object.assign(doneRing.style,{opacity:'0',transform:'scale(.9)'});
    after.style.opacity = '0';
    veil.style.opacity = '0';
    Object.assign(shimmer.style,{opacity:'0',transform:'translateX(0)'});
    Object.assign(site.style,{opacity:'0',clipPath:SITE_SHUT,
      transform:'translateY(24px) scale(.985)'});
    [sitePhoto,siteInfo].forEach(el=>el && Object.assign(el.style,
      {opacity:'0',transform:'translateY(12px)'}));
  };
  reset();

  /* The finished editor frame, pinned inline. `seat` is where the pointer is
     standing at that moment: the score passes the send button, because it is
     still visible and still there, while reduced motion passes nothing and the
     pointer stays out of a card that has no interaction to show. */
  const settle = (seat)=>{
    backend.style.opacity = '0';
    shot.classList.add('hot');
    Object.assign(cursor.style, seat
      ? {opacity:'1',transform:tr(seat)}
      : {opacity:'0'});
    clickRing.style.opacity = '0';
    Object.assign(editor.style,{opacity:'1',transform:'none'});
    prompt.textContent = CE_PROMPT;
    promptCursor.classList.remove('on');
    Object.assign(generate.style,{opacity:'.35',transform:'none'});
    Object.assign(done.style,{background:'#181818',transform:'none'});
    doneRing.style.opacity = '0';
    after.style.opacity = '1';
    veil.style.opacity = '0';
    Object.assign(shimmer.style,{opacity:'0',transform:'translateX(660px)'});
  };

  // Same reason card 1 pins its storefront inline: leaving a card kills its
  // timeline, and a cancelled WAAPI animation reverts to inline style — which
  // reset() left hidden. The kill happens at the top of the outgoing crossfade,
  // so without this the payoff blinks out while the card is still on screen.
  const settleSite = (seat)=>{
    Object.assign(editor.style,{opacity:'0',transform:'translateY(-18px) scale(.985)'});
    Object.assign(site.style,{opacity:'1',clipPath:SITE_OPEN,transform:'none'});
    [sitePhoto,siteInfo].forEach(el=>el && Object.assign(el.style,
      {opacity:'1',transform:'none'}));
    // the pointer is left where it last pressed, not faded off: the storefront
    // page opens over it, which is occlusion rather than a disappearance
    if (seat) Object.assign(cursor.style,{opacity:'1',transform:tr(seat)});
  };

  if (REDUCED){ settle(); settleSite(); return; }

  // The card stays on the product backend: no zoom, no cut. The pointer does
  // the explaining, so the page it is working in never leaves the screen.
  //
  // The throw is one continuous move, not segments joined at the slot's edge.
  // The hover is still timed off the real crossing rather than an offset
  // guessed back from the end — same contract springCrossing() gives the drop
  // cards — but here the path is authored, so the crossing is found by walking
  // it: the effect runs linear, so a waypoint's offset is its time.
  /* The backend holds alone for .75s before the pointer arrives — the page has
     to be readable before anything happens in it — and the throw takes 1.25s
     for its ~880px. Both are longer than the two-stage version they replace,
     which is what keeps the click at the same 2.38s and leaves every beat
     after it untouched. */
  const MOVE = .75, THROW = 1.25;
  // opacity goes on every waypoint, not just the two that change it: a
  // property missing from the last keyframe gets an implicit one synthesised
  // from the underlying value, and here that is opacity:0 — the pointer faded
  // back out across the whole travel while its position stayed correct.
  const throwKf = APPROACH.map((p,i)=>({transform:tr(p),offset:p.at,opacity:i?1:0}));
  tl.to(cursor,throwKf,{at:MOVE,dur:THROW,ease:'linear',fill:'forwards'});
  tl.cls(shot,'hot',MOVE + pathCrossing(APPROACH,THROW,inside(shot,backend)));

  /* The pointer holds still through the click, because that is what a pointer
     does — the button is what responds to being pressed. A cursor that shrinks
     14% is animating the hand, not the interface. The gap before the press is
     the hesitation between arriving somewhere and committing to it. */
  const CLICK = MOVE + THROW + .38;
  tl.to(pill,[
    {transform:'scale(1)',offset:0},
    {transform:'scale(.97)',offset:.35},
    {transform:'scale(.97)',offset:.55},
    {transform:'scale(1)',offset:1}
  ],{at:CLICK,dur:.18,ease:EASE.out,fill:'forwards'});
  tl.to(clickRing,[
    {opacity:.5,transform:'scale(.9)'},
    {opacity:0,transform:'scale(1.25)'}
  ],{at:CLICK+.02,dur:.22,ease:EASE.out,fill:'forwards'});

  /* And then it carries on working. The pointer does not fade out with the
     backend and fade back in for the editor: it crosses the handover in the
     open, which is the whole reason it lives on .ce-stage. Every move after
     this one opens on the seat the previous one left, so they must be created
     in score order — a later animation wins the cascade — and every one of
     them is fill:'forwards', or its first keyframe would pin the pointer to a
     seat it has not reached yet from t=0.

     It leaves for the prompt box as the modal opens, which is what a hand does
     while a dialog animates in, and is parked there before the first character
     lands at 3.30s. */
  const FIELD_MOVE = CLICK + .22;
  tl.to(cursor,reach(APPROACH[APPROACH.length-1],FIELD,-30),
    {at:FIELD_MOVE,dur:.72,ease:'linear',fill:'forwards'});

  // The modal arrives as one object, matching the demo rather than assembling
  // its production controls as separate decorative elements.
  const EDITOR = CLICK + .42;
  tl.to(backend,[{opacity:1,transform:'scale(1)'},
                 {opacity:0,transform:'scale(.985)'}],
    {at:EDITOR,dur:.30,ease:EASE.out,fill:'forwards'});
  tl.to(editor,[{opacity:0,transform:'translateY(16px) scale(.985)'},
                {opacity:1,transform:'translateY(0) scale(1)'}],
    {at:EDITOR+.08,dur:.48,ease:EASE.out});

  // tl.timeout keeps recursive typing owned by this slide's Timeline, so it
  // stops instantly when the deck advances and restarts empty on the next loop.
  const TYPE = EDITOR + .52;
  tl.at(TYPE,()=>{
    promptCursor.classList.add('on');
    let i=0;
    const tick = ()=>{
      prompt.textContent = CE_PROMPT.slice(0,++i);
      if(i < CE_PROMPT.length) tl.timeout(18,tick);
    };
    tick();
  });

  const GENERATE = TYPE + CE_PROMPT.length*.018 + .28;
  tl.at(GENERATE,()=>promptCursor.classList.remove('on'));
  // The hand goes for send as the last words are typed, not after a pause: the
  // move starts ~180ms before the prompt is finished and lands just before the
  // press, so the button is pressed by something that is already on it.
  tl.to(cursor,reach(FIELD,GEN,-14),
    {at:GENERATE-.46,dur:.42,ease:'linear',fill:'forwards'});
  // A send button, pressed. .97 for 150ms is what a real one does; the weight
  // of the action is carried by the two seconds of processing that follow it.
  tl.to(generate,[
    {opacity:.35,transform:'scale(1)',offset:0},
    {opacity:1,transform:'scale(.97)',offset:.4},
    {opacity:1,transform:'scale(1)',offset:1}
  ],{at:GENERATE,dur:.15,ease:EASE.out});

  // Dense dots first, then the real result underneath them, then the veil
  // clears. The crossfade is intentionally hidden at peak coverage: the AI
  // output preserves the crop but naturally changes small product highlights.
  tl.to(veil,[
    {opacity:0,offset:0},
    {opacity:.92,offset:.16},
    {opacity:.92,offset:.72},
    {opacity:0,offset:1}
  ],{at:GENERATE+.16,dur:1.75,ease:EASE.inOut});
  tl.to(shimmer,[
    {opacity:0,transform:'translateX(0)'},
    {opacity:1,transform:'translateX(120px)'},
    {opacity:.9,transform:'translateX(510px)'},
    {opacity:0,transform:'translateX(660px)'}
  ],{at:GENERATE+.16,dur:1.75,ease:EASE.inOut});
  tl.to(after,[{opacity:0},{opacity:1}],
    {at:GENERATE+.72,dur:.62,ease:EASE.inOut});
  tl.to(done,[{background:'#8f8f8f'},{background:'#181818'}],
    {at:GENERATE+1.45,dur:.24,ease:EASE.out});

  // Pin the finished editor frame: killing WAAPI during the outgoing slide
  // crossfade must not blink back to the source image.
  tl.at(GENERATE+1.95,()=>settle(GEN));

  /* Complete the visible interaction instead of jumping from a finished edit
     to the storefront. The result keeps its original ~1.05s still hold first;
     only then does the pointer leave the send button for Add to media and
     press it. This beat is what the slide's thirteenth second pays for; it
     takes nothing from typing, generation, or the finished result's hold. */
  const MEDIA_MOVE = GENERATE + 2.60;
  tl.to(cursor,reach(GEN,DONE,-16),
    {at:MEDIA_MOVE,dur:.72,ease:'linear',fill:'forwards'});
  const MEDIA_CLICK = MEDIA_MOVE + .85;
  tl.to(done,[
    {transform:'scale(1)',offset:0},
    {transform:'scale(.97)',offset:.35},
    {transform:'scale(.97)',offset:.55},
    {transform:'scale(1)',offset:1}
  ],{at:MEDIA_CLICK,dur:.18,ease:EASE.out,fill:'forwards'});
  tl.to(doneRing,[
    {opacity:.5,transform:'scale(.9)'},
    {opacity:0,transform:'scale(1.25)'}
  ],{at:MEDIA_CLICK+.02,dur:.22,ease:EASE.out,fill:'forwards'});

  /* The variant goes live. This is card 1's payoff played in this card's
     vocabulary — the working surface lifts and recedes while the storefront
     opens down from its 56px chrome — and it is the point of the whole card:
     the generated image is not a preview, it is already the product page.

     The result holds finished and still for ~1.05s before the pointer arrives.
     That hold is what the slide's earlier extra two seconds bought; do not
     reclaim it by starting the pointer or handover earlier. */
  const SITE = MEDIA_CLICK + .35;
  tl.to(editor,
    [{opacity:1,transform:'translateY(0) scale(1)'},
     {opacity:0,transform:'translateY(-18px) scale(.985)'}],
    {at:SITE,dur:.38,ease:EASE.out,fill:'forwards'});
  tl.to(site,[
    {opacity:0,transform:'translateY(24px) scale(.985)',clipPath:SITE_SHUT},
    {opacity:1,transform:'translateY(0) scale(1)',clipPath:SITE_OPEN}
  ],{at:SITE+.10,dur:.58,ease:EASE.out});
  tl.to(sitePhoto,
    [{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],
    {at:SITE+.31,dur:.36,ease:EASE.out});
  tl.to(siteInfo,
    [{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],
    {at:SITE+.38,dur:.40,ease:EASE.out});
  tl.at(SITE+.80,()=>settleSite(DONE));
}

function setupDropin(slideEl, sd, tl){
  const drop   = slideEl.querySelector('.di-drop');
  const txt    = slideEl.querySelector('.di-droptxt');
  const widget = slideEl.querySelector('.di-widget');
  const group  = slideEl.querySelector('.di-group');
  const cards  = [...slideEl.querySelectorAll('.di-card')];
  const cur    = slideEl.querySelector('.di-cur');
  const panel  = slideEl.querySelector('.di-panel');
  const files  = [...slideEl.querySelectorAll('.di-file')];
  if (!drop || !group || !panel) return;

  const arcs = files.map(f=>f.querySelector('.di-ring .arc'));
  const reset = ()=>{
    drop.classList.remove('hot');
    txt.textContent = 'Drop files here';
    group.style.opacity = '0';
    group.style.transform = 'none';
    cards.forEach(c=>{ c.style.opacity=''; c.style.transform=''; });
    if (cur) cur.style.opacity = '';
    panel.style.opacity = '0';
    panel.style.transform = 'none';
    widget.style.opacity = ''; widget.style.transform = '';
    files.forEach(f=>f.dataset.state = 'wait');
    arcs.forEach(a=>a.style.strokeDashoffset = DI_RING_LEN);
  };
  reset();

  if (REDUCED){
    // the informative frame is the end of the story: both files uploaded
    widget.style.opacity = '0';
    panel.style.opacity = '1';
    files.forEach(f=>f.dataset.state = 'done');
    arcs.forEach(a=>a.style.strokeDashoffset = 0);
    return;
  }

  // ---- the drag: in from off-frame upper right, settling over the zone.
  // spring() reports its settle time synchronously, so the rest of the score
  // can be written against when the stack actually lands.
  const FROM = {x:430, y:-150}, OVER = {x:0, y:0};
  const FLY = {at:1.3, response:.7, bounce:.06};
  group.style.transform = `translate(${FROM.x}px,${FROM.y}px)`;
  tl.to(group, [{opacity:0},{opacity:1}], {dur:.3, at:1.25});
  let landed = 2.2;
  tl.spring(group, FROM, OVER, {...FLY, onArrive:t=>landed=t});

  // ---- the zone lights the frame the pointer tip enters it, not on a lead-in
  // measured back from the landing. Everything here is offsetLeft/offsetTop —
  // layout px, like the spring's own offsets — so the comparison holds however
  // the stage is scaled to the display.
  const tip = cur && {x:group.offsetLeft + cur.offsetLeft, y:group.offsetTop + cur.offsetTop};
  const zx = widget.offsetLeft + drop.offsetLeft, zy = widget.offsetTop + drop.offsetTop;
  const cross = tip && springCrossing(FROM, OVER, FLY, o=>{
    const x = tip.x + (o.x||0), y = tip.y + (o.y||0);
    return x >= zx && x <= zx + drop.offsetWidth
        && y >= zy && y <= zy + drop.offsetHeight;
  });
  tl.cls(drop, 'hot', cross != null ? FLY.at + cross : Math.max(0, landed - .35));

  // ---- the drop: each card falls to the middle of the zone and shrinks away
  const DROP = landed + .18;
  const AIM = [{x:-132, y:85}, {x:-108, y:59}];   // card centre -> zone centre
  cards.forEach((c,i)=>{
    const base = i===0 ? 'translate(24px,-26px) ' : '';
    tl.to(c, [{opacity:1, transform:`${base}translate(0px,0px) scale(1)`},
              {opacity:0, transform:`${base}translate(${AIM[i].x}px,${AIM[i].y}px) scale(.28)`}],
          {at:DROP + i*.09, dur:.5, ease:EASE.inOut, fill:'forwards'});
  });
  // the pointer lets go the moment the files leave it, rather than hanging
  // around beside an empty space while they travel
  if (cur) tl.to(cur, [{opacity:1},{opacity:0}], {at:DROP + .06, dur:.22, fill:'forwards'});
  tl.at(DROP + .44, ()=>{ txt.textContent = '2 files added'; });
  tl.cls(drop, 'hot', DROP + .5, false);

  // ---- hand over to the uploading panel, but not before "2 files added" has
  // been readable for a beat — otherwise the confirmation just flashes
  const SWAP = DROP + .95;
  tl.to(widget, [{opacity:1, transform:'scale(1)'},
                 {opacity:0, transform:'scale(.97)'}],
        {at:SWAP, dur:.26, fill:'forwards'});
  tl.to(panel,  [{opacity:0, transform:'scale(.97)'},
                 {opacity:1, transform:'scale(1)'}], {at:SWAP + .08, dur:.32});
  // Write the arrived state to inline style as well as leaving it to the
  // tween's fill. Leaving the card kills its timeline, and a cancelled WAAPI
  // animation drops straight back to inline style — which reset() left at
  // opacity 0. Without this the panel blinks out at the top of the crossfade
  // and the card spends its last 400ms empty, which is the one frame this
  // card exists to show. Cheap belt and braces; the tween still owns the
  // transition itself.
  tl.at(SWAP + .4, ()=>{ panel.style.opacity = '1'; panel.style.transform = 'none'; });

  // ---- one file at a time: the ring fills, then it settles to done
  const FILL = .8, GAP = .3;
  let t = SWAP + .5;
  files.forEach((f,i)=>{
    tl.to(arcs[i], [{strokeDashoffset:DI_RING_LEN},{strokeDashoffset:0}],
          {at:t, dur:FILL, ease:EASE.inOut});
    t += FILL;
    tl.at(t, ()=>{ f.dataset.state = 'done'; });
    t += GAP;
  });

  // ---- and then it just sits there, finished, until the deck moves on.
  // The window used to dismiss itself, which meant the payoff — two files
  // uploaded, both ticked — was the one thing you did not get to look at, and
  // it left the card empty for the rest of its slot. The card's duration is
  // set to hold this frame for a beat and then cut; see DEFAULT_DECK.
}

/* ---------------- card 6: upload -> optimize -> deliver ----------------
   The file itself carries the story across the frame's rail. At Optimize its
   displayed weight counts down but the 120x150 card does not resize. The crop
   waits until the file has stopped at Deliver, so the reframing is its own
   readable beat instead of being swallowed by travel. Once delivered, the
   file leaves, the 989px rail contracts and warms to yellow like frame
   219:1578, then hands over to frame 219:1612's 339x61 lockup. */
function setupCommerceInfrastructure(slideEl, sd, tl){
  const file  = slideEl.querySelector('.ei-file');
  const photo = slideEl.querySelector('.ei-photo');
  const size  = slideEl.querySelector('.ei-size');
  const rail  = slideEl.querySelector('.ei-rail');
  const lockup = slideEl.querySelector('.ei-lockup');
  const steps = [...slideEl.querySelectorAll('.ei-step')];
  const expanded = [...slideEl.querySelectorAll('.ei-expanded')];
  const collapsed = [...slideEl.querySelectorAll('.ei-collapsed')];
  if (!file || !photo || !size || !rail || !lockup || steps.length < 3) return;
  // portrait and square stand the rail on end; same score, other axis
  if (stage.dataset.format==='portrait' || stage.dataset.format==='square')
    return setupCommerceInfrastructureStacked(slideEl, tl);

  // Measure from layout coordinates only. The stage is CSS-scaled to the
  // viewport; getBoundingClientRect() would return screen pixels and make the
  // travel too short on a laptop.
  const fileCentre = file.offsetLeft + file.offsetWidth/2;
  const centreOf = step => rail.offsetLeft + step.offsetLeft + step.offsetWidth/2;
  const atStep = step => Math.round((centreOf(step) - fileCentre)*100)/100;
  const OPT = atStep(steps[1]);
  const DELIVER = atStep(steps[2]);
  const COMPACT_W = steps.reduce((n,s)=>n+s.offsetWidth,0) + 2*66.281;
  const COMPACT_X = (1920-COMPACT_W)/2;

  /* Where each piece has to be once the rail is compact, as a translation.
     The contraction used to animate the rail's own left and width — a layout
     pass on every frame of a 750ms move, for a result that is pure
     displacement. The rail's box now never changes: the outer steps slide
     inward to exactly where that layout put them and each compact connector
     slides to the middle of the gap they leave, so frame 219:1578 is hit on
     the pixel with nothing off the compositor. Layout coordinates, for the
     reason the travel above uses them. */
  const compactDx = (()=>{
    let run = COMPACT_X - rail.offsetLeft;
    return steps.map(s=>{
      const d = run - s.offsetLeft;
      run += s.offsetWidth + 66.281;
      return d;
    });
  })();
  const linkDx = collapsed.map((c,i)=>{
    const box = c.parentElement;
    const mid = (steps[i].offsetLeft + compactDx[i] + steps[i].offsetWidth
               + steps[i+1].offsetLeft + compactDx[i+1]) / 2;
    return mid - (box.offsetLeft + box.offsetWidth/2);
  });

  // Reset synchronously: on a second loop the DOM still holds the previous
  // visit's logo and collapsed rail until this score is built.
  file.style.opacity = '0';
  file.style.transform = 'translate(0px,10px)';
  photo.style.transform = 'none';
  size.textContent = '680KB';
  size.dataset.working = 'false';
  rail.style.opacity = '1';
  rail.dataset.phase = 'travel';
  steps.forEach(s=>s.style.transform='none');
  expanded.forEach(e=>Object.assign(e.style,{opacity:'1',clipPath:'inset(0 0 0 0)'}));
  collapsed.forEach(e=>Object.assign(e.style,{opacity:'0',transform:''}));
  lockup.style.opacity = '0';
  lockup.style.transform = 'scale(.94)';
  steps.forEach(s=>s.dataset.state='idle');

  const countTo = (from, to, ms) => {
    if (REDUCED){
      size.textContent = `${to}KB`;
      size.dataset.working = 'false';
      return;
    }
    const started = performance.now();
    size.dataset.working = 'true';
    const tick = ()=>{
      const p = Math.min(1, (performance.now()-started)/ms);
      const eased = 1-Math.pow(1-p,3);
      size.textContent = `${Math.round(from+(to-from)*eased)}KB`;
      if (p < 1) tl.timeout(16, tick);
      else size.dataset.working = 'false';
    };
    tick();
  };

  /* The chips have mass. The contraction used to be a .75s ease-in-out, which
     arrives at the frame perfectly and feels like a diagram redrawing itself;
     three objects being pulled together overshoot their stop and settle into
     it. This spring peaks at 300ms, carries ~3.5% past the mark — 9px on the
     outer chips' 256px, which briefly closes their 66px gap to 57 — and is
     done in 640ms, so the move is quicker than the ease it replaces and the
     time goes into the settle. Its duration is the spring's own settle time
     rather than a
     number chosen to match it, so retuning the feel cannot silently leave the
     logo handover landing on a rail that is still moving.

     One curve drives everything: the trajectory is sampled once for the
     longest displacement and normalised, then each chip, each compact
     connector and each fading line's clip is scaled off it. A linear spring
     is linear in its target, so this is exact — and it is what guarantees the
     connectors stay centred between the chips on every frame, including
     through the overshoot. */
  const RAIL_SPRING = {response:.45, bounce:.30};
  const dxMax = Math.max(...compactDx.map(Math.abs));
  const drive = springKeyframes({x:0},{x:dxMax}, RAIL_SPRING);
  const curve = drive.frames.map(([x])=>x/dxMax);
  const railTween = (el, at, value)=>{
    if (!el) return;
    if (REDUCED){ tl.at(at, ()=>Object.assign(el.style, value(1))); return; }
    const kf = curve.map(u=>value(u));
