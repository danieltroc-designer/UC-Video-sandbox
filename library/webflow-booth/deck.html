<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uploadcare — Webflow booth loop</title>
<style>
@font-face{font-family:'Commit Mono';font-style:normal;font-weight:400;font-display:swap;src:url(media/e01edfa2cffe089a.woff2) format('woff2');}
@font-face{font-family:'Commit Mono';font-style:normal;font-weight:500;font-display:swap;src:url(media/c53879ee2c26e5b1.woff2) format('woff2');}

@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(media/1dc044f4824fd5af.woff2) format('woff2');}

@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url(media/3ae621518210e658.woff2) format('woff2');}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(media/35c2a72b759f5a19.woff2) format('woff2');}


  :root{
    --bg:#090909;
    --ink:#F2F2F0;
    --ink-dim:#B9B9C6;      /* lavender-tinted secondary, like the keynote slides */
    --ink-faint:#57575E;
    --brand:#FFCF3E;
    --ok:#3DDC84;
    --panel:#111113;
    --panel-2:#18181B;
    --line:#232328;
    /* mono defaults to Commit Mono to match the onboarding-prototype reference */
    --mono:'Commit Mono', 'JetBrains Mono', ui-monospace, monospace;
    --cmono:'Commit Mono', 'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;

    /* ---- "floating panel" material (from the onboarding prototype) ----
       #181818 surface, generous radius, and a faint inset light ring over a
       soft drop shadow — this is what makes a surface read as a real material
       rather than a flat rectangle. Reuse via the .panel class. */
    --panel-fg:#181818;
    --panel-radius:28px;
    --dash:rgba(255,255,255,.13);              /* dashed dropzone / frame edge   */
    --shadow-floating:inset 0 0 0 1px rgba(212,226,255,.05), 0 1px 4px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.45);
    /* CDN-URL syntax highlight (exact colors from the reference) */
    --url-base:#DDDEDF;                          /* plain path text  */
    --url-id:#5FD873;                            /* the file uuid    */
    --url-key:#7099FF;                           /* transform verbs  */
    --url-val:#c9c9cf;                           /* transform values */

    /* ---- Swiss grid (invisible layout scaffold on the 1920x1080 stage) ----
       Every slide is authored against this: a 75px margin all round and a 4x4
       module grid. The grid itself never renders (toggle with "g" for design
       checks); it exists so headlines, cards and the glyph share one rhythm. */
    --gm:75px;                                   /* margin (also col/row 1 start) */
    --gcol:calc((1920px - 2*var(--gm)) / 4);     /* 442.5px column module */
    --grow:calc((1080px - 2*var(--gm)) / 4);     /* 232.5px row module */
    --g2:calc(var(--gcol) * 2);                  /* 2-column span for headlines */

    /* ---- motion scale (one place to tune the whole deck's feel) ----
       Easings mirror Apple's guidance: a snappy expo "out" for entrances, a
       symmetric in-out for reversible/travel moves, and a subtle overshoot
       "pop" reserved for momentum landings. Durations are a 4-step scale.
       The JS spring sampler (see MOTION in the script) reuses the same
       response/bounce vocabulary for the cursor demos. */
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-in-out:cubic-bezier(.4,0,.2,1);
    --ease-pop:cubic-bezier(.34,1.45,.64,1);
    --dur-1:.30s;                                 /* micro (chrome, taps)     */
    --dur-2:.42s;                                 /* standard element entrance*/
    --dur-3:.58s;                                 /* headline rise / travel   */
    --dur-4:.72s;                                 /* large / clip reveals     */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 16:9 stage, letterboxed & scaled ---------- */
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
  #stage{
    width:1920px;height:1080px;
    position:relative;flex:none;
    transform-origin:center center;
    overflow:hidden;
  }

  /* ---------- slides ---------- */
  .slide{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;
    transition:opacity var(--fade,520ms) var(--ease-out);
  }
  .slide.active{opacity:1;visibility:visible}

  /* ---------- UC Video sandbox: single-card embed (?card=N) ----------
     The stage keeps its 1920-wide design in landscape; portrait and square are
     the phone and feed shapes the sandbox exports. Kiosk chrome never shows. */
  #stage[data-format="portrait"]{width:1080px;height:1920px}
  #stage[data-format="square"]{width:1080px;height:1080px}
  body.embed #gear, body.embed #hint, body.embed #editor, body.embed #io, body.embed #progress{display:none!important}
  body.embed, body.embed *{cursor:none!important}

  /* invisible Swiss-grid scaffold — hidden by default, toggle with "g" */
  #gridOverlay{position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .12s ease}
  #gridOverlay.show{opacity:1}
  #gridOverlay .gi{
    position:absolute;left:var(--gm);right:var(--gm);top:var(--gm);bottom:var(--gm);
    display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  }
  #gridOverlay .gi > i{border:1px solid rgba(255,45,60,.55);margin:-.5px 0 0 -.5px}

  /* Uploadcare glyph — a fixed brand mark anchored to the bottom-right grid
     corner, present on every slide for a consistent signature. */
  .watermark{
    position:absolute;right:45px;bottom:43px;width:36px;height:auto;z-index:35;
    opacity:0;transition:opacity 600ms ease;pointer-events:none;
  }
  .watermark svg{width:100%;height:auto;display:block}
  .watermark.show{opacity:1}

  /* ---------- ambient substrate ----------
     The occasional signal blip out in the margins, running behind every card so
     the deck reads as one continuous system rather than seven separate posters.
     Blips are deliberately kept outside the middle of the stage so they never
     compete with the message.

     The wireframe globe used to live here too. It now belongs to card 7 alone
     (`.hb-globe`), which is the payoff — behind the other cards it was reading
     as wallpaper. Card 7 also owns the blips' vocabulary, so the substrate
     steps aside entirely there. */
  #substrate{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    opacity:1;transition:opacity .9s var(--ease-out);
  }
  #stage.sb-off #substrate{opacity:0}
  .sb-field{position:absolute;inset:0}
  /* 5px squares in the storyboard's own three colours (see SB_COLORS). They
     used to run amber-to-green, borrowed from the file board's in-flight /
     landed vocabulary — but the board is card 7 now, so out here that shift
     was signalling a state nothing on screen has. A particle just arrives and
     goes. */
  .sb-blip{
    position:absolute;width:5px;height:5px;
    background:var(--c,#fff);opacity:0;
    animation:sbBlip var(--life,2800ms) linear forwards;
  }
  @keyframes sbBlip{
    0%{opacity:0} 14%{opacity:.8} 82%{opacity:.7} 100%{opacity:0}
  }

  /* progress hairline */
  #progress{
    position:absolute;left:0;bottom:0;height:3px;width:100%;
    background:rgba(255,255,255,.06);z-index:6;
  }
  #progress i{
    display:block;height:100%;width:0;
    background:rgba(255,255,255,.28);
  }

  /* ---- shared type ---- */
  .kicker{
    font-family:var(--mono);font-size:22px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--ink-faint);
    margin-bottom:44px;
  }
  /* modern reveal: a short rise + fade with a snappy expo-out ease. Motion is
     transform-driven (no slow blur/opacity crossfades) and settles fast. */
  .reveal{opacity:0;transform:translateY(16px);transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out)}
  .slide.active .reveal{opacity:1;transform:none}
  .reveal.d1{--grp:60ms}
  .reveal.d2{--grp:160ms}
  .reveal.d3{--grp:260ms}
  .reveal.d4{--grp:360ms}
  .reveal.d5{--grp:460ms}
  .slide.active .reveal.d1{transition-delay:.06s}
  .slide.active .reveal.d2{transition-delay:.16s}
  .slide.active .reveal.d3{transition-delay:.26s}
  .slide.active .reveal.d4{transition-delay:.36s}
  .slide.active .reveal.d5{transition-delay:.46s}

  /* ---- shared text animation presets — same "Text animation" control on
     every slide type (see fieldsFor). "rise" (above) is the default/off
     state; these layer on top of it via an extra fx-* class. ---- */
  .reveal.fx-blur{
    filter:blur(9px);
    transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out),filter .5s var(--ease-out);
  }
  .slide.active .reveal.fx-blur{filter:blur(0)}

  .reveal.fx-weight{
    font-weight:200;
    transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out),font-weight .62s var(--ease-out);
  }
  .slide.active .reveal.fx-weight{font-weight:var(--fw-target,600)}

  .reveal.fx-stagger{opacity:1!important;transform:none!important;transition:none!important}
  .reveal.fx-stagger .w{
    display:inline-block;opacity:0;transform:translateY(.42em);
    transition:opacity .38s ease,transform .5s var(--ease-out);
    transition-delay:calc(var(--grp,0ms) + var(--wi,0)*32ms);
  }
  .slide.active .reveal.fx-stagger .w{opacity:1;transform:none}

  /* mask reveal: the line's text slides up from behind a hard edge (the
     element clips its own overflow) — the modern "editorial" entrance.
     padding/negative-margin gives ascenders & descenders room so the text
     box isn't clipped at rest, without shifting layout. */
  .reveal.fx-clip{opacity:1!important;transform:none!important;transition:none!important;overflow:hidden;padding-block:.09em;margin-block:-.09em}
  .reveal.fx-clip .cl{
    display:inline-block;transform:translateY(115%);
    transition:transform var(--dur-4) var(--ease-out);
    transition-delay:var(--grp,0ms);
  }
  .slide.active .reveal.fx-clip .cl{transform:none}

  /* ---- statement slide ---- */
  .st-wrap{text-align:center;max-width:1560px;padding:0 var(--gm)}
  .st-line1{
    font-size:104px;font-weight:600;letter-spacing:-0.025em;line-height:1.12;
    color:var(--ink-dim);
  }
  .st-line2{
    font-size:104px;font-weight:600;letter-spacing:-0.025em;line-height:1.18;
    color:var(--ink);margin-top:10px;
  }
  .st-line2.mono{
    font-family:var(--mono);font-weight:500;font-size:92px;letter-spacing:-0.01em;
  }

  /* ---- pipeline chips (Upload -> Store -> Transform -> Deliver) ---- */
  .pl-row{display:flex;align-items:center;justify-content:center;margin-top:64px}
  .pl-pill{
    font-family:var(--mono);font-size:22px;letter-spacing:.04em;color:var(--ink-dim);
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px 28px;
  }
  .pl-line{width:64px;height:8px;margin:0 2px;display:flex;align-items:center;flex:none}
  .pl-line i{width:8px;height:8px;background:var(--ink-faint);border-radius:2px;flex:none}
  .pl-line span{flex:1;height:1px;background:var(--line)}
  /* the row itself appears instantly; each pill/connector cascades in on
     its own, and each connector's line "draws" left-to-right right after */
  .pl-row.pl-anim{opacity:1!important;transform:none!important;transition:none!important}
  .pl-row.pl-anim .pl-pill,.pl-row.pl-anim .pl-line{
    opacity:0;transform:translateY(12px);
    transition:opacity .38s ease,transform .48s var(--ease-out);
    transition-delay:calc(var(--grp,0ms) + var(--pi,0)*90ms);
  }
  .slide.active .pl-row.pl-anim .pl-pill,.slide.active .pl-row.pl-anim .pl-line{opacity:1;transform:none}
  .pl-row.pl-anim .pl-line span{transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease-out);transition-delay:calc(var(--grp,0ms) + var(--pi,0)*90ms + .14s)}
  .slide.active .pl-row.pl-anim .pl-line span{transform:scaleX(1)}

  /* mono subtitle under the platform headline; text after "|" glows */
  .st-sub{
    font-family:var(--mono);font-size:26px;letter-spacing:.02em;color:var(--ink-dim);
    margin-top:22px;
  }
  .st-sub-hi{color:var(--brand)}

  /* shining pipeline — a brand-yellow highlight sweeps the chips once they've
     settled, then the row keeps a soft glow (slide 6). */
  .pl-shine .pl-pill{position:relative;overflow:hidden}
  .slide.active .pl-shine .pl-pill{
    border-color:rgba(255,207,62,.35);
    box-shadow:0 0 0 1px rgba(255,207,62,.06),0 8px 30px rgba(255,207,62,.05);
    transition:border-color .6s ease,box-shadow .6s ease;transition-delay:1s;
  }
  .pl-shine .pl-pill::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,207,62,.45) 50%,transparent 65%);
    transform:translateX(-160%);
  }
  .slide.active .pl-shine .pl-pill::after{
    animation:plShine 2.6s cubic-bezier(.16,1,.3,1) 1.1s infinite;
  }
  @keyframes plShine{0%{transform:translateX(-160%)}55%,100%{transform:translateX(160%)}}

  /* ---- chaos slide: the endless, self-tangling feature graph ----
     a "File uploaded" node lands first, then the whole maintenance web blooms
     in around it. The headline rides on top behind a soft left scrim. */
  .ch2-wrap{position:absolute;inset:0;overflow:hidden}
  .ch2-lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;
    opacity:0;transition:opacity 1.3s ease;transition-delay:.6s}
  .slide.active .ch2-lines{opacity:1}
  .ch2-lines path{fill:none;stroke:#34343c;stroke-width:1.1}
  .ch2-lines circle{fill:#45454e}
  .ch2-node{
    position:absolute;transform:translate(-50%,-50%) scale(.88);
    font-family:var(--mono);font-size:15px;letter-spacing:.05em;color:#6d6d77;white-space:nowrap;
    border:1px solid #26262c;background:rgba(15,15,18,.72);border-radius:8px;padding:7px 13px;z-index:2;
    opacity:0;transition:opacity .5s ease,transform .6s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0ms);
  }
  .slide.active .ch2-node{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .ch2-node.em{color:var(--ink);border-color:#54545c;background:rgba(24,24,28,.94);font-size:16px;z-index:3}
  .ch2-node.up{border-color:rgba(255,207,62,.55);color:#fff;background:rgba(28,26,18,.95)}
  .slide.active .ch2-node.up{box-shadow:0 0 0 1px rgba(255,207,62,.22),0 12px 44px rgba(255,207,62,.10)}
  .ch2-scrim{position:absolute;inset:0;z-index:4;pointer-events:none;
    background:linear-gradient(90deg,rgba(9,9,9,.97) 0%,rgba(9,9,9,.84) 27%,rgba(9,9,9,0) 52%)}
  .ch2-left{position:absolute;left:var(--gm);top:50%;transform:translateY(-50%);z-index:5;max-width:var(--g2)}

  /* ---- number slide ---- */
  .num-wrap{text-align:center;padding:0 var(--gm)}
  .num-big{
    font-size:340px;font-weight:700;letter-spacing:-0.04em;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .num-big .suffix{font-weight:700}
  .num-label{
    font-size:52px;font-weight:500;color:var(--ink-dim);
    margin-top:36px;letter-spacing:-0.01em;
  }

  /* ---- chart slide ---- */
  .ch-wrap{position:absolute;inset:0}
  .ch-head{position:absolute;top:170px;left:var(--gm);max-width:760px}
  .ch-big{font-size:300px;font-weight:700;letter-spacing:-0.04em;line-height:.95}
  .ch-label{font-size:46px;font-weight:500;color:var(--ink-dim);margin-top:28px;letter-spacing:-0.01em}
  .ch-svg{position:absolute;inset:0;width:100%;height:100%}
  .ch-line{fill:none;stroke:#DADAE6;stroke-width:6;stroke-linecap:square;stroke-linejoin:round}
  .ch-dot{fill:#fff}
  .ch-val{font-family:var(--mono);font-size:34px;fill:#EDEDF5}
  .ch-line,.ch-dot,.ch-val{opacity:0}
  .slide.active .ch-line{opacity:1}
  .ch-quote{
    position:absolute;left:var(--gm);bottom:110px;max-width:760px;
    font-size:32px;font-weight:500;color:var(--ink-dim);line-height:1.4;
  }
  .ch-quote span{display:block;margin-top:14px;font-family:var(--mono);font-size:20px;color:var(--ink-faint);letter-spacing:.04em}

  /* ---- stats trio ---- */
  .tr-wrap{display:flex;gap:130px;align-items:flex-start;padding:0 var(--gm)}
  .tr-item{text-align:left}
  .tr-val{font-size:128px;font-weight:700;letter-spacing:-0.035em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tr-lab{font-size:34px;color:var(--ink-dim);margin-top:24px;font-weight:500}
  .tr-rule{width:64px;height:4px;background:var(--brand);margin-bottom:36px}
  .tr-kicker{text-align:center;margin-bottom:90px}
  /* customer quote sitting under the metrics */
  .tr-quote{max-width:1180px;margin:96px auto 0;text-align:center}
  .tr-quote-line{font-size:46px;font-weight:600;letter-spacing:-0.02em;line-height:1.28;color:var(--ink)}
  .tr-quote-by{margin-top:30px;font-family:var(--mono);font-size:20px;letter-spacing:.02em;color:var(--ink-dim)}
  .tr-quote-by b{color:var(--ink);font-weight:500}

  /* ---- animated logo slide ---- */
  .la-wrap{text-align:center;padding:0 var(--gm)}
  .la-logo{display:flex;justify-content:center}
  .la-logo svg{height:170px;width:auto;overflow:visible}
  .la-logo.mark svg{height:430px}
  .la-logo svg path{transform-box:fill-box;transform-origin:center}
  .la-tag{
    font-size:44px;font-weight:500;color:var(--ink-dim);
    margin-top:80px;letter-spacing:-0.01em;opacity:0;
  }
  .la-tag.mono{font-family:var(--mono);font-size:30px;color:var(--ink-faint);letter-spacing:.08em}

  /* ---- logo slide ---- */
  .lg-wrap{position:absolute;inset:0;display:flex;align-items:center}
  .lg-left{padding-left:var(--gm);z-index:2;max-width:900px}
  .lg-logo svg{height:96px;width:auto;display:block}
  .lg-tag{
    font-size:76px;font-weight:600;letter-spacing:-0.02em;line-height:1.22;
    margin-top:70px;color:var(--ink);
  }
  .lg-sub{
    font-family:var(--mono);font-size:26px;color:var(--ink-faint);
    margin-top:56px;letter-spacing:.06em;
  }
  .lg-canvas{position:absolute;right:0;top:0;height:100%;width:52%;}

  /* ---- reveal slide (mosaic -> photo) ---- */
  .rv-wrap{position:absolute;inset:0;display:flex;align-items:center}
  .rv-left{padding-left:var(--gm);z-index:2;max-width:var(--g2)}
  .rv-line{
    font-size:92px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;
    color:var(--ink);max-width:760px;
  }
  /* photo card — a portrait plate parked on the right, its vertical centre locked
     to the stage middle so it lines up with the headline (sits inside the grid;
     the dark gap on its right holds the brand glyph). */
  .rv-visual{position:absolute;left:1096px;top:50%;transform:translateY(-50%);width:688px;height:848px;overflow:hidden;border-radius:4px}
  .rv-visual canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
  /* the photo sits UNDER the halftone canvas; JS adds .shown right as the dots
     dissolve, so the pixels appear to resolve straight into the real image. */
  .rv-photo{position:absolute;inset:0;opacity:0;overflow:hidden;transition:opacity .7s ease;z-index:1}
  .rv-photo.shown{opacity:1}
  .rv-photo img{
    display:block;width:100%;height:100%;object-fit:cover;
    transform:scale(1.06);transition:transform 1.1s cubic-bezier(.16,1,.3,1);
  }
  .rv-photo.shown img{transform:scale(1)}
  /* a single soft diagonal sheen sweeps across once the photo settles in */
  .rv-photo::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.32) 50%,transparent 65%);
    transform:translateX(-120%);transition:transform .85s ease;transition-delay:.35s;
  }
  .rv-photo.shown::after{transform:translateX(120%)}

  /* ---- mockup slide (fake UI card) ---- */
  .mk-wrap{position:absolute;inset:0;display:flex;align-items:center}
  .mk-left{padding-left:var(--gm);z-index:2;max-width:var(--g2)}
  .mk-line1{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink-dim)}
  .mk-line2{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink);margin-top:6px}
  .mk-visual{position:absolute;right:150px;top:50%;transform:translateY(-50%);width:520px}
  .mk-overlay{
    position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);
    opacity:0;transform:scale(.94);pointer-events:none;z-index:1;
    transition:opacity .6s ease,transform .8s cubic-bezier(.16,1,.3,1);transition-delay:.2s;
  }
  .slide.active .mk-overlay{opacity:.35;transform:scale(1)}
  .mk-overlay line{stroke:var(--ink-faint);stroke-width:1.5}
  .mk-overlay circle{fill:var(--brand);opacity:.55}
  .mk-card{
    background:#EDEDF2;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative;z-index:2;
    opacity:0;transform:scale(.92) rotate(-1deg);
    transition:opacity .45s ease,transform .62s cubic-bezier(.34,1.3,.5,1);transition-delay:.1s;
  }
  .slide.active .mk-card{opacity:1;transform:none}
  .mk-modal{padding:36px}
  .mk-modal-title{font-size:22px;font-weight:600;color:#16161a;margin-bottom:20px}
  .mk-dropzone{border:2px dashed #C7C7D1;border-radius:12px;padding:44px 16px;text-align:center;color:#6a6a76;font-size:15px}
  .mk-dropzone span{color:#2E6BFF;font-weight:600}

  /* ---- upload demo slide (real uploader SVGs + cursor drag + progress) ---- */
  /* the slide plays in two acts: phase1 = "drag & drop" headline + the live
     uploader; when the progress bar completes it cross-fades to phase2 =
     the "side project that never ends" line + a File-uploaded tag, and 2s
     later the maintenance-nodes network blooms in behind everything. */
  .up-wrap{position:absolute;inset:0}
  .up-nodes{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;z-index:0;pointer-events:none}
  /* phase 1 — headline on the left, live uploader on the right */
  .up-phase1{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:40px;padding:0 var(--gm);z-index:2}
  .up-left{text-align:left;max-width:var(--g2);flex:none}
  .up-line1{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink-dim)}
  .up-line2{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink);margin-top:6px}
  /* the demo box is authored at a fixed 600×520 px inside the 1920 stage;
     the stage transform handles TV scaling, so px here == px on screen.
     position:relative keeps it a positioning context for the absolutely
     placed states/cursor/progress while it sits centered in the flex flow. */
  .up-stage{position:relative;width:600px;height:520px}
  .up-base{position:absolute;left:0;top:0;width:100%;display:block}
  .up-hover,.up-uploading{opacity:0}
  /* progress overlay sits exactly over the uploading SVG's built-in bar and
     covers it (dropzone is #fff) so we can animate a clean fill 0→100% */
  .up-progress{
    position:absolute;left:245px;top:127px;width:112px;height:18px;
    background:#fff;display:flex;align-items:center;justify-content:center;opacity:0;
  }
  .up-progress .trk{position:relative;width:96px;height:6px;background:#E2E2E4;border-radius:3px;overflow:hidden}
  .up-progress .trk i{position:absolute;left:0;top:0;height:100%;width:0;background:#141414;border-radius:3px}
  .up-hand{position:absolute;left:0;top:0;will-change:transform}
  .up-drag{position:absolute;left:0;top:0;width:96px;border-radius:10px;overflow:hidden;box-shadow:0 16px 34px rgba(0,0,0,.4)}
  .up-drag img{display:block;width:100%;height:auto}
  .up-cursor{position:absolute;left:58px;top:44px;width:38px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}

  /* phase 2 — the "side project" payoff, layered above the nodes network.
     the radial scrim keeps the copy legible over the busy graph behind it. */
  .up-phase2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;z-index:3;opacity:0}
  .up-phase2::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1600px;height:920px;background:radial-gradient(ellipse at center,rgba(9,9,9,.92) 0%,rgba(9,9,9,.78) 42%,rgba(9,9,9,0) 74%);z-index:-1;pointer-events:none}
  .up-after{text-align:center;max-width:1320px}
  .up-after-line1{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink-dim)}
  .up-after-line2{font-size:88px;font-weight:600;letter-spacing:-0.02em;line-height:1.18;color:var(--ink);margin-top:6px}
  .up-tag{width:210px;height:auto;display:block}

  /* ---- code / terminal slide (headline left, live terminal right) ---- */

    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);text-align:left;
    display:flex;flex-direction:column;

  .slide.active .cd-window.reveal{filter:brightness(1);transform:translateY(-50%)}
  .cd-chrome{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);background:#141416;flex:none}
  .cd-chrome i{width:12px;height:12px;border-radius:50%;background:#33333a;flex:none;opacity:0;transition:opacity .3s ease}

  /* ---- Webflow marketplace install slide — see the .wf-* block below ---- */

  /* ================= HERO BOARD SLIDE ================= */
  .hb{position:absolute;inset:0;overflow:hidden}
  .hb-logo{position:absolute;top:76px;left:90px;height:56px}
  .hb-logo svg{height:100%;width:auto}
  .hb-title{
    position:absolute;top:70px;right:96px;text-align:left;
    font-family:var(--sans);font-weight:700;font-size:86px;line-height:1.04;
    letter-spacing:-0.03em;color:var(--ink);max-width:1040px;
  }
  .hb-foot{
    position:absolute;left:0;right:0;bottom:56px;text-align:center;
    font-family:var(--cmono);font-size:22px;letter-spacing:.14em;color:#595959;
  }
  /* The wireframe is the storyboard's own: 1797.56x995.42 centred on the stage,
     which leaves a 61px margin at the sides and 42px top and bottom. Both axes
     are set explicitly — the source SVG's header used to declare a height that
     cut a third of the globe off, and `height:auto` inherited the lie. The
     breathe stays under 1.5% so the outer ring never reaches an edge. */
  .hb-globe{
    position:absolute;left:50%;top:50%;width:1797.56px;height:995.42px;
    transform:translate(-50%,-50%);pointer-events:none;
    opacity:0;transition:opacity .8s ease;
  }
  .slide.active .hb-globe{opacity:1}
  .hb-globe svg{width:100%;height:100%;display:block}
  .hb-globe.spin{animation:hbGlobe 68s ease-in-out infinite}
  @keyframes hbGlobe{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.012)}
  }

  /* scattered signal dots */
  .hb-dot{position:absolute;width:9px;height:9px;border-radius:1px}
  .hb-dot.g{background:var(--ok)}
  .hb-dot.y{background:var(--brand)}
  .hb-dot.d{background:#4a4a30}
  .hb-dot.pulse{animation:hbDot 3.4s ease-in-out infinite}
  @keyframes hbDot{0%,100%{opacity:.35}50%{opacity:1}}

  /* floating file card + its terminal annotation */
  .hb-node{position:absolute;opacity:0}
  .slide.active .hb-node{animation:hbIn .6s cubic-bezier(.16,1,.3,1) forwards}
  .slide.active .hb-node.n1{animation-delay:.14s}
  .slide.active .hb-node.n2{animation-delay:.3s}
  .slide.active .hb-node.n3{animation-delay:.46s}
  .slide.active .hb-node.n4{animation-delay:.62s}
  @keyframes hbIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

  /* perpetual gentle drift on an inner wrapper (composes with entrance) */
  .hb-inner{position:relative}
  .hb-node.float .hb-inner{animation-duration:var(--fdur,9s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-delay:var(--fdelay,0s)}
  .hb-node.float.n1 .hb-inner{animation-name:hbF1}
  .hb-node.float.n2 .hb-inner{animation-name:hbF2}
  .hb-node.float.n3 .hb-inner{animation-name:hbF3}
  .hb-node.float.n4 .hb-inner{animation-name:hbF4}
  @keyframes hbF1{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(6px,-13px) rotate(.5deg)}}
  @keyframes hbF2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-7px,-10px) rotate(-.5deg)}}
  @keyframes hbF3{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(5px,11px) rotate(.4deg)}}
  @keyframes hbF4{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-5px,9px) rotate(-.4deg)}}

  .hb-card{
    border-radius:22px;overflow:hidden;position:relative;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .hb-card img{display:block;width:100%;height:100%;object-fit:cover}
  .hb-card.framed{
    border:1.5px solid #2b2b30;background:#0d0d0f;padding:10px;border-radius:20px;
    box-shadow:none;
  }

  .hb-card.docx{background:transparent;box-shadow:none}

  .hb-meta{
    position:absolute;font-family:var(--cmono);font-size:18px;line-height:1.7;
    letter-spacing:.01em;color:#8E8E8E;
  }
  .hb-line{min-height:1.7em;white-space:pre}
  /* BOARD_META tags a run with a class name, so these are class selectors:
     .b = a value, .g = a passed check, .t = a timing, .dim = an aside */
  .hb-meta .b{color:#8E8E8E;font-weight:500}
  .hb-meta .g{color:var(--ok);font-weight:500}
  .hb-meta .t{color:var(--ok);font-weight:500}
  .hb-meta .dim{color:#595959}
  .hb-cursor{
    display:inline-block;width:9px;height:19px;background:var(--ok);
    vertical-align:-3px;margin-left:1px;animation:hbBlink 1.05s steps(1) infinite;
  }
  @keyframes hbBlink{50%{opacity:0}}

  /* the little status LED beside the framed JPEG */
  .hb-led{position:absolute;width:11px;height:11px;background:var(--ok);border-radius:2px}

  /* Board slide, outro layout — the deck's last card, laid out to storyboard
     frame 184:5666. Everything on the centre line is pinned to its own y from
     the frame rather than stacked, because the glyph sits between the headline
     and the sign-off and a stack would have the three of them pushing on each
     other. Left offsets, not translateX(-50%): .reveal owns transform. */
  .hb-outro{position:absolute;left:507px;top:320px;width:907px;text-align:center;z-index:2}
  .hb-outro-line{
    font-family:var(--sans);font-weight:700;font-size:80px;line-height:1.065;
    letter-spacing:-1.2px;color:var(--ink);
    text-box-trim:trim-both;text-box-edge:cap alphabetic;
  }
  .hb-outro-sub{
    position:absolute;left:0;right:0;top:640px;text-align:center;z-index:2;
    font-family:var(--sans);font-size:32px;font-weight:580;line-height:1.065;
    letter-spacing:-.48px;color:#bcbdc0;
    text-box-trim:trim-both;text-box-edge:cap alphabetic;
  }

  /* ---- the sign-off's hand actually waves ----
     Two nested elements, because a wave is two motions on different clocks: the
     whole hand lifts as the gesture starts and lowers as it ends, while the
     hand itself pivots much faster. One transform can't carry both.

     What makes it read as a wave rather than a rocking icon:
     - it pivots at the wrist, not the centre of the glyph. Centre origin makes
       the hand look like it is spinning in place. 65%/88% is measured, not
       guessed: the glyph's ink tapers to a point at the bottom (that taper is
       the forearm) and that point sits there within the inline box. Note it is
       a fraction of the *line box*, which the emoji does not fill — eyeballing
       "the bottom of the hand" as 100% puts the pivot in empty space below it.
     - it winds up. The hand tips a few degrees the wrong way before the first
       real swing, the way a gesture loads before it fires.
     - it is quick and it holds its energy. Half-swings land 160ms apart — a
       little over 3Hz, which is an excited wave rather than a polite one — and
       the arc stays wide for most of the burst (22 → 18 → 20 → 16 → 17) before
       giving out at the end. Monotonic damping reads as a wave running down;
       holding the amplitude and then dropping it reads as someone happy to see
       you who stops because they are done, not because they ran out.
     - the arc is wider than it would be on a desktop UI because this plays on a
       TV people read from 2–4m; at ±12 the hand travels a couple of millimetres
       on the panel and the gesture is lost.
     - it comes in bursts. ~1.5s of waving then three seconds of stillness — a
       person waves, then stops. A metronome reads as a GIF.
     ease-in-out between every stop is what makes each end of the arc settle
     and the middle move quickly: that is pendulum motion. */
     Both are scoped to .slide.active so the gesture starts when the card does.
     Unscoped, the animation runs from the moment the deck renders and the card
     inherits whatever phase it happens to land on — the hand is as likely to be
     mid-swing on arrival as at rest, and on the second loop it would be
     somewhere else again. The 1.5s delay puts the wave just after the sign-off
     finishes its own entrance (d5, .46s + .58s), so it reads as the hand
     noticing you rather than waving before it is there. */
  .hb-wave{display:inline-block}
  .hb-wave i{display:inline-block;font-style:normal;transform-origin:65% 88%}
  .slide.active .hb-wave{animation:hbWaveLift 4.4s ease-in-out 1.4s infinite}
  .slide.active .hb-wave i{animation:hbWaveArm 4.4s ease-in-out 1.4s infinite}
  @keyframes hbWaveArm{
    0%    {transform:rotate(0deg)}
    2%    {transform:rotate(-6deg)}
    5.6%  {transform:rotate(22deg)}
    9.2%  {transform:rotate(-18deg)}
    12.8% {transform:rotate(20deg)}
    16.4% {transform:rotate(-16deg)}
    20%   {transform:rotate(17deg)}
    23.6% {transform:rotate(-12deg)}
    27.2% {transform:rotate(10deg)}
    30.4% {transform:rotate(-4deg)}
    33%,100%{transform:rotate(0deg)}
  }
  @keyframes hbWaveLift{
    0%    {transform:translateY(0) scale(1)}
    5%    {transform:translateY(-4px) scale(1.06)}
    26%   {transform:translateY(-3.5px) scale(1.05)}
    35%,100%{transform:translateY(0) scale(1)}
  }

  /* The glyph on the centre line. Its own #090909 pad is the storyboard's: it
     knocks the wireframe's crossing lines out from behind the mark so the
     pixels read as pixels. */
  .hb-mark{
    position:absolute;left:916px;top:497px;width:86px;height:86px;
    display:flex;align-items:center;justify-content:center;
    background:#090909;z-index:2;
  }
  .hb-mark svg{width:62px;height:62px;display:block;overflow:visible}
  /* the sparkle: every pixel of the mark drifts on its own slow cycle. Range
     and period are randomised per square in setupBoard() — the storyboard's
     own render is a snapshot of exactly this, a field of squares sitting at
     different greys, so animating it is just letting that field move. */
  .hb-mark.twinkle path{
    animation:hbTwinkle var(--d,6s) ease-in-out var(--t,0s) infinite;
  }
  @keyframes hbTwinkle{0%,100%{opacity:var(--o1,.3)}50%{opacity:var(--o2,.95)}}

  /* ---- shared heading type (from Figma spec) — one place to tweak every
     slide's headline. Placed after the individual heading rules so it wins
     the shared props while their per-class color/margins stay intact.
     Inter 580 · 88px · line-height 106.5% · letter-spacing -1.5% ---- */
  :root{ --h-size:72px; --h-weight:580; --h-lh:1.065; --h-ls:-.015em;
         /* every storyboard frame anchors its headline to the same y, so the
            type doesn't shift as the deck advances */
         --head-y:205px; }
  /* .hd is the single, naturally-wrapping headline used by statement / mockup /
     upload. code, reveal and the board title share the same type spec.
     .hb-outro-line is deliberately not in this list: the last card's headline
     is the storyboard's own 80px bold, set on its own two lines. */
  .hd,.cd-line,.rv-line,.hb-title{
    font-family:var(--sans);
    font-weight:var(--h-weight);
    font-size:var(--h-size);
    line-height:var(--h-lh);
    letter-spacing:var(--h-ls);
  }
  .hd{color:var(--ink)}
  .hd.mono{ font-family:var(--mono);font-weight:500 }

  #addmenu{position:relative}
  #addlist{
    position:absolute;bottom:44px;left:0;background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;min-width:190px;
  }
  #addlist.open{display:block}
  #addlist button{
    display:block;width:100%;text-align:left;background:none;border:0;color:#d8d8de;
    padding:10px 14px;font-size:13px;cursor:pointer;font-family:var(--sans);
  }
  #addlist button:hover{background:#222227}

  #io{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
  #io.open{display:flex}
  #io .box{width:640px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
  #io textarea{min-height:260px;font-family:var(--mono);font-size:12px}
  #io .actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}

  /* =======================================================================
     Simplified booth loop — card-specific styles (dropin/features/quote2/
     logos/scale/cta). The install card reuses the existing .in-* styles.
     ======================================================================= */

  /* ---- shared primitives (the reference's quality bar) ---- */
  .panel{background:var(--panel-fg);border-radius:var(--panel-radius);box-shadow:var(--shadow-floating)}
  .tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-weight:500;
    font-size:14px;letter-spacing:.02em;color:#8b8b93;background:#1f1f22;border:1px solid var(--line);
    border-radius:8px;padding:5px 11px;white-space:nowrap}
  .tag.brand{color:var(--brand)}
  .tag.ok{color:var(--ok)}

  /* =======================================================================
     Pipeline card — the website's three-panel demo (upload | analyse | deliver),
     ported for the booth loop: it plays once when the card is entered and has
     no replay control.

     Geometry is the site's, scaled ~1.35x for the 1920x1080 stage and for
     viewing across a stand: the site's 13px mono would be unreadable at that
     distance, so the type is set at 20px and the boxes grew to match.
     Choreographed by setupPipeline(); colours mirror the site's tokens.
     ======================================================================= */
  .pd-wrap{position:absolute;inset:0}

  .pd-shell{
    position:absolute;left:334px;top:384px;width:1252px;height:554px;
    border-radius:39px;background:#0c0c0c;border:1px solid rgba(255,255,255,.05);
    padding:11px;overflow:hidden;
  }
  /* the uploaded photo, blurred right down — a wash of the file's own colour
     that wipes upward in lockstep with the progress bar */
  .pd-bgwrap{position:absolute;left:50%;top:50%;width:340px;height:440px;
    transform:translate(-50%,-50%);filter:blur(15px);opacity:.1;pointer-events:none;z-index:0}
  .pd-bg{width:100%;height:100%;border-radius:32px;overflow:hidden;clip-path:inset(0 0 100% 0)}
  .pd-bg img{width:100%;height:100%;object-fit:cover}

  .pd-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr .8fr 1fr;gap:24px;height:100%}
  .pd-cell{position:relative;border-radius:27px;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.05);
    padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  .pd-cell.mid{background:transparent;box-shadow:none;padding:0;overflow:visible;gap:20px}
  .pd-inner{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative}

  /* ---- left: the drop ---- */
  .pd-cursor{position:absolute;left:50%;top:50%;width:76.5px;height:99.5px;z-index:2;pointer-events:none;opacity:0}
  .pd-cursor-thumb{width:100%;height:100%;border-radius:8px;overflow:hidden;
    box-shadow:0 25px 50px -12px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.13);background:#181818}
  .pd-cursor-thumb img{width:100%;height:100%;object-fit:cover}
  .pd-cursor-ic{position:absolute;bottom:-8.9px;right:-6.4px;width:12.9px;height:17.9px;
    filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
  .pd-cursor-ic svg{width:100%;height:100%;display:block}

  .pd-zone{position:relative;width:258px;height:333px;border-radius:27px;
    border:1px dashed rgba(255,255,255,.13);overflow:hidden;transition:border-color .3s ease}
  .pd-zone[data-state="active"]{border-color:rgba(255,255,255,.25)}
  .pd-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:15px;text-transform:uppercase;letter-spacing:.05em;
    color:rgba(255,255,255,.25);transition:color .3s ease}
  .pd-zone[data-state="active"] .pd-ph{color:rgba(255,255,255,.5)}
  .pd-shot{width:100%;height:100%;object-fit:cover;border-radius:26px;padding:5px 8px;opacity:0}
  .pd-track{position:absolute;bottom:21px;left:21px;right:21px;height:6px;padding:2px;
    border-radius:999px;background:rgba(0,0,0,.2);backdrop-filter:blur(5px);overflow:hidden;opacity:0}
  .pd-fill{height:100%;background:rgba(255,255,255,.9);border-radius:999px;
    transform-origin:left center;transform:scaleX(0)}
  .pd-ctl{position:absolute;top:20px;right:21px;display:flex;gap:2px;opacity:0}
  .pd-btn{width:32px;height:32px;background:rgba(9,9,9,.8);border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:#fff}
  .pd-btn svg{width:14px;height:14px;display:block}
  .pd-status{display:flex;align-items:center;gap:12px;margin-top:16px;font-family:var(--mono);opacity:0}
  .pd-status i{width:8px;height:8px;background:#4ade80}
  .pd-status span{font-size:14px;color:#a7a7a7;text-transform:uppercase;letter-spacing:.05em}

  /* ---- middle: the analysis ---- */
  .pd-pixel{width:100px;height:130px;opacity:0}
  .pd-pixel canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  .pd-prog{display:flex;align-items:center;justify-content:center;width:100%;margin:20px 0}
  .pd-prog-side{flex:1;display:flex;justify-content:center}
  .pd-dots{display:inline-flex;align-items:center;gap:4px}
  .pd-dots i{width:3px;height:3px;background:rgba(255,255,255,.13)}
  .pd-dots[data-state="working"] i{background:rgba(255,255,255,.25);
    animation:pdDot 1s ease-in-out infinite backwards}
  @keyframes pdDot{0%,85%,100%{opacity:.1}30%{opacity:1}}
  .pd-donut{flex-shrink:0;width:30px;height:30px}
  .pd-donut .c{fill:rgba(255,255,255,.13)}
  .pd-donut .c.lit{fill:#ffcf3e}
  .pd-analysis{text-align:center;font-family:var(--mono);font-size:15px;color:#a7a7a7;
    text-transform:uppercase;line-height:20px;padding-bottom:30px}
  .pd-analysis p{opacity:0}
  .pd-analysis b{font-weight:inherit;color:#fff}

  /* ---- right: the delivery ---- */
  /* 15px is the ceiling here, not a preference: the UUID row is 37 monospace
     characters and at anything larger it runs past the 358px the column has to
     give. The storyboard sets it at 13px. */
  /* flex:none matters — the URL block grows a row per transform, and without it
     the picture is what gives way */
  .pd-stage{position:relative;flex:none;width:230px;height:297px;margin-top:16px;opacity:0}
  .pd-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
  /* Two pages, not one block. The whole tag — bracket, host, UUID, three
     transforms, closing bracket — is seven rows, and after the picture and its
     margins the column only has room for about six; the tail was being cut off
     by .pd-cell's overflow. Paging it fixes the clipping and is the better read
     anyway: you see the plain file's URL, it clears, and the transforms build in
     its place, so the ops aren't competing with the address for attention.

     The opening `<img src="` sits outside both pages and never leaves. It is
     what stops page two reading as three orphaned lines of text: with the
     address gone, `-/crop/face/...` on its own is not obviously part of a URL,
     and the closing bracket that would say so does not arrive until the last op
     is in. Keeping the tag open also gives the swap an anchor — the bracket
     holds while the body changes underneath it, rather than the whole block
     turning over at once.

     Both pages are absolutely positioned inside a fixed four-row body (four is
     the taller page: three ops plus the closing bracket), so the swap costs no
     reflow and the picture above never shifts. The explicit width is needed
     because .pd-cell centres its children — a box with only absolute content
     collapses to nothing.

     The 12.5px top margin is the 32px the frame asks for, less the 19.5px row
     the persistent bracket adds. The cell centres its column, so a taller URL
     block would otherwise lift the picture ~10px off the y the storyboard puts
     it at (check_pipeline.py catches exactly this). Trading the margin keeps the
     column's total height, and hence the picture, where it was; the visible gap
     barely changes because the photo is `contain`-fitted and already sits well
     inside the bottom of its 297px box. */
  .pd-url{position:relative;width:100%;height:97.5px;margin-top:12.5px;
    font-family:var(--mono);font-size:15px;line-height:19.5px}
  .pd-body{position:relative;height:78px}
  .pd-u1,.pd-u2{position:absolute;left:0;right:0;top:0}
  .pd-url .row{margin:0;display:flex;flex-wrap:nowrap;white-space:nowrap}
  .pd-url .bracket{color:rgba(255,255,255,.25)}
  .pd-url .indent{padding-left:20px}
  .pd-url .host{color:#a7a7a7}
  .pd-url .dim{color:#a7a7a7}
  .pd-url .id{color:#fff}
  .pd-url .op{color:#ffd864}
  .pd-url .arg{color:#a7a7a7}
  .pd-url .tf{overflow:hidden;height:0;opacity:0}
  .pd-url .st{opacity:0}
  .pd-url .cl{opacity:0}

  /* ---- the compliance marks along the bottom ---- */
  /* pinned at the storyboard's own x/y rather than laid out as a row: the three
     marks have very different bounding boxes and it centres them optically */
  .pd-badge{position:absolute;opacity:0;transform:translateY(10px);
    transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out);
    transition-delay:calc(.62s + var(--i,0)*.09s)}
  .pd-badge svg{width:100%;height:100%;display:block}
  .slide.active .pd-badge{opacity:.5;transform:none}

  /* =======================================================================
     The storyboard headline block.

     Figma trims both texts to their cap box, which is why the title measures
     64px tall at 88px type. text-box-trim reproduces that exactly, so the
     title's cap-top lands on y=168 and the 32px gap is a real 32px between
     cap-bottom and cap-top — not a line-height fudge that drifts when the
     font size changes. Cards adopt this as they get rebuilt.
     ======================================================================= */
  /* --shd-y is the cap-top of the title. Cards set their own: the storyboard
     moves it down as the headline gains lines, so the whole block stays
     balanced rather than the anchor staying put and the text growing off it. */
  .shd{position:absolute;top:var(--shd-y,168px);left:80px;width:1760px;
    text-align:center;font-weight:580}
  .shd-t{font-size:88px;letter-spacing:-1.32px;line-height:normal;color:#fff;
    text-box-trim:trim-both;text-box-edge:cap alphabetic}
  .shd-s{margin-top:32px;font-size:32px;letter-spacing:-.48px;line-height:1.065;color:#bcbdc0;
    text-box-trim:trim-both;text-box-edge:cap alphabetic}

  /* card 1 — uploads that just work.
     The real Uploadcare uploader widget, rebuilt 1:1 from the storyboard: the
     stage is native 1920x1080, so every number here is the Figma number. Files
     are dragged in as a stack, dropped, and then the widget hands over to the
     compact uploading panel. Choreographed by setupDropin(). */
  .di-wrap{position:absolute;inset:0}

  .di-widget{position:absolute;left:760px;top:414px;width:400px;display:flex;flex-direction:column;gap:20px;
    background:#181818;border-radius:18px;padding:20px;
    filter:drop-shadow(0 12px 16px rgba(0,0,0,.25));
    opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .6s var(--ease-out)}
  .slide.active .di-widget{opacity:1;transform:none}
  /* Figma's 49/25 padding sits inside a stroke that costs no layout, so the
     padding here is 1px short on each side to pay for the CSS border and land
     on the same 360x196 box. */
  .di-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    border:1px dashed rgba(255,255,255,.13);border-radius:7px;padding:48px 24px;
    transition:border-color .2s ease,background .2s ease}
  /* while the pointer is over it the zone fills solid and the dashed edge
     drops out — transparent rather than removed, so the border-box keeps the
     same 196px height and nothing below it shifts.

     No transition on the way in. A real drag-over highlight is a state change,
     not an animation: the browser paints it on the frame the pointer crosses
     the boundary, and any ramp here reads as lag rather than as softness. The
     base rule's transition still runs on the way out, where a hard cut would
     pop under the panel swap that follows it. */
  .di-drop.hot{border-color:transparent;background:#242424;transition:none}
  .di-dropic{width:64px;height:64px;border-radius:9999px;background:rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center;flex:none}
  .di-dropic svg{width:16px;height:16px;display:block}
  .di-droptxt{font-size:15px;color:#fff;line-height:18px}
  .di-src{display:flex;flex-direction:column}
  .di-row{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:8px;
    opacity:0;transform:translateY(6px);transition:opacity .34s ease,transform .4s var(--ease-out);
    transition-delay:calc(.34s + var(--i)*.07s)}
  .slide.active .di-row{opacity:1;transform:none}
  .di-rowic{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center}
  .di-rowic svg{width:16px;height:16px;display:block}
  .di-rowtxt{font-size:14px;color:#fff;line-height:normal}
  .di-cancel{background:rgba(255,255,255,.05);border-radius:8px;padding:5.5px 0;
    text-align:center;font-size:14px;color:#fff;line-height:normal}

  /* The dragged files travel as one stack under a single cursor, so the group
     carries the motion and the cards only hold their offsets. The stack rests
     far enough left that the pointer — pinned to the front card's lower-right
     corner — sits inside the dropzone rather than beside the widget, which is
     what makes the zone's hover state read as caused by the pointer. */
  .di-group{position:absolute;left:1008px;top:398px;width:120px;height:150px;opacity:0}
  .di-card{position:absolute;inset:0}
  .di-card.a{transform:translate(24px,-26px)}
  .di-card img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
  .di-tag{position:absolute;top:6px;background:#161616;border-radius:6px;padding:4px 8px;
    font-family:var(--mono);font-weight:400;font-size:12px;line-height:normal;color:#fff}
  .di-tag.k{left:6px}
  .di-tag.s{right:6px}
  .di-cur{position:absolute;left:95px;top:141px;width:18px;height:25px;
    filter:drop-shadow(1px 0 1px rgba(0,0,0,.3))}
  .di-cur svg{width:100%;height:100%;display:block}

  /* the compact uploading panel that takes over once the files land */
  .di-panel{position:absolute;left:759px;top:484px;width:400px;
    background:#1a1a1a;border-radius:12px;overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0}
  .di-phead{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 20px}
  .di-ptitle{font-size:14px;font-weight:510;line-height:20px;color:#e1e1e1}
  .di-pclose{padding:8px;display:flex}
  .di-pclose svg{width:16px;height:16px;display:block}
  .di-plist{display:flex;flex-direction:column;gap:4px;padding:0 10px 10px}
  .di-file{display:flex;align-items:center;justify-content:space-between;
    background:#242424;border-radius:8px;padding:10px}
  .di-fleft{display:flex;align-items:center;gap:12px}
  .di-thumb{position:relative;width:32px;height:32px;flex:none}
  .di-thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
  .di-check{position:absolute;left:16px;top:16px;width:14px;height:14px;
    opacity:0;transform:scale(.55);
    transition:opacity .18s ease,transform var(--dur-2) var(--ease-pop)}
  .di-check svg{width:100%;height:100%;display:block}
  .di-fname{font-size:13px;line-height:20px;color:#989898}
  .di-act{position:relative;width:21px;height:21px;flex:none;
    display:flex;align-items:center;justify-content:center}
  /* the ring and the bin occupy the same slot and swap on completion */
  .di-ring{position:absolute;width:20px;height:20px;transition:opacity .18s ease}
  .di-ring .trk{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1}
  .di-ring .arc{fill:none;stroke:#5199FF;stroke-width:1;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:50% 50%;
    stroke-dasharray:57.6;stroke-dashoffset:57.6}
  .di-ring .x{stroke:#989898;stroke-width:1}
  /* the ring is centred in the slot but the bin is flush right, as in the
     storyboard — they're different widths and both align to the row's edge */
  .di-bin{position:absolute;right:0;width:16px;height:16px;opacity:0;transition:opacity .18s ease}
  .di-bin svg{width:100%;height:100%;display:block}
  .di-file[data-state="done"] .di-check{opacity:1;transform:none}
  .di-file[data-state="done"] .di-ring{opacity:0}
  .di-file[data-state="done"] .di-bin{opacity:1}

  /* card 2 — five capabilities, as the storyboard's panel row */
  .ft-wrap{position:absolute;inset:0}
  .ft-row{position:absolute;left:266px;top:382px;width:1389px;height:316px;
    display:flex;gap:16px}
  .ft-card{position:relative;width:265px;background:#0c0c0c;border:1px solid #181818;
    border-radius:24px;
    padding:40px;display:flex;flex-direction:column;justify-content:space-between;
    opacity:0;transform:translateY(20px);
    transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out);
    transition-delay:calc(.12s + var(--i)*.06s)}
  .slide.active .ft-card{opacity:1;transform:none}

  /* Once the icons land the row just sits there, which is the one place in the
     deck that read as a static slide rather than a paused one. A pulse now
     travels left to right on a loop: each panel washes to 10% of its own icon's
     accent and back. The colour is the card's, not a house colour, so the sweep
     reads as five distinct capabilities lighting up in turn instead of one
     effect painted across the row.

     It rides an overlay's opacity rather than the card's own background-color.
     Opacity composites; background-color repaints, and this runs forever on a
     panel nobody ever touches. The overlay carries a full-strength inset ring
     over a 40%-alpha fill, so at the peak the edge sits at 25% of the accent
     while the fill stays at the 10% wash — the border is what actually carries
     the pulse across a room, the fill alone is too quiet at this distance.

     Delayed past the entrance (the last icon lands ~1.7s) and scoped to
     .slide.active, so the pulse starts once the row is built rather than
     underneath it, and starts from the top on every visit. */
  .ft-card::before{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:color-mix(in srgb, var(--ac) 40%, transparent);
    box-shadow:inset 0 0 0 1px var(--ac);
    opacity:0;
  }
  /* 300ms between panels, not 180. The faster hand-off read as one wash sliding
     across the row; at this spacing each panel gets its own moment and the
     sweep is legible as five events. Each pulse also runs longer than the gap
     (1.5s against 300ms), so neighbours still overlap and the row never breaks
     into five separate blinks. */
  .slide.active .ft-card::before{
    animation:ftPulse 3.8s ease-in-out calc(1.9s + var(--i)*.30s) infinite;
  }
  /* the card's own content has to outrank the wash, or the tint lands on top of
     the label and the icon instead of behind them */
  .ft-label,.ft-tile{position:relative;z-index:1}
  @keyframes ftPulse{
    0%,100%{opacity:0}
    12%    {opacity:.25}
    40%    {opacity:0}
  }
  .ft-label{font-size:28px;font-weight:580;letter-spacing:-.42px;line-height:1.065;
    color:#bcbdc0;text-box-trim:trim-both;text-box-edge:cap alphabetic}
  /* The wells arrive empty with the row; the icons then land in them left to
     right. The gap between them is wide on purpose — across a booth a 70ms
     stagger reads as all five at once, and that is what left the card looking
     like it needed a spinner to prove something was happening. Each pop lasts
     longer than the gap, so the row fills as one travelling wave rather than
     five separate ticks. */
  .ft-tile{width:96px;height:96px;flex:none;background:#181818;border-radius:9.433px;
    display:flex;align-items:center;justify-content:center}
  .ft-tile svg{width:48px;height:48px;display:block;
    opacity:0;transform:scale(.62);
    transition:opacity var(--dur-1) ease,transform var(--dur-2) var(--ease-pop);
    transition-delay:calc(.62s + var(--i)*.19s)}
  .slide.active .ft-tile svg{opacity:1;transform:none}

  /* =======================================================================
     card 3 — the customer quote, as the storyboard's two-panel spread.

     Geometry is Figma's and absolute: the lime pull-quote at 229,307
     (938x465) and the customer panel at 1183,307 (507x465), 16px apart on
     the same 24px radius. Both are `justify-between`, which is what puts the
     attribution and the blurb on a shared bottom edge across the spread —
     the alignment reads even though the two columns hold different content.
     ======================================================================= */
  .qt-wrap{position:absolute;inset:0}
  /* Fade fast, move slow. The panels sit inside the slide's own 520ms
     crossfade, so a long fade here would compound into a second one — and on
     the lime block that is visible as a colour, not just a dimming: part-opaque
     #d8ff6e over near-black is olive, which is nowhere in the palette. A short
     ramp gets the fill to its true colour early and leaves the longer rise to
     carry the motion. */
  .qt-panel{position:absolute;top:307px;height:465px;padding:64px;border-radius:24px;
    display:flex;flex-direction:column;justify-content:space-between;
    opacity:0;transform:translateY(24px);
    transition:opacity var(--dur-1) ease,transform var(--dur-3) var(--ease-out)}
  .slide.active .qt-panel{opacity:1;transform:none}
  /* the quote leads and the customer panel follows ~220ms later, so the pair
     reads as a claim and then its source rather than one wide banner */
  .qt-say{left:229px;width:938px;background:#d8ff6e;color:#000;transition-delay:.08s}
  .qt-who{left:1183px;width:507px;background:#0c0c0c;border:1px solid #181818;
    transition-delay:.30s}

  /* Contents ride on top of their own panel's move, so the two transforms
     compound: the spread arrives with some depth rather than as two flat
     rectangles sliding up together. Each child sets its own delay below. */
  .qt-in{opacity:0;transform:translateY(12px);
    transition:opacity var(--dur-2) ease,transform var(--dur-3) var(--ease-out)}
  .slide.active .qt-in{opacity:1;transform:none}
  /* The margin is tracking compensation, not a nudge. CSS adds letter-spacing
     after the last glyph on a line; Figma only puts it between glyphs. At this
     tracking that makes every candidate line 0.96px narrower here than in the
     design, which is enough to pull one more word up onto line 2 and change the
     rag. Giving the measuring box back that 0.96px makes lines break where the
     design breaks them. Glyphs don't move — the text is left-aligned. */
  .qt-quote{font-size:64px;font-weight:600;line-height:1.065;letter-spacing:-.96px;
    margin-right:.96px;
    text-box-trim:trim-both;text-box-edge:cap alphabetic;transition-delay:.26s}
  .qt-by{font-size:24px;font-weight:400;line-height:1.4;transition-delay:.42s}
  .qt-head{display:flex;flex-direction:column;align-items:flex-start;gap:24px}
  .qt-logo{width:183px;transition-delay:.50s}
  .qt-logo svg{width:100%;height:auto;display:block}
  .qt-tag{background:#181818;border-radius:20px;padding:4px 12px;
    font-family:var(--cmono);font-size:13px;line-height:1.2;letter-spacing:.13px;
    text-transform:uppercase;color:#a7a7a7;transition-delay:.58s}
  .qt-desc{font-size:20px;font-weight:400;line-height:1.4;color:#fff;
    transition-delay:.66s}

  /* =======================================================================
     card 4 — the trusted-by wall.

     The marks are not on a grid. The storyboard places all eight optically —
     column centres drift by up to 13px between the two rows and the vertical
     centres by up to 16px — because these logos have wildly different visual
     weight at a common width. So each one is centred on its own slot from the
     design (LW_SLOTS) at its own exported size (LOGO_BOX); a `repeat(4,1fr)`
     grid gets close but is visibly wrong at booth scale.

     Every mark is placed with left/top rather than a centring translate,
     because the entrance animates `transform` and the two would fight.
     ======================================================================= */
  .lw-wrap{position:absolute;inset:0}
  .lw-title{position:absolute;top:175px;left:302px;width:1316px;text-align:center;
    font-size:32px;font-weight:580;line-height:1.065;letter-spacing:-.48px;
    color:#bcbdc0;text-box-trim:trim-both;text-box-edge:cap alphabetic;
    opacity:0;transform:translateY(12px);
    transition:opacity var(--dur-1) ease,transform var(--dur-3) var(--ease-out)}
  .slide.active .lw-title{opacity:1;transform:none}
  /* Reading order, 75ms apart. The old wall brought all eight up on one 1.1s
     fade, which at this size reads as the slide itself getting brighter rather
     than as logos arriving. A stagger gives the wall a direction to assemble
     in, and the rise is what makes each mark read as landing. */
  .lw-logo{position:absolute;color:#fff;
    opacity:0;transform:translateY(16px);
    transition:opacity var(--dur-1) ease,transform var(--dur-3) var(--ease-out);
    transition-delay:calc(.30s + var(--i)*.075s)}
  .slide.active .lw-logo{opacity:1;transform:none}
  .lw-logo svg{width:100%;height:100%;display:block}
  /* fallback when a name has no mark in assets/logos — set it in type instead */
  .lw-word{position:absolute;font-size:34px;font-weight:600;letter-spacing:-0.01em;
    color:#EDEDED;white-space:nowrap;line-height:1;
    opacity:0;transform:translateY(16px);
    transition:opacity var(--dur-1) ease,transform var(--dur-3) var(--ease-out);
    transition-delay:calc(.30s + var(--i)*.075s)}
  .slide.active .lw-word{opacity:1;transform:none}

  /* =======================================================================
     card 5 — the Webflow marketplace listing, and a cursor installing it.

     The listing is the storyboard's, rebuilt rather than dropped in as the
     exported bitmap, because the button has to change state. Geometry is
     Figma's: a 508x244 panel at 706,591 holding an 89px app tile beside a
     313px column, and every text block is trimmed to its cap box so the 11 /
     13 / 32px gaps in the design are real gaps between glyphs.
     ======================================================================= */
  .wf-wrap{position:absolute;inset:0}
  .wf-panel{position:absolute;left:706px;top:591px;width:508px;height:244px;
    display:flex;gap:24px;align-items:flex-start;padding:40px;
    background:#0c0c0c;border:1px solid #181818;border-radius:24px;
    opacity:0;transform:translateY(24px);
    transition:opacity var(--dur-1) ease,transform var(--dur-3) var(--ease-out);
    transition-delay:.36s}
  .slide.active .wf-panel{opacity:1;transform:none}

  /* the panel's contents land 60ms apart behind it — the tile first, so the
     eye has something to fix on while the text arrives */
  .wf-in{opacity:0;transform:translateY(10px);
    transition:opacity var(--dur-1) ease,transform var(--dur-2) var(--ease-out);
    transition-delay:calc(.50s + var(--i,0)*.06s)}
  .slide.active .wf-in{opacity:1;transform:none}

  .wf-tile{width:89px;height:89px;flex:none;border-radius:8px;
    background:#181818;border:1px solid #181818;
    display:flex;align-items:center;justify-content:center}
  .wf-tile svg{width:51px;height:51px;display:block}
  /* the storyboard's app icon is the deck's own glyph in brand yellow */
  .wf-tile svg path{fill:var(--brand)}

  .wf-col{width:313px;display:flex;flex-direction:column;gap:32px}
  .wf-name{font-size:16px;font-weight:500;line-height:1.065;letter-spacing:-.24px;
    color:#fff;text-box-trim:trim-both;text-box-edge:cap alphabetic}
  .wf-meta{display:flex;align-items:center;gap:4px;width:max-content;margin-top:11px}
  .wf-meta svg{width:16px;height:16px;display:block}
  .wf-dl{font-size:14px;font-weight:500;line-height:1.065;letter-spacing:-.21px;
    color:#888;text-box-trim:trim-both;text-box-edge:cap alphabetic}
  .wf-desc{margin-top:13px;font-size:14px;font-weight:500;line-height:1.5;
    letter-spacing:-.21px;color:#888;
    text-box-trim:trim-both;text-box-edge:cap alphabetic}

  /* Entrance and press live on different elements on purpose: the wrapper owns
     the translate that brings the button in, the button owns the scale it
     takes on press. One element can't do both without the two fighting over
     `transform`. */
  .wf-btnwrap{position:relative;width:111px;height:47px}
  .wf-btn{position:absolute;inset:0;border-radius:4px;overflow:hidden;
    background:#336DED;
    transition:transform 140ms var(--ease-out),background-color 260ms ease}
  .wf-btn.press{transform:scale(.97)}
  .wf-btn.pop{transform:scale(1.03)}
  .wf-btn[data-state="2"]{background:var(--ok)}
  /* the install progress: a lighter wash sweeping the fill left to right.
     linear, because it stands for elapsed work rather than a UI gesture */
  .wf-sweep{position:absolute;inset:0;background:rgba(255,255,255,.22);
    clip-path:inset(0 100% 0 0)}
  .wf-btn[data-state="1"] .wf-sweep{clip-path:inset(0 0 0 0);
    transition:clip-path 1.15s linear}

  /* Three labels stacked in one box. Only the active one is up; the others sit
     8px away in the direction they came from or are headed.

     The two halves of the swap are deliberately not symmetric. The old label
     leaves in 130ms and the new one doesn't start until 120ms in, so the two
     words are never both legible — crossfade them evenly and you read
     "Installing" printed over "Install App". The blur covers what overlap is
     left, bridging them into one change of state rather than two objects. */
  .wf-lbl{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;gap:5px;
    /* 15px/600 is what the exported button measures out to — Webflow's own UI
       font isn't Inter, so this is matched on the label's width, not its name */
    font-size:15px;font-weight:600;color:#fff;white-space:nowrap;
    opacity:0;transform:translateY(8px);filter:blur(4px);
    transition:opacity 130ms ease,transform 130ms var(--ease-out),filter 130ms ease}
  .wf-btn[data-state="0"] .wf-lbl[data-s="0"],
  .wf-btn[data-state="1"] .wf-lbl[data-s="1"],
  .wf-btn[data-state="2"] .wf-lbl[data-s="2"]{
    opacity:1;transform:none;filter:none;
    transition:opacity 200ms ease 120ms,transform 240ms var(--ease-out) 120ms,
               filter 200ms ease 120ms}
  /* an outgoing label leaves upward, the way the incoming one arrived */
  .wf-btn[data-state="1"] .wf-lbl[data-s="0"],
  .wf-btn[data-state="2"] .wf-lbl[data-s="0"],
  .wf-btn[data-state="2"] .wf-lbl[data-s="1"]{transform:translateY(-8px)}
  .wf-btn[data-state="2"] .wf-lbl{color:#08210f}
  .wf-check{width:14px;height:14px;display:block;flex:none}
  .wf-check path{fill:none;stroke:currentColor;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:22;stroke-dashoffset:22}
  /* the tick draws itself once the fill has turned and the word has landed —
     a mark being made, not a glyph that was always there */
  .wf-btn[data-state="2"] .wf-check path{stroke-dashoffset:0;
    transition:stroke-dashoffset 300ms var(--ease-out) 230ms}

  /* the pointer goes in as a data URI rather than inline SVG: card 1 already
     inlines this mark, and two copies in one document collide on the ids its
     mask references — the second one then renders as nothing */
  .wf-cursor{position:absolute;left:0;top:0;width:18px;height:25px;z-index:4;
    display:block;opacity:0;filter:drop-shadow(1px 0 1px rgba(0,0,0,.35));
    will-change:transform}

  /* card 6 — the bigger picture: one headline over the full pipeline as a
     chip row (storyboard frame 14). Its own background so it reads as a
     step up from the product cards. */
  /* the outer stop is transparent, not solid, so the ambient substrate reads
     through the card's "bigger picture" tint instead of being masked by it */
  .sc-wrap{position:absolute;inset:0;
    background:radial-gradient(130% 100% at 50% 8%,rgba(20,23,38,.92) 0%,rgba(11,11,15,0) 62%)}
  /* .reveal animates transform, so anything wearing it is centred with explicit
     offsets rather than translateX(-50%) — otherwise the two fight and the
     element slides sideways as it enters. Offsets are the storyboard's x. */
  .sc-title{position:absolute;top:var(--head-y);left:246px;width:1428px;text-align:center;
    font-size:var(--h-size);font-weight:var(--h-weight);letter-spacing:var(--h-ls);line-height:var(--h-lh);color:var(--ink)}
  .sc-panel{position:absolute;left:523px;top:579px;
    width:874px;height:125px;border-radius:20px;background:#141416;
    box-shadow:inset 0 0 0 1px rgba(212,226,255,.05),0 24px 60px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center}
  .sc-cell{opacity:0;transform:translateY(8px);transition:opacity .34s ease,transform .44s var(--ease-out);
    transition-delay:calc(.45s + var(--i)*.09s)}
  .slide.active .sc-cell{opacity:1;transform:none}
  .sc-chip{height:45px;padding:0 32px;display:flex;align-items:center;border-radius:10px;
    font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-dim);border:1px solid rgba(255,255,255,.10);background:#101012}
  /* the lit pulse travels chip to chip; the entrance lives on .sc-cell so the
     two never fight over the same properties */
  .slide.active .sc-chip{animation:scLit 4.4s var(--ease-in-out) infinite;animation-delay:calc(1.1s + var(--i)*.3s)}
  @keyframes scLit{
    0%,100%{color:var(--ink-dim);border-color:rgba(255,255,255,.10);background:#101012}
    6%,14%{color:var(--ink);border-color:rgba(255,255,255,.30);background:#17171a}
  }
  .sc-conn{width:57px;height:9px;display:flex;align-items:center;justify-content:space-between}
  .sc-conn i{width:8px;height:8px;flex:none;border:1px solid rgba(255,255,255,.22);border-radius:2px}
  .sc-conn s{flex:1;height:1px;background:rgba(255,255,255,.18);text-decoration:none}

  /* card 7 — the booth QR, at frame 184:5666's geometry. Pinned rather than
     stacked so it can never push the headline off the centre line.

     White modules straight onto the frame, no white plate behind them: that is
     the design, and the plate it replaces was a bright 196px rectangle sitting
     under a deliberately dim backdrop, which fought the headline for the eye.
     It does make this a reverse-polarity code — scanners expect dark on light.
     Current phone cameras read inverted codes without complaint, so this is
     safe for a booth, but it is the reason the code is drawn oversized: the
     modules are ~8px, well past what a camera needs, which buys back the
     margin that the inversion spends. */
  .hb-outro-qr{position:absolute;left:857px;top:711px;
    width:204px;height:204px;z-index:2}
  .hb-outro-qr svg{width:100%;height:100%;display:block}
  .hb-sign{position:absolute;left:867px;top:186px;width:185px;height:33px;z-index:2}
  .hb-sign svg{height:100%;width:auto;display:block}

  /* The corner files are backdrop, not content: the storyboard runs their
     telemetry at 9px, well under anything readable across a stand, and that is
     the point — they are texture that says "files moving" and the centre line
     is what gets read. */
  .hb-outro-mode .hb-meta{font-size:9px;line-height:1.51;letter-spacing:.45px;
    text-transform:uppercase;color:#595959}
  .hb-outro-mode .hb-meta .b{color:#8e8e8e;font-weight:400}
  .hb-outro-mode .hb-meta .g{color:#52e866;font-weight:400}
  .hb-outro-mode .hb-meta .t{color:#008b4b;font-weight:400}
  .hb-outro-mode .hb-line{min-height:1.51em}
  .hb-outro-mode .hb-card{border-radius:22px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .hb-outro-mode .hb-card.framed{border:1.336px dashed rgba(255,255,255,.12);
    background:#000;padding:6px;border-radius:22.71px;box-shadow:none}
  .hb-outro-mode .hb-card.framed img{border-radius:14px}
  .hb-outro-mode .hb-cursor{width:5px;height:10px;vertical-align:-1px}
  .hb-outro-mode .hb-led{width:6.72px;height:6.72px;background:#3eff51;border-radius:0}
  .hb-outro-mode .hb-dot{border-radius:0}

  @media (prefers-reduced-motion:reduce){
    /* entrance choreography collapses to an instant jump to the settled state
       (opacity cross-fades that aid comprehension are kept where they exist) */
    .di-widget,.di-row,.di-drop,.di-check,.di-ring,.di-bin,.ft-card,.ft-tile svg,.sc-cell,
    .qt-panel,.qt-in,.lw-title,.lw-logo,.lw-word,.pd-zone,.pd-ph,.pd-badge,
    .reveal,.reveal.fx-stagger .w,.reveal.fx-clip .cl,.slide,.rv-photo,.rv-photo img,.rv-photo::after,
    .pl-row.pl-anim .pl-pill,.pl-row.pl-anim .pl-line,.pl-row.pl-anim .pl-line span,
    .mk-card,.mk-overlay,.cd-window.reveal,.cd-chrome i,
    .up-base,.up-progress,.up-progress .trk i,.up-hand,.up-drag,.up-cursor,
    .up-phase1,.up-phase2,.up-nodes,
    .ch2-node,.ch2-lines,.st-sub,.cd-run,.cd-cursor,
    .wf-panel,.wf-in,.wf-btn,.wf-lbl,.wf-sweep,
    .wf-btn[data-state="1"] .wf-sweep,.wf-btn[data-state="2"] .wf-check path,
    .pl-shine .pl-pill{
      transition:none!important;
    }
    /* stop looping / ambient motion and pin elements to their final state */
    .slide.active .hb-node{animation:none!important}
    .hb-node{opacity:1!important;transform:none!important}
    .hb-node.float .hb-inner,.hb-globe.spin,.hb-dot.pulse,.hb-cursor{animation:none!important}
    .hb-mark path{animation:none!important;opacity:.62}
    .hb-wave,.hb-wave i{animation:none!important}
    /* the capability wash is decoration on a settled row; nothing is lost by
       pinning it off, whereas a looping colour pulse is exactly the sort of
       thing reduced motion is asking to be spared */
    .ft-card::before{animation:none!important;opacity:0}
    .pl-shine .pl-pill::after{animation:none!important;opacity:0!important}
    .slide.active .sc-chip{animation:none!important}
    .pd-dots[data-state="working"] i{animation:none!important}
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">
    <div id="substrate"><div class="sb-field" id="sbField"></div></div>
    <div id="slides"></div>
    <div id="gridOverlay"><div class="gi"></div></div>
    <div class="watermark" id="watermark"></div>
    <div id="progress"><i id="progressBar"></i></div>
  </div>
</div>

<button id="gear" title="Edit slides (E)">⚙</button>
<div id="hint">E edit · Space pause · ←/→ nav · F fullscreen · G grid</div>

<aside id="editor">
  <div class="ed-head">
    <h2>Slide editor</h2>
    <button class="x" id="edClose">✕</button>
  </div>
  <div class="ed-body">
    <div class="ed-global">
      <h3>Deck settings</h3>
      <div class="row2">
        <label class="f"><span>Default duration (s)</span>
          <input type="number" id="gDur" min="2" step="1"></label>
        <label class="f"><span>Fade (ms)</span>
          <input type="number" id="gFade" min="0" step="100"></label>
      </div>
      <label class="chk"><input type="checkbox" id="gLogo"> Show Uploadcare glyph (bottom-right, every slide)</label>
    </div>
    <div id="cards"></div>
  </div>
  <div class="ed-foot">
    <div id="addmenu">
      <button class="btn accent" id="addBtn">+ Add slide</button>
      <div id="addlist">
        <button data-type="statement">Statement</button>
        <button data-type="number">Big number</button>
        <button data-type="chart">Animated chart</button>
        <button data-type="stats">Stats trio</button>
        <button data-type="logo">Logo / brand</button>
        <button data-type="logoAnim">Logo animation</button>
        <button data-type="board">File board (hero)</button>
        <button data-type="reveal">Reveal (mosaic → photo)</button>
        <button data-type="mockup">UI mockup</button>
        <button data-type="code">Code / terminal</button>
        <button data-type="upload">Upload demo</button>
        <button data-type="chaos">Chaos graph</button>
        <button data-type="install">Install app</button>
        <button data-type="dropin">Drop-in form</button>
        <button data-type="features">Feature row</button>
        <button data-type="quote2">Customer quote</button>
        <button data-type="logos">Logo wall</button>
        <button data-type="scale">Scale / pipeline</button>
        <button data-type="pipeline">How-it-works demo</button>
      </div>
    </div>
    <button class="btn" id="ioBtn">Export / Import</button>
    <button class="btn" id="fsBtn">Fullscreen</button>
  </div>
</aside>

<div id="io">
  <div class="box">
    <h3 style="font-size:14px;margin-bottom:10px">Deck configuration (JSON)</h3>
    <p style="font-size:12px;color:#8a8a92;margin-bottom:12px">Copy this to save your deck, or paste a saved config and press Apply. You can also download it as a file.</p>
    <textarea id="ioText" spellcheck="false"></textarea>
    <div class="actions">
      <button class="btn" id="ioDownload">Download .json</button>
      <button class="btn" id="ioClose">Close</button>
      <button class="btn accent" id="ioApply">Apply</button>
    </div>
  </div>
