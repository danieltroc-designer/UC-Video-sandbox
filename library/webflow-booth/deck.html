        <label class="f"><span>Role</span><input type="text" data-f="role" value="${esc(s.role||'')}"></label>
      </div>
      <div class="row2">
        <label class="f"><span>Company</span><input type="text" data-f="company" value="${esc(s.company||'')}"></label>
        <label class="f"><span>Wordmark (a name in assets/logos)</span><input type="text" data-f="mark" value="${esc(s.mark||'')}"></label>
      </div>
      <label class="f"><span>Category chip (blank hides it)</span><input type="text" data-f="tag" value="${esc(s.tag||'')}"></label>
      <label class="f"><span>About the customer</span><textarea data-f="about">${esc(s.about||'')}</textarea></label>
      <p style="font-size:12px;color:#7a7a82;margin-top:10px;line-height:1.5">Name, role and company are joined with commas into the one attribution line. The lime quote panel enters first and the customer panel follows ~220ms later, each with its own contents a beat behind it; the whole spread settles by ~1.25s.</p>`;
    case 'logos': return dur+`
      <label class="f"><span>Top label (optional)</span><input type="text" data-f="title" value="${esc(s.title||'')}"></label>
      <label class="f"><span>Logos (comma separated — 8 for a 2×4 grid)</span><textarea data-f="logos">${esc(s.logos||'')}</textarea></label>
      <p style="font-size:12px;color:#7a7a82;margin-top:10px;line-height:1.5">Names are matched to the real SVG marks in assets/logos (accents and case are ignored); an unknown name falls back to the wordmark set in type. Each mark is centred on its own slot from the storyboard at its own exported size, so the eight are placed optically rather than on a grid — the list fills the slots in reading order and anything past the eighth is dropped. They land 75ms apart.</p>`;
    case 'scale': return dur+`
      <label class="f"><span>Heading</span><textarea data-f="heading">${esc(s.heading||'')}</textarea></label>
      <label class="f"><span>Pipeline steps (comma separated)</span><input type="text" data-f="steps" value="${esc(s.steps||'Upload, Store, Transform, Optimize, Deliver')}"></label>
      <p style="font-size:12px;color:#7a7a82;margin-top:10px;line-height:1.5">Headline over the full pipeline as a chip row, with a lit pulse travelling through it. This card has its own bigger-picture background tint.</p>`;
    case 'pipeline': return dur+`
      <label class="f"><span>Heading</span><input type="text" data-f="heading" value="${esc(s.heading||'')}"></label>
      <label class="f"><span>Subhead</span><input type="text" data-f="subhead" value="${esc(s.subhead||'')}"></label>
      <label class="f"><span>Analysis readout (one per line, *stars* set a value in white)</span><textarea data-f="analysis">${esc((s.analysis||PD_ANALYSIS).join('\n'))}</textarea></label>
      <p style="font-size:12px;color:#7a7a82;margin-top:10px;line-height:1.5">The website's three-panel demo: a file is dragged in and uploaded, the grid analyses it, and the CDN URL builds itself while the picture becomes what each transform describes. It plays once — no replay. The score runs ~11.5s, so give the card 13s or more.</p>`;
    case 'upload': return dur+`
      <label class="f"><span>Kicker (optional)</span><input type="text" data-f="kicker" value="${esc(s.kicker||'')}"></label>
      <label class="f"><span>Heading</span><textarea data-f="heading">${esc(headText(s))}</textarea></label>
      <label class="f"><span>After-upload heading</span><textarea data-f="heading2">${esc(headText2(s))}</textarea></label>
      <label class="chk"><input type="checkbox" data-f="outcome" ${s.outcome!==false?'checked':''}> Play the "side project" outcome (headline swap + nodes)</label>
      <label class="f"><span>Progress duration (ms — how slowly the bar fills)</span><input type="number" min="800" max="12000" step="100" data-f="progressMs" value="${s.progressMs||3000}"></label>
      <button class="btn sm" data-act="replay" style="margin-top:14px">↻ Replay animation</button>
      <p style="font-size:12px;color:#7a7a82;margin-top:14px;line-height:1.5">Cursor drags the photo into the dropzone (static → hover → uploading), then the progress bar fills. When it completes, the headline cross-fades to the after-upload heading with a File-uploaded tag, and 2s later the maintenance-nodes network blooms in behind them. Assets come from assets/photos.</p>`;
  }
  return dur;
}

function renderCards(){
  cardsEl.innerHTML = deck.slides.map((s,i)=>`
    <div class="card ${i===expanded?'expanded':''} ${i===idx?'current':''}" data-i="${i}">
      <div class="card-top">
        <span class="type">${TYPE_LABEL[s.type]||s.type}</span>
        <span class="title">${esc(slideTitle(s))||'—'}</span>
        <button class="mini" data-act="up" title="Move up">↑</button>
        <button class="mini" data-act="down" title="Move down">↓</button>
        <button class="mini" data-act="dup" title="Duplicate">⧉</button>
        <button class="mini" data-act="del" title="Delete">✕</button>
      </div>
      <div class="card-fields">${fieldsFor(s,i)}</div>
    </div>`).join('');
}
function syncCards(){
  [...cardsEl.children].forEach((c,i)=>c.classList.toggle('current', i===idx));
}

/* live edit — write field values into deck and re-render deck (debounced) */
let rerenderT;
function scheduleRerender(){
  clearTimeout(rerenderT);
  rerenderT = setTimeout(()=>{
    const keep = idx;
    renderDeck();
    enter(keep);
  }, 350);
}
cardsEl.addEventListener('input', e=>{
  const card = e.target.closest('.card'); if(!card) return;
  const s = deck.slides[+card.dataset.i];
  const f = e.target.dataset.f, ifield = e.target.dataset.if;
  if (ifield!=null){
    s.items[+e.target.dataset.item][ifield] = e.target.value;
  } else if (f){
    if (e.target.type==='checkbox') s[f]=e.target.checked;
    else if (e.target.type==='number') s[f]=parseFloat(e.target.value)||0;
    else s[f]=e.target.value;
  }
  const titleEl = card.querySelector('.title');
  if (titleEl) titleEl.textContent = slideTitle(s)||'—';
  scheduleRerender();
});
cardsEl.addEventListener('click', e=>{
  const card = e.target.closest('.card'); if(!card) return;
  const i = +card.dataset.i;
  const act = e.target.dataset.act;
  if (act){
    e.stopPropagation();
    if (act==='replay'){ enter(i); return; }
    if (act==='del'){ if(deck.slides.length>1){ deck.slides.splice(i,1); expanded=-1; } }
    if (act==='dup'){ deck.slides.splice(i+1,0,JSON.parse(JSON.stringify(deck.slides[i]))); }
    if (act==='up' && i>0){ [deck.slides[i-1],deck.slides[i]]=[deck.slides[i],deck.slides[i-1]]; }
    if (act==='down' && i<deck.slides.length-1){ [deck.slides[i+1],deck.slides[i]]=[deck.slides[i],deck.slides[i+1]]; }
    renderCards(); renderDeck(); enter(Math.min(idx, deck.slides.length-1));
    return;
  }
  if (e.target.closest('.card-top')){
    // jump the show to this slide, and expand
    expanded = (expanded===i) ? -1 : i;
    renderCards();
    enter(i);
  }
});

/* global settings */
const gDur=document.getElementById('gDur'), gFade=document.getElementById('gFade'), gLogo=document.getElementById('gLogo');
function syncGlobals(){
  gDur.value=deck.settings.duration; gFade.value=deck.settings.fade; gLogo.checked=!!deck.settings.watermark;
}
gDur.oninput = ()=>{ deck.settings.duration=parseFloat(gDur.value)||8; };
gFade.oninput = ()=>{ deck.settings.fade=parseFloat(gFade.value)||0; scheduleRerender(); };
gLogo.onchange = ()=>{ deck.settings.watermark=gLogo.checked; enter(idx); };

/* add menu */
const NEW = {
  statement:{type:'statement',duration:8,kicker:'',heading:'Your headline goes here.',line2mono:false},
  number:{type:'number',duration:8,kicker:'',prefix:'',value:100,decimals:0,suffix:'+',label:'describe the number'},
  chart:{type:'chart',duration:11,big:'10X',label:'what grew',startLabel:'1%',endLabel:'10%',points:'1,2,2.5,4,6,7,9,10'},
  stats:{type:'stats',duration:9,kicker:'',items:[{value:'1',label:'one'},{value:'2',label:'two'},{value:'3',label:'three'}]},
  logo:{type:'logo',duration:9,tagline:'Complete upload\nand delivery platform',sub:''},
  logoAnim:{type:'logoAnim',duration:10,variant:'assemble',tagline:'uploadcare.com',tagmono:true},
  board:{type:'board',duration:11,layout:'hero',title:'Complete upload\nand delivery platform',foot:'© 2011–2026 UPLOADCARE INC.',globe:true,float:true,typing:true,typeSpeed:16},
  reveal:{type:'reveal',duration:8,kicker:'',line:'Every image starts with an upload.',reveal:true,textFx:'stagger'},
  mockup:{type:'mockup',duration:8,kicker:'',heading:'Everyone can build a file uploader.',kind:'uploader'},
  code:{type:'code',duration:10,kicker:'',line:'Ask your coding\nagent about us.',cmd:'uploadcare file upload my-image.jpg',lines:'Uploading my-image.jpg\u2026\n\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588  100%\n\u2713 https://ucarecdn.com/\u2026/my-image.jpg\nDone in 0.4s.',typeSpeed:18,textFx:'weight'},
  upload:{type:'upload',duration:12,kicker:'',heading:'As simple as drag and drop.',heading2:'Then it becomes a side project that never ends.',outcome:true,progressMs:3000,textFx:'weight'},
  chaos:{type:'chaos',duration:12,kicker:'',heading:'Then it becomes\na side project\nthat never ends.',textFx:'stagger'},
  install:{type:'install',duration:8,heading:'No code. It\u2019s already\nin your Webflow Marketplace.',sub:'A native File Uploader app, approved by Webflow.',app:'Uploadcare File Uploader',downloads:'1k+',blurb:'Accelerate time to market with a no-code plugin for scalable and secure end-user file uploads.'},
  dropin:{type:'dropin',duration:7.5,heading:'Uploads that just work.',sub:'Any file, any source, safe.',textFx:'stagger'},
  features:{type:'features',duration:6},
  quote2:{type:'quote2',duration:8,quote:'It just works out of the box without having to think about it.',by:'Luca Mausberg',role:'Co-founder',company:'Marko',mark:'marko',tag:'Secondhand marketplace',about:'Marko is Switzerland\u2019s community-driven secondhand marketplace, built for Gen Z and millennial consumers who care about sustainability, affordability, and style.'},
  logos:{type:'logos',duration:5,title:'Trusted by',logos:'Zapier, SoundCloud, L\u2019Or\u00e9al, Sequoia, UserTesting, Prezly, Aryeo, marko'},
  scale:{type:'scale',duration:6,heading:'Set it up once, use it on every client site, and go beyond uploads with the full pipeline via API.',steps:'Upload, Store, Transform, Optimize, Deliver'},
  pipeline:{type:'pipeline',duration:13,heading:'Set it up once, use it on every client site',subhead:'Go beyond uploads with the full pipeline via API.'}
};
const addBtn=document.getElementById('addBtn'), addList=document.getElementById('addlist');
addBtn.onclick=()=>addList.classList.toggle('open');
addList.onclick=e=>{
  const t=e.target.dataset.type; if(!t) return;
  deck.slides.push(JSON.parse(JSON.stringify(NEW[t])));
  addList.classList.remove('open');
  expanded=deck.slides.length-1;
  renderCards(); renderDeck(); enter(deck.slides.length-1);
  cardsEl.lastElementChild.scrollIntoView({behavior:'smooth'});
};

/* editor open/close */
const gear=document.getElementById('gear');
function openEditor(){ editor.classList.add('open'); renderCards(); syncGlobals(); }
function closeEditor(){ editor.classList.remove('open'); addList.classList.remove('open'); }
gear.onclick=openEditor;
document.getElementById('edClose').onclick=closeEditor;

/* export / import */
const io=document.getElementById('io'), ioText=document.getElementById('ioText');
document.getElementById('ioBtn').onclick=()=>{ ioText.value=JSON.stringify(deck,null,2); io.classList.add('open'); };
document.getElementById('ioClose').onclick=()=>io.classList.remove('open');
document.getElementById('ioApply').onclick=()=>{
  try{
    const d=JSON.parse(ioText.value);
    if(!d.slides||!d.settings) throw new Error('missing slides/settings');
    deck=d; io.classList.remove('open');
    renderDeck(); renderCards(); syncGlobals(); enter(0);
  }catch(err){ alert('Invalid JSON: '+err.message); }
};
document.getElementById('ioDownload').onclick=()=>{
  const blob=new Blob([JSON.stringify(deck,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='uploadcare-deck.json'; a.click();
  URL.revokeObjectURL(a.href);
};

/* fullscreen */
function toggleFS(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}
document.getElementById('fsBtn').onclick=toggleFS;

/* keyboard */
addEventListener('keydown', e=>{
  if (e.target.matches('input,textarea,select')) return;
  if (e.key==='ArrowRight'){ enter(idx+1); }
  if (e.key==='ArrowLeft'){ enter(idx-1); }
  if (e.key===' '){ e.preventDefault(); togglePlay(); }
  if (e.key==='f'||e.key==='F'){ toggleFS(); }
  if (e.key==='e'||e.key==='E'){ editor.classList.contains('open')?closeEditor():openEditor(); }
  if (e.key==='g'||e.key==='G'){ gridOverlay.classList.toggle('show'); }
  if (e.key==='Escape'){ closeEditor(); io.classList.remove('open'); }
});

/* auto-hide chrome + cursor when idle (kiosk friendly) */
let idleT;
function wake(){
  document.body.classList.add('ui-awake');
  document.body.style.cursor='';
  clearTimeout(idleT);
  idleT=setTimeout(()=>{
    document.body.classList.remove('ui-awake');
    if (!editor.classList.contains('open')) document.body.style.cursor='none';
  }, 3500);
}
addEventListener('mousemove', wake);
addEventListener('touchstart', wake);
wake();

/* boot */
// The sandbox reads the card list from here (titles, types, durations).
window.__deckInfo = ()=>deck.slides.map((s,i)=>({
  index:i, type:s.type, label:TYPE_LABEL[s.type]||s.type, title:slideTitle(s), duration:slideDuration(i)/1000,
  formats:['landscape', ...(CARD_FORMATS[s.type]||[])],
}));
if (EMBED){
  playing = false;                      // one card, no auto-advance
  // Build every card now, so the one we play animates in from its resting
  // (inactive) styles — its entrances are transitions on .slide.active.
  renderDeck();
  let substrate = false;
  const start = ()=>{
    if (!substrate){ substrate = true; startSubstrate(); }
    getComputedStyle(slidesEl).opacity;
    enter(EMBED.card);
  };
  window.__deckStart = start;
  // the sandbox preview restarts a card (or switches card) without a reload
  window.__deckRestart = (card = EMBED.card)=>{ EMBED.card = card; renderDeck(); start(); };
  if (!EMBED.hold) requestAnimationFrame(start);
} else {
  startSubstrate();
  renderDeck();
  enter(0);
}
</script>
